<style>
:root{
  --paper:#F8E6E0;      /* logo blush */
  --paper2:#F2D8CF;
  --ink:#1A1F45;        /* deep indigo ink */
  --ink2:#4B4F6E;
  --blue:#0B53E0;       /* logo blue */
  --plum:#7B4562;       /* logo plum */
  --sign:#F2C14E;       /* painted sign yellow */
  --neon:#FF3D7F;
  --white:#FFFDFB;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --h1:clamp(36px,5.2vw,66px); --h2:clamp(28px,3.4vw,44px); --h3:22px; --lead:clamp(17px,1.5vw,19px);
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } *{ animation:none !important; transition:none !important; } }
body{ margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 var(--body); -webkit-text-size-adjust:100%; }
a{ color:var(--blue); }
:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; border-radius:4px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 clamp(18px,4vw,40px); }
h1,h2,h3{ font-family:var(--display); font-weight:600; margin:0; line-height:1.05; letter-spacing:-.015em; }
h3{ font-weight:600; font-size:var(--h3); line-height:1.2; }
p{ margin:0; }

/* ---------- top ---------- */
.top{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; }
.brand{ display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); }
.brand svg{ width:30px; height:46px; }
.brand b{ font-family:var(--display); font-weight:600; font-size:22px; display:block; line-height:1; }
.brand span{ font-size:13px; color:var(--ink2); }
.nav{ display:flex; gap:22px; font-weight:600; font-size:15px; }
.nav a{ color:var(--ink); text-decoration:none; }
.nav a:hover{ text-decoration:underline; text-underline-offset:4px; }
.nav .cta{ background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:999px; }
.nav .cta:hover{ text-decoration:none; background:var(--blue); }


/* ---------- hero ---------- */
.hero{ padding:clamp(28px,6vw,70px) 0 34px; }
.hero h1{ font-size:var(--h1); max-width:16ch; }
.hero h1 .l2{ display:block; color:var(--blue); }
.hero .lede{ margin-top:22px; max-width:58ch; font-size:var(--lead); color:var(--ink2); }
.langs{ margin-top:22px; display:flex; align-items:center; gap:12px; font-weight:600; min-height:30px; }
.langs .tag{ font-size:13px; color:var(--plum); border:1.5px solid var(--plum); border-radius:999px; padding:2px 10px; }
.langs .say{ font-size:18px; }
.langs .say span{ display:inline-block; animation:swap 0.5s ease; }
@keyframes swap{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

/* ---------- the street (signature) ---------- */
.street{ margin-top:44px; position:relative; }
.street-hint{ font-size:15px; color:var(--ink2); margin-bottom:12px; }
.block{ display:flex; gap:0; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 0 0; scrollbar-width:thin; }
.shop{ flex:1 0 190px; scroll-snap-align:start; border:0; padding:0; margin:0; background:none; cursor:pointer; text-align:center; font:inherit; color:inherit; display:flex; flex-direction:column; position:relative; }
.shop:focus-visible{ outline-offset:-3px; }
.facade{ background:var(--white); border-left:3px solid var(--ink); border-top:3px solid var(--ink); flex:1; display:flex; flex-direction:column; }
.shop:last-child .facade{ border-right:3px solid var(--ink); }
.signboard{ letter-spacing:.04em; margin:12px 12px 0; background:var(--c, var(--sign)); color:var(--sc, var(--ink)); border:3px solid var(--ink); border-radius:6px; padding:8px 6px 7px; font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:.02em; line-height:1.05; min-height:52px; display:grid; place-items:center; }
.awning{ height:30px; margin:10px 0 0; background:repeating-linear-gradient(90deg,var(--a) 0 22px,var(--white) 22px 44px); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink); position:relative; }
.awning::after{ content:""; position:absolute; left:0; right:0; top:100%; height:12px; background:radial-gradient(circle at 11px 0, var(--a) 10px, transparent 10.5px) 0 0/44px 12px repeat-x, radial-gradient(circle at 33px 0, var(--white) 10px, transparent 10.5px) 0 0/44px 12px repeat-x; filter:drop-shadow(0 2px 0 var(--ink)); }
.storefront{ display:grid; grid-template-columns:1fr 56px; gap:10px; padding:26px 12px 0; flex:1; }
.window{ border:3px solid var(--ink); border-bottom:0; background:#DCE7FB; border-radius:4px 4px 0 0; display:grid; place-items:center; min-height:110px; position:relative; overflow:hidden; }
.window svg{ width:62px; height:62px; }
.door{ border:3px solid var(--ink); border-bottom:0; background:var(--a); border-radius:4px 4px 0 0; position:relative; min-height:150px; align-self:end; }
.door::after{ content:""; position:absolute; right:7px; top:52%; width:7px; height:7px; border-radius:50%; background:var(--ink); }
.open{ position:absolute; left:50%; top:12px; transform:translateX(-50%); font-family:var(--display); font-weight:600; font-size:11px; padding:1px 5px; border-radius:4px; border:1.5px solid #8C8FA8; color:#8C8FA8; background:var(--white); transition:all .25s; }
.shop[aria-expanded="true"] .open, .shop:hover .open{ color:var(--neon); border-color:var(--neon); background:#2A1530; box-shadow:0 0 8px var(--neon), inset 0 0 6px rgba(255,61,127,.5); text-shadow:0 0 6px var(--neon); }
.shop[aria-expanded="true"] .facade{ background:#FFF6D9; }
.shopname{ display:block; padding:10px 6px 12px; font-weight:600; font-size:14px; background:var(--paper); border-top:3px solid var(--ink); }
.shop[aria-expanded="true"] .shopname{ background:var(--ink); color:var(--paper); }
.sidewalk{ height:16px; background:var(--ink); }
.curb{ height:10px; background:repeating-linear-gradient(90deg,var(--paper2) 0 60px,#E6C8BE 60px 64px); }

.inside{ background:var(--ink); color:var(--paper); border-radius:0 0 18px 18px; padding:clamp(22px,4vw,40px); display:grid; grid-template-columns:1.1fr 1fr 1.2fr; gap:28px; }
.inside h3{ font-size:var(--h3); color:var(--sign); grid-column:1/-1; }
.inside h4{ margin:0 0 8px; font-size:15px; color:#C9CBE8; font-weight:600; }
.inside ul{ margin:0; padding-left:18px; }
.inside li{ margin:4px 0; }
.inside .do li::marker{ content:"✓  "; color:var(--sign); }
@media (max-width:860px){ .inside{ grid-template-columns:1fr; gap:18px; } }

/* ---------- sections ---------- */
section.s{ padding:clamp(56px,8vw,100px) 0 0; }
.s h2{ font-size:var(--h2); max-width:22ch; }
.s .intro{ margin-top:14px; max-width:62ch; color:var(--ink2); font-size:var(--lead); }

.plain{ margin-top:30px; background:var(--white); border:3px solid var(--ink); border-radius:18px; padding:clamp(22px,4vw,40px); box-shadow:8px 8px 0 var(--blue); max-width:900px; }
.plain p{ font-size:clamp(18px,1.8vw,21px); line-height:1.55; }
.name360{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:3px solid var(--ink); }
.name360 div{ padding:20px 22px 0 0; }
.name360 b{ font-family:var(--display); font-weight:600; font-size:var(--h3); display:block; color:var(--plum); }
.name360 p{ color:var(--ink2); margin-top:6px; }
@media (max-width:760px){ .name360{ grid-template-columns:1fr; } }

.compare{ margin-top:34px; width:100%; border-collapse:collapse; font-size:16px; }
.compare th{ text-align:left; font-family:var(--display); font-weight:600; font-size:17px; padding:0 14px 12px 0; border-bottom:3px solid var(--ink); }
.compare td{ padding:14px 14px 14px 0; border-bottom:1.5px solid #E2C2B8; vertical-align:top; }
.compare td:first-child{ color:var(--ink2); width:30%; }
.compare td:nth-child(2){ color:var(--ink2); width:25%; }
.compare td:nth-child(2) s{ text-decoration-color:var(--plum); text-decoration-thickness:2px; }
.compare td:last-child{ font-weight:600; }
.tablewrap{ overflow-x:auto; }

.decals{ margin-top:34px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:26px 22px; }
.decal{ display:grid; grid-template-columns:76px 1fr; gap:16px; align-items:start; }
.decal .seal{ width:76px; height:76px; border-radius:50%; border:3px dashed var(--blue); display:grid; place-items:center; background:var(--white); }
.decal .seal svg{ width:38px; height:38px; }
.decal h3{ font-size:19px; }
.decal p{ margin-top:6px; color:var(--ink2); font-size:16px; }

/* research tickets */
.tickets{ margin-top:36px; display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:start; }
@media (max-width:900px){ .tickets{ grid-template-columns:1fr; } }
.ticket{ background:var(--white); border:3px solid var(--ink); border-radius:14px; position:relative; }
.ticket .head{ padding:20px 24px 16px; border-bottom:3px dashed var(--ink); display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
.ticket .head b{ font-family:var(--display); font-weight:600; font-size:var(--h3); }
.ticket .head span{ font-size:14px; font-weight:600; color:var(--plum); white-space:nowrap; }
.ticket::before,.ticket::after{ content:""; position:absolute; top:68px; width:22px; height:22px; border-radius:50%; background:var(--paper); border:3px solid var(--ink); }
.ticket::before{ left:-13px; clip-path:inset(0 0 0 50%); }
.ticket::after{ right:-13px; clip-path:inset(0 50% 0 0); }
.ticket .body{ padding:20px 24px 24px; }
.ticket .q{ font-weight:600; font-size:19px; line-height:1.45; }
.ticket h4{ margin:20px 0 8px; font-size:15px; color:var(--ink2); font-weight:600; }
.ticket ol, .ticket ul{ margin:0; padding-left:20px; }
.ticket li{ margin:5px 0; font-size:16px; }
.ticket .cost{ margin-top:20px; display:flex; justify-content:space-between; align-items:baseline; border-top:1.5px solid #E2C2B8; padding-top:12px; font-weight:600; }
.ticket .cost b{ font-family:var(--display); font-size:var(--h3); font-weight:600; color:var(--blue); }
.ticket.two{ margin-top:70px; }
@media (max-width:900px){ .ticket.two{ margin-top:0; } }

.fork{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.fork div{ border-left:4px solid var(--plum); padding:4px 0 4px 16px; }
.fork b{ display:block; font-size:16px; }
.fork p{ color:var(--ink2); font-size:15px; margin-top:4px; }
@media (max-width:760px){ .fork{ grid-template-columns:1fr; } }

.quote{ margin-top:clamp(56px,8vw,100px); background:var(--blue); color:var(--white); padding:clamp(30px,6vw,70px) 0; }
.quote blockquote{ margin:0; font-family:var(--display); font-weight:600; font-size:clamp(22px,2.6vw,32px); line-height:1.25; max-width:34ch; }
.quote cite{ display:block; margin-top:20px; font-style:normal; font-size:16px; opacity:.85; }
.quote .why{ margin-top:18px; max-width:60ch; font-size:17px; }

.door-sign{ margin-top:30px; background:var(--white); border:3px solid var(--ink); border-radius:18px 18px 4px 4px; padding:26px clamp(20px,4vw,40px); max-width:760px; position:relative; }
.door-sign::before{ content:""; position:absolute; top:-26px; left:50%; width:120px; height:26px; transform:translateX(-50%); border:3px solid var(--ink); border-bottom:0; border-radius:60px 60px 0 0; }
.door-sign ul{ list-style:none; margin:0; padding:0; display:grid; gap:12px; }
.door-sign li{ display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:17px; }
.door-sign li::before{ content:"✕"; color:var(--plum); font-weight:700; }
.door-sign li.yes::before{ content:"✓"; color:var(--blue); }

.funders{ margin-top:30px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:18px 40px; }
.funders div{ border-top:3px solid var(--ink); padding-top:14px; }
.funders b{ font-size:18px; }
.funders p{ color:var(--ink2); font-size:16px; margin-top:4px; }
.bars{ margin-top:40px; display:grid; gap:14px; max-width:820px; }
.bar{ display:grid; grid-template-columns:200px 1fr; gap:14px; align-items:center; }
.bar span{ font-weight:600; font-size:15px; }
.bar i{ display:block; height:38px; background:var(--plum); border:3px solid var(--ink); border-radius:6px; position:relative; }
.bar i b{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--white); font-family:var(--display); font-weight:600; font-size:18px; font-style:normal; }
.bar.big i{ background:var(--blue); }
@media (max-width:600px){ .bar{ grid-template-columns:1fr; gap:6px; } }
.note{ margin-top:12px; font-size:14px; color:var(--ink2); }

/* get involved */
.join{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:3px solid var(--ink); border-radius:16px; overflow:hidden; background:var(--white); }
.join button{ font:inherit; border:0; border-right:3px solid var(--ink); background:var(--white); padding:22px 16px; text-align:left; cursor:pointer; color:var(--ink); }

.join button b{ display:block; font-family:var(--display); font-weight:600; font-size:18px; }
.join button small{ color:var(--ink2); font-size:14px; }
.join button[aria-pressed="true"]{ background:var(--sign); }
.join button:nth-child(3n){ border-right:0; } .join button:nth-child(-n+3){ border-bottom:3px solid var(--ink); }
@media (max-width:760px){ .join{ grid-template-columns:1fr 1fr; } .join button{ border-right:3px solid var(--ink); border-bottom:3px solid var(--ink); } .join button:nth-child(2n){ border-right:0; } .join button:nth-last-child(-n+2){ border-bottom:0; } }
.joinform{ margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:820px; }
.joinform label{ display:grid; gap:6px; font-weight:600; font-size:15px; }
.joinform input,.joinform textarea{ font:inherit; border:2px solid var(--ink); border-radius:10px; padding:11px 12px; background:var(--white); }
.joinform .full{ grid-column:1/-1; }
.joinform button{ justify-self:start; font:inherit; font-weight:700; background:var(--ink); color:var(--paper); border:0; border-radius:999px; padding:13px 24px; cursor:pointer; }
.joinform button:hover{ background:var(--blue); }
.msg{ grid-column:1/-1; font-weight:600; min-height:24px; }
.msg.err{ color:#B42318; }
@media (max-width:600px){ .joinform{ grid-template-columns:1fr; } }

footer{ margin-top:clamp(60px,8vw,100px); background:var(--ink); color:#C9CBE8; padding:34px 0 calc(34px + env(safe-area-inset-bottom,0px)); font-size:14px; }
footer .wrap{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px; }
footer b{ color:var(--paper); font-family:var(--display); font-weight:600; font-size:18px; }

/* help / volunteers */
.roles{ margin-top:30px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:0; border-top:3px solid var(--ink); }
.role{ padding:22px 24px 22px 0; border-bottom:1.5px solid #E2C2B8; display:grid; gap:6px; align-content:start; }
.role h3{ font-size:19px; }
.role p{ color:var(--ink2); font-size:16px; }
.role .time{ font-size:14px; font-weight:600; color:var(--plum); }
.commit{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; max-width:980px; }
.commit div{ background:var(--white); border:3px solid var(--ink); border-radius:14px; padding:18px 20px; }
.commit b{ font-family:var(--display); font-weight:600; font-size:var(--h3); display:block; }
.commit p{ color:var(--ink2); font-size:15px; margin-top:6px; }
@media (max-width:760px){ .commit{ grid-template-columns:1fr; } }
.contact{ margin-top:22px; font-size:var(--lead); }
.contact a{ font-weight:700; }

/* onboarding */
body.gated{ overflow:hidden; }
#gate{ position:fixed; inset:0; z-index:100; background:var(--paper); overflow-y:auto; display:flex; flex-direction:column; }
#gate.hidden{ display:none; }
#gate .gtop{ display:flex; justify-content:space-between; align-items:center; padding:18px clamp(18px,4vw,40px); }
#gate .gbody{ flex:1; display:grid; place-items:center; padding:10px clamp(18px,4vw,40px) 40px; }
.gcard{ width:min(620px,100%); }
.gcard h1{ font-size:var(--h2); }
.gcard h1 .l2{ color:var(--blue); display:block; }
.gcard .gp{ margin-top:16px; color:var(--ink2); font-size:var(--lead); max-width:52ch; }
.gsteps{ display:flex; gap:6px; margin-bottom:22px; }
.gsteps i{ flex:1; height:8px; border-radius:999px; background:#E8C9BF; transform:skewX(-24deg); }
.gsteps i.on{ background:var(--blue); }
.gfield{ margin-top:24px; display:grid; gap:8px; font-weight:600; }
.gfield input{ font:inherit; font-size:18px; border:3px solid var(--ink); border-radius:12px; padding:14px 16px; background:var(--white); }
.gerr{ color:#B42318; font-weight:600; min-height:24px; margin-top:8px; font-size:15px; }
.gnote{ font-size:14px; color:var(--ink2); margin-top:4px; }
.gbtns{ margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.gbtn{ font:inherit; font-weight:700; background:var(--ink); color:var(--paper); border:0; border-radius:999px; padding:14px 26px; cursor:pointer; font-size:17px; }
.gbtn:hover{ background:var(--blue); }
.gbtn.ghost{ background:transparent; color:var(--ink); border:2px solid var(--ink); }
.gbtn.ghost:hover{ background:var(--white); }
.gpoints{ margin-top:22px; display:grid; gap:12px; padding:0; list-style:none; }
.gpoints li{ display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; background:var(--white); border:2px solid var(--ink); border-radius:12px; padding:12px 14px; }
.gpoints li span{ width:34px; height:34px; border-radius:50%; background:var(--sign); border:2px solid var(--ink); display:grid; place-items:center; font-weight:600; }
.minirow{ margin-top:22px; display:flex; height:70px; border:3px solid var(--ink); border-bottom:0; border-radius:8px 8px 0 0; overflow:hidden; }
.minirow i{ flex:1; border-right:3px solid var(--ink); background:repeating-linear-gradient(90deg,var(--a) 0 12px,var(--white) 12px 24px) top/100% 22px no-repeat, var(--white); }
.minirow i:last-child{ border-right:0; }

 ng may-ari ang label ng bawat polish at remover, at bubuuin ng app ang listahan ng kemikal at kukunin ang Safety Data Sheets", "Sinusuri ng remote coach ang bentilasyon at mga mesa sa maikling video call", "Nakakatanggap ang mga manggagawa ng 2-minutong safety tip sa text, sa Vietnamese o sa kanilang wika", "Itinatala ng bawat manggagawa ang sakit ng ulo, pantal o pananakit sa kanyang Health Passport para maagang makita ang pattern"]], "food": ["Sa loob ng restawran", "Mga kusinero, serbidor at tagahugas na mabilis kumilos sa mainit at masikip na kusina.", ["Paso at hiwa", "Pagkadulas sa basang sahig", "Init, pagbubuhat at matatapang na panlinis"], ["Photo checklist na tinatapos ng manager sa telepono sa loob ng 5 minuto bago magbukas", "2-minutong training video na itine-text sa mga bagong empleyado, sa kanilang wika", "Video call sa occupational health nurse kapag may napaso o nahiwa", "Simpleng talaan ng pinsala sa app na pumupuno sa mga kailangang form"]], "store": ["Sa loob ng tindahan sa kanto", "Kadalasang isang pamilya at isa o dalawang empleyado, bukas mula umaga hanggang gabi.", ["Pagbubuhat ng paninda at pag-akyat sa hagdan", "Mahahabang oras na nakatayo", "Panganib sa kaligtasan sa gabi"], ["Pinaaalalahanan ng app ang may-ari sa buwanang safety check, may larawan kung ano ang titingnan", "Sinusuri ng remote coach ang bodega at hagdan mula sa mga litrato", "Plano sa kaligtasan sa gabi na naka-save sa telepono ng bawat manggagawa", "Telehealth kapag may nasaktan ang likod sa pagbubuhat ng paninda"]], "auto": ["Sa loob ng talyer", "Mga mekaniko at body worker na laging malapit sa makina, pintura at mabibigat na piyesa.", ["Pintura, solvent at usok ng tambutso", "Ingay", "Mabibigat na piyesa, hiwa at pagkaipit"], ["Kinukunan ng talyer ang label ng pintura at solvent, at sinasabi ng app kung alin ang kailangan ng mask o guwantes", "Sinusuri ng remote coach ang bentilasyon at protective gear mula sa litrato o video call", "Itinatala ng mga mekaniko ang exposure at sintomas sa kanilang Health Passport sa paglipas ng mga taon", "Para sa mas malalaking ayos, ikinokonekta ng app ang talyer sa libreng konsultasyon ng OSHA"]], "hair": ["Sa loob ng parlor", "Mga stylist na nakatayo buong araw, marami ang umuupa ng sariling upuan.", ["Pangkulay at pampaputi ng buhok", "Smoothing treatment na maaaring maglabas ng formaldehyde", "Pananakit ng balikat at likod"], ["Kinukunan ng stylist ang mga label, at tinutukoy ng app ang formaldehyde at nagmumungkahi ng mas ligtas na produkto", "Mga tip sa guwantes at bentilasyon sa text, sa wika ng stylist", "Talaan ng sintomas na nag-uugnay ng pantal o sakit ng ulo sa produktong ginamit noong araw na iyon", "Impormasyon sa karapatan para sa mga umuupa ng upuan, nasa app mismo"]], "clean": ["Sa loob ng grupo ng tagalinis", "Maliliit na grupo na naglilinis ng opisina at bahay, madalas sa gabi.", ["Paghahalo ng matatapang na panlinis", "Pagkadulas at pagkahulog", "Pagbubuhat at pagtatrabaho nang mag-isa"], ["Gabay na may larawan tungkol sa mga kemikal na hindi dapat paghaluin, nasa telepono ng bawat manggagawa", "2-minutong safety video para sa mga bagong empleyado bago ang unang shift", "Check-in button para sa mga mag-isang nagtatrabaho sa gabi", "Health Passport na sumusunod sa bawat manggagawa mula sa isang trabaho papunta sa susunod"]]}, "plainH": "Sa madaling salita", "plainP": "Para sa mga lokal na tindahan, nail salon, restawran, tindahan sa kanto at iba pa, naghahanap kami ng pondo para magsilbing kanilang safety at health department, ang mayroon ang malalaking kumpanya pero hindi kaya ng maliliit na negosyo. Natatanggap ng kanilang mga manggagawa ang parehong proteksyon, libre o mura.", "n360": [["Bawat lugar ng trabaho", "Hindi lang malalaking kumpanya. Pati maliliit na tindahang hindi kailanman natutulungan."], ["Bawat manggagawa", "Anumang wika, anumang trabaho, empleyado man o independent contractor."], ["Ang buong larawan", "Pag-iwas sa pinsala, pagtatala ng exposure, pagpapagamot, at ligtas na pagbalik sa trabaho."]], "cmpH": "Isang safety department na pinagsasaluhan", "cmpI": "Hindi kaya ng limampung maliliit na tindahan na tig-isang kumuha ng safety officer. Pero kaya nilang magsalo sa isang team.", "cmpTh": ["Mayroon ang malalaking kumpanya", "Karaniwang mayroon ang maliliit na tindahan", "Dala ng OEM360"], "cmp": [["Safety officer", "Wala", "Bilingual na safety coach na bumibisita at nangangamusta"], ["Listahan ng kemikal at Safety Data Sheets", "Isang istante ng produkto", "Kunan ng litrato ang bawat label at kusang mabubuo ang listahan"], ["Safety training", "“Panoorin mo ako”", "Maiikling training video sa wika ng mga manggagawa"], ["Occupational health clinic", "Ang ER, o wala", "Telehealth kasama ang occupational health nurse o doktor"], ["Talaan ng pinsala", "Walang nakasulat", "Simpleng talaan ng pinsala na pumupuno sa mga form"], ["Plano sa pagbalik sa trabaho", "Umalis, o magtrabahong may sakit", "Mga ideya sa magaan na trabaho at plano kasama ang klinika"]], "whatH": "Ang ginagawa namin", "decals": [["Kunan ang label", "Kinukunan ng may-ari ang bawat produkto. Binubuo namin ang listahan ng kemikal at Safety Data Sheets."], ["Mga safety coach", "Mga sinanay na miyembro ng komunidad na bumibisita ilang beses sa isang taon. Maikli, magiliw at kumpidensyal."], ["Worker Health Passport", "Pribadong talaan na pag-aari ng bawat manggagawa: trabaho, produkto at sintomas. Kasama nila habambuhay."], ["Pangangalaga kapag kailangan", "Telehealth kasama ang occupational health nurse o doktor kapag may nasaktan o nagkasakit."], ["Healthy Shop badge", "Ang mga tindahang natapos ang programa ay may badge para sa bintana."]], "resH": "Nagsisimula kami sa pananaliksik", "resI": "Bago kami bumuo ng kahit ano, gusto naming malaman ang dalawang bagay. Totoo ba ang kakulangan? At talaga bang nakakatulong ang aming programa?", "p1": "Proyekto 1", "d1": "Mga 9 na buwan", "q1": "May access ba sa suporta sa kaligtasan at kalusugan ang maliliit na negosyong may mapanganib na trabaho, at saan ang pinakamalalaking kakulangan?", "how": "Paano namin ito aalamin", "s1": ["Ilista ang libre at murang serbisyong pangkaligtasan na naaabot ng maliliit na tindahan, at kung anong wika ang mga ito.", "Mag-survey sa mga may-ari at manggagawa sa sarili nilang wika.", "Bumisita sa mga tindahan gamit ang simpleng safety checklist.", "Makipag-usap nang malalim sa mga may-ari at manggagawa, kasama ang mga katuwang sa komunidad.", "Maglabas ng ulat tungkol sa kakulangan sa simpleng pananalita."], "p2": "Proyekto 2", "d2": "Mga 18 buwan", "q2": "Makakatulong ba ang isang libre, multilingual at pinagsasaluhang safety program sa maliliit na tindahan para gumamit ng ligtas na gawi at mabawasan ang sintomas at pinsala ng manggagawa sa loob ng 12 buwan?", "s2": ["Bumuo ng simpleng app at gabay para sa coach mula sa natutunan sa Proyekto 1.", "Subukan ito sa ilang tindahan at ayusin ang hindi gumagana.", "Patakbuhin ito sa isang grupo ng tindahan sa loob ng 12 buwan.", "Sukatin ang ligtas na gawi, sintomas, pinsala, paggamit at gastos.", "Ibahagi ang resulta sa bawat wikang ginamit namin."], "fork": [["Kung totoo ang kakulangan", "Gagawin namin ang Proyekto 2 at susubukan ang buong programa."], ["Kung may tulong pero hindi nagagamit", "Ikokonekta namin ang mga tindahan dito, sa kanilang wika, sa halip na bumuo muli."], ["Kung mas maliit ang kakulangan kaysa inaakala", "Pupunta kami kung saan talaga may pangangailangan."]], "cite": "doktor sa occupational at environmental medicine", "qnote": "Sinipi mula sa orihinal na Ingles.", "why": "Kung bihira lang subaybayan ng mabubuting employer ang exposure ng kanilang mga manggagawa, halos hindi ito ginagawa ng tindahan sa kanto.", "doorH": "Ang karatula sa aming pinto", "doorI": "Kailangang magtiwala sa amin ang mga may-ari at manggagawa bago kami papasukin. Ito ang aming mga patakaran.", "doorNo": ["Hindi kami inspektor. Kumpidensyal ang aming tulong.", "Hindi kailanman makikita ng may-ari ang impormasyon sa kalusugan ng manggagawa.", "Hindi namin ibinabahagi ang impormasyon ng manggagawa sa landlord o sa immigration.", "Hindi kami nagbibigay ng legal na payo. Ikinokonekta namin ang manggagawa sa legal aid."], "doorYes": ["Katuwang kami ng libreng konsultasyon ng OSHA para sa maliliit na negosyo.", "Ang manggagawa ang pipili kung ano ang ibabahagi, at puwede siyang tumigil anumang oras."], "fundH": "Paano namin ito popondohan", "fund": [["Research grants", "Mga research grant ng NIOSH at pilot grant mula sa mga university center na pinopondohan ng NIOSH."], ["Mga foundation", "Mga nagpopondo na nakatuon sa kalusugan ng manggagawa, imigrante at kapaligiran, at sa pagkakapantay-pantay sa kalusugan."], ["Lokal na pamahalaan", "Mga health department ng lungsod at county na sumusuporta na sa mga programa para sa maliliit na negosyo."], ["Insurer at state fund", "Nakakatipid sila kapag naiiwasan ang pinsala, kaya puwede nilang i-sponsor ang mga tindahang kanilang ini-insure."], ["Mga sponsor sa komunidad", "Mga chamber of commerce, samahan ng mga salon, beauty school at supplier."], ["Maliit na bayad, sa susunod", "Membership na ayon sa kakayahan para sa mga tindahang gusto ng mas maraming bisita, kapag napatunayan na ang programa."]], "helpH": "Tumulong sa pagbuo", "helpI": "Maliit kaming team at malawak ang aming lalakarin. Ilang oras man bawat buwan o isang buong semestre, may lugar para sa iyo.", "roles": [["Mga boluntaryo sa komunidad", "Bumisita sa mga tindahan kasama ang aming coach, mamigay ng materyales at tulungang maging komportable ang may-ari at manggagawa. Lalo naming kailangan ang nagsasalita ng Spanish, Chinese, Tagalog, Vietnamese, Haitian Creole at iba pang wika.", "Ilang oras bawat buwan"], ["Mga tagasalin at interpreter", "Isalin ang mga survey, safety guide at screen ng app, at subukan ito sa totoong manggagawa para malinaw ang mga salita.", "Ayon sa proyekto"], ["Mga intern sa public health at pre-health", "Tumulong sa pag-aaral ng kakulangan: ilista ang mga serbisyo, mag-survey at isulat ang simpleng ulat.", "Isang semestre, mga 8 hanggang 10 oras bawat linggo"], ["Mga software engineer", "Buuin ang app: kunan ang label, Health Passport at checklist ng tindahan, na may privacy mula sa unang araw.", "Tuloy-tuloy, flexible na oras"], ["Mga designer", "Gawing madaling gamitin ang lahat sa lumang telepono, sa anumang wika, sa loob ng dalawang minutong pahinga.", "Ayon sa proyekto"], ["Mga propesyonal sa kalusugan at kaligtasan", "Mga nurse, doktor, industrial hygienist at safety pro na makakapagpayo, makakarepaso ng materyales o makakakuha ng telehealth shift.", "Ilang oras bawat buwan"], ["Mga mananaliksik", "Mga guro at graduate student na gustong makipagtulungan sa dalawang pag-aaral at sa mga grant application.", "Ayon sa proyekto"], ["Mga may-ari ng tindahan at manggagawa", "Sumali sa aming unang grupo, sabihin ang kailangan mo, at tumulong hubugin ang aming binubuo. Ang boses mo ang una.", "Kahit kailan ka puwede"]], "commitH": "Ikaw ang bahala kung gaano karaming oras", "commit": [["Paminsan-minsan", "Tumulong sa isang event, magsalin ng isang pahina, o subukan ang app nang isang beses."], ["Regular", "Ilang oras bawat buwan sa outreach, pagsasalin o pagpapayo."], ["Nakatuon", "Isang semestreng internship o tuloy-tuloy na papel sa pagbuo, na may malinaw na proyekto at mentor."]], "contactQ": "May tanong? I-email si Aniya sa", "joinH": "Sumali", "joinI": "Naghahanap kami ng mga tindahan, manggagawa, boluntaryo, intern, engineer, katuwang at nagpopondo para buuin ito kasama namin.", "btns": {"owner": ["May tindahan ako", "Sumali sa unang grupo"], "worker": ["Nagtatrabaho ako sa tindahan", "Sabihin ang kailangan mo"], "volunteer": ["Gusto kong mag-boluntaryo", "Outreach, pagsasalin, disenyo"], "intern": ["Intern o engineer", "Pananaliksik, public health, ang app"], "partner": ["Gusto kong makipagtulungan", "Worker center, klinika, unibersidad"], "funder": ["Gusto kong magpondo", "Foundation, sponsor, oàn và sức khỏe cho các cửa hàng địa phương, tiệm nail, nhà hàng và tiệm tạp hóa, miễn phí hoặc chi phí thấp, bằng ngôn ngữ của người lao động.", "promise": "Mọi người lao động. Mọi nơi làm việc.", "hint": "Chọn một cửa hàng để xem người lao động ở đó gặp những gì, và chúng tôi sẽ làm gì.", "shopnames": {"nails": "Tiệm nail", "food": "Nhà hàng", "store": "Tiệm tạp hóa", "auto": "Tiệm sửa xe", "hair": "Tiệm tóc", "clean": "Đội vệ sinh"}, "inside": ["Ai làm việc ở đây", "Họ phải đối mặt với gì", "OEM360 giúp đỡ thế nào, ngay trên điện thoại"], "shops": {"nails": ["Bên trong tiệm nail", "Nhóm nhỏ, làm nhiều giờ, nhiều người nói tiếng Việt. Nhiều người là thầu độc lập, không có bảo hiểm tai nạn lao động.", ["Hơi từ sơn móng, bột acrylic và nước tẩy", "Bụi khi dũa móng", "Đau cổ, lưng và cổ tay vì cúi người làm cho khách"], ["Chủ tiệm chụp nhãn từng chai sơn và nước tẩy, ứng dụng tự lập danh sách hóa chất và tìm phiếu an toàn", "Huấn luyện viên từ xa kiểm tra thông gió và bàn làm việc qua cuộc gọi video ngắn", "Thợ nhận mẹo an toàn 2 phút qua tin nhắn, bằng tiếng Việt hoặc ngôn ngữ của họ", "Mỗi người ghi đau đầu, nổi mẩn hay đau nhức vào Hộ chiếu sức khỏe để sớm nhận ra quy luật"]], "food": ["Bên trong nhà hàng", "Đầu bếp, phục vụ và người rửa chén làm việc nhanh trong bếp nóng và chật.", ["Bỏng và đứt tay", "Trơn trượt trên sàn ướt", "Nóng, mang vác nặng và hóa chất tẩy rửa mạnh"], ["Danh sách kiểm tra bằng ảnh quản lý hoàn thành trên điện thoại trong 5 phút trước giờ mở cửa", "Video huấn luyện 2 phút gửi qua tin nhắn cho nhân viên mới, bằng ngôn ngữ của họ", "Gọi video với y tá sức khỏe nghề nghiệp khi có người bị bỏng hoặc đứt tay", "Sổ ghi chấn thương đơn giản trong ứng dụng tự điền các biểu mẫu cần thiết"]], "store": ["Bên trong tiệm tạp hóa", "Thường là một gia đình với một hai nhân viên, mở cửa từ sáng sớm đến tối muộn.", ["Bê hàng và leo thang", "Đứng nhiều giờ", "Rủi ro an toàn ban đêm"], ["Ứng dụng nhắc chủ tiệm kiểm tra an toàn hằng tháng, kèm hình ảnh cần chú ý", "Huấn luyện viên từ xa xem kho và thang qua ảnh chụp", "Kế hoạch an toàn ban đêm lưu trên điện thoại của mỗi người", "Khám từ xa khi có người đau lưng vì bê hàng"]], "auto": ["Bên trong tiệm sửa xe", "Thợ máy và thợ đồng làm việc quanh động cơ, sơn và phụ tùng nặng.", ["Sơn, dung môi và khí thải", "Tiếng ồn", "Phụ tùng nặng, đứt tay và bị kẹp"], ["Tiệm chụp nhãn sơn và dung môi, ứng dụng cho biết loại nào cần khẩu trang hoặc găng tay", "Huấn luyện viên từ xa kiểm tra thông gió và đồ bảo hộ qua ảnh hoặc gọi video", "Thợ máy ghi lại phơi nhiễm và triệu chứng trong Hộ chiếu sức khỏe qua nhiều năm", "Với việc sửa chữa lớn, ứng dụng kết nối tiệm với chương trình tư vấn miễn phí của OSHA"]], "hair": ["Bên trong tiệm tóc", "Thợ tóc đứng cả ngày, nhiều người thuê ghế riêng.", ["Thuốc nhuộm và thuốc tẩy tóc", "Dịch vụ duỗi tóc có thể thải ra formaldehyde", "Đau vai và lưng"], ["Thợ tóc chụp nhãn sản phẩm, ứng dụng phát hiện formaldehyde và gợi ý lựa chọn an toàn hơn", "Mẹo về găng tay và thông gió gửi qua tin nhắn, bằng ngôn ngữ của thợ", "Nhật ký triệu chứng liên kết nổi mẩn hoặc đau đầu với sản phẩm dùng trong ngày", "Thông tin quyền lợi cho người thuê ghế ngay trong ứng dụng"]], "clean": ["Bên trong đội vệ sinh", "Đội nhỏ dọn dẹp văn phòng và nhà ở, thường vào ban đêm.", ["Pha trộn hóa chất tẩy rửa mạnh", "Trơn trượt và té ngã", "Mang vác nặng và làm việc một mình"], ["Hướng dẫn có hình về các hóa chất không được trộn, trên điện thoại của mỗi người", "Video an toàn 2 phút cho nhân viên mới trước ca làm đầu tiên", "Nút báo bình an cho người làm ca đêm một mình", "Hộ chiếu sức khỏe theo mỗi người từ công việc này sang công việc khác"]]}, "plainH": "Nói đơn giản", "plainP": "Với các cửa hàng địa phương, tiệm nail, nhà hàng, tiệm tạp hóa và nhiều nơi khác, chúng tôi tìm nguồn tài trợ để đóng vai trò bộ phận an toàn và sức khỏe của họ, thứ mà công ty lớn có còn doanh nghiệp nhỏ không đủ khả năng. Người lao động của họ được bảo vệ như nhau, miễn phí hoặc chi phí thấp.", "n360": [["Mọi nơi làm việc", "Không chỉ công ty lớn. Cả những cửa hàng nhỏ chưa bao giờ được giúp đỡ."], ["Mọi người lao động", "Bất kỳ ngôn ngữ, bất kỳ công việc, nhân viên hay thầu độc lập."], ["Toàn diện", "Phòng ngừa chấn thương, ghi nhận phơi nhiễm, được chăm sóc và quay lại làm việc an toàn."]], "cmpH": "Một bộ phận an toàn dùng chung", "cmpI": "Năm mươi cửa hàng nhỏ không thể mỗi nơi thuê một nhân viên an toàn. Nhưng cùng nhau, họ có thể dùng chung một đội.", "cmpTh": ["Công ty lớn có", "Cửa hàng nhỏ thường có", "OEM360 mang đến"], "cmp": [["Nhân viên an toàn", "Không ai cả", "Huấn luyện viên an toàn song ngữ đến thăm và theo dõi"], ["Danh sách hóa chất và phiếu an toàn", "Một kệ sản phẩm", "Chụp ảnh từng nhãn và danh sách tự hình thành"], ["Huấn luyện an toàn", "“Nhìn tôi làm nè”", "Video huấn luyện ngắn bằng ngôn ngữ của người lao động"], ["Phòng khám sức khỏe nghề nghiệp", "Phòng cấp cứu, hoặc không có gì", "Khám từ xa với y tá hoặc bác sĩ sức khỏe nghề nghiệp"], ["Hồ sơ chấn thương", "Không ghi chép gì", "Sổ ghi chấn thương đơn giản tự điền biểu mẫu"], ["Kế hoạch quay lại làm việc", "Nghỉ việc, hoặc làm khi đang đau", "Gợi ý việc nhẹ và kế hoạch cùng phòng khám"]], "whatH": "Chúng tôi làm gì", "decals": [["Chụp nhãn", "Chủ tiệm chụp ảnh từng sản phẩm. Chúng tôi lập danh sách hóa chất và thư viện phiếu an toàn."], ["Huấn luyện viên an toàn", "Người trong cộng đồng được đào tạo đến thăm vài lần mỗi năm. Ngắn gọn, thân thiện, bảo mật."], ["Hộ chiếu sức khỏe người lao động", "Hồ sơ riêng của mỗi người: công việc, sản phẩm, triệu chứng. Theo họ suốt đời."], ["Chăm sóc khi cần", "Khám từ xa với y tá hoặc bác sĩ sức khỏe nghề nghiệp khi có người bị thương hoặc bị bệnh."], ["Huy hiệu Cửa hàng Khỏe mạnh", "Cửa hàng hoàn thành chương trình nhận huy hiệu dán cửa kính."]], "resH": "Chúng tôi bắt đầu bằng nghiên cứu", "resI": "Trước khi xây dựng, chúng tôi muốn biết hai điều. Khoảng trống có thật không? Và chương trình của chúng tôi có thực sự giúp ích không?", "p1": "Dự án 1", "d1": "Khoảng 9 tháng", "q1": "Doanh nghiệp nhỏ có công việc nguy hiểm có được hỗ trợ về an toàn và sức khỏe không, và khoảng trống lớn nhất ở đâu?", "how": "Cách chúng tôi tìm hiểu", "s1": ["Lập danh sách các dịch vụ an toàn miễn phí hoặc chi phí thấp mà cửa hàng nhỏ có thể tiếp cận, và các ngôn ngữ được cung cấp.", "Khảo sát chủ tiệm và người lao động bằng ngôn ngữ của họ.", "Đi thăm cửa hàng với danh sách kiểm tra an toàn đơn giản.", "Trò chuyện sâu với chủ tiệm và người lao động, cùng các đối tác cộng đồng.", "Công bố báo cáo dễ hiểu về các khoảng trống."], "p2": "Dự án 2", "d2": "Khoảng 18 tháng", "q2": "Một chương trình an toàn miễn phí, đa ngôn ngữ, dùng chung có thể giúp cửa hàng nhỏ áp dụng biện pháp an toàn và giảm triệu chứng, chấn thương của người lao động trong 12 tháng không?", "s2": ["Xây dựng ứng dụng đơn giản và hướng dẫn cho huấn luyện viên từ những gì học được ở Dự án 1.", "Thử với vài cửa hàng và sửa những gì chưa hiệu quả.", "Triển khai ở một nhóm cửa hàng trong 12 tháng.", "Đo lường biện pháp an toàn, triệu chứng, chấn thương, mức sử dụng và chi phí.", "Chia sẻ kết quả bằng mọi ngôn ngữ chúng tôi đã làm việc."], "fork": [["Nếu khoảng trống có thật", "Chúng tôi làm Dự án 2 và thử toàn bộ chương trình."], ["Nếu đã có hỗ trợ nhưng không ai dùng", "Chúng tôi kết nối cửa hàng với hỗ trợ đó, bằng ngôn ngữ của họ, thay vì làm lại từ đầu."], ["Nếu khoảng trống nhỏ hơn chúng tôi nghĩ", "Chúng tôi chuyển đến nơi thật sự cần."]], "cite": "bác sĩ y học nghề nghiệp và môi trường", "qnote": "Trích nguyên văn tiếng Anh.", "why": "Nếu ngay cả chủ lao động tốt cũng hiếm khi theo dõi người lao động tiếp xúc với gì, thì tiệm tạp hóa gần như không bao giờ làm.", "doorH": "Bảng nội quy trên cửa của chúng tôi", "doorI": "Chủ tiệm và người lao động cần tin chúng tôi trước khi cho chúng tôi vào. Đây là nguyên tắc của chúng tôi.", "doorNo": ["Chúng tôi không phải thanh tra. Sự giúp đỡ của chúng tôi được bảo mật.", "Chủ tiệm không bao giờ thấy thông tin sức khỏe của người lao động.", "Chúng tôi không bao giờ chia sẻ thông tin người lao động với chủ nhà hay cơ quan di trú.", "Chúng tôi không tư vấn pháp lý. Chúng tôi kết nối người lao động với trợ giúp pháp lý."], "doorYes": ["Chúng tôi phối hợp với chương trình tư vấn miễn phí của OSHA cho doanh nghiệp nhỏ.", "Người lao động tự chọn chia sẻ gì và có thể dừng bất cứ lúc nào."], "fundH": "Chúng tôi sẽ tìm nguồn tài trợ thế nào", "fund": [["Tài trợ nghiên cứu", "Các khoản tài trợ nghiên cứu của NIOSH và tài trợ thí điểm từ các trung tâm đại học do NIOSH tài trợ."], ["Các quỹ", "Những quỹ tập trung vào sức khỏe người lao động, sức khỏe người nhập cư, sức khỏe môi trường và công bằng y tế."], ["Chính quyền địa phương", "Sở y tế thành phố và quận đã hỗ trợ các chương trình cho doanh nghiệp nhỏ."], ["Công ty bảo hiểm và quỹ tiểu bang", "Họ tiết kiệm khi chấn thương được ngăn ngừa và có thể tài trợ cho các cửa hàng họ bảo hiểm."], ["Nhà tài trợ cộng đồng", "Phòng thương mại, hiệp hội thẩm mỹ, trường thẩm mỹ và nhà cung cấp."], ["Phí nhỏ, về sau", "Gói thành viên theo khả năng chi trả cho cửa hàng muốn được thăm nhiều hơn, khi chương trình đã được chứng minh."]], "helpH": "Cùng xây dựng", "helpI": "Chúng tôi là một đội nhỏ với con đường còn dài. Dù bạn có vài giờ mỗi tháng hay cả một học kỳ, luôn có chỗ cho bạn.", "roles": [["Tình nguyện viên cộng đồng", "Đi thăm cửa hàng cùng huấn luyện viên, phát tài liệu và giúp chủ tiệm, người lao động cảm thấy thoải mái. Đặc biệt cần người nói tiếng Tây Ban Nha, tiếng Trung, tiếng Tagalog, tiếng Việt, tiếng Creole Haiti và các ngôn ngữ khác.", "Vài giờ mỗi tháng"], ["Biên dịch và phiên dịch", "Dịch khảo sát, hướng dẫn an toàn và màn hình ứng dụng, rồi thử với người lao động thật để đảm bảo dễ hiểu.", "Theo dự án"], ["Thực tập sinh y tế công cộng và dự bị y khoa", "Hỗ trợ nghiên cứu khoảng trống: lập danh sách dịch vụ, khảo sát và viết báo cáo dễ hiểu.", "Một học kỳ, khoảng 8 đến 10 giờ mỗi tuần"], ["Kỹ sư phần mềm", "Xây dựng ứng dụng: chụp nhãn, hộ chiếu sức khỏe và danh sách kiểm tra cửa hàng, bảo vệ quyền riêng tư ngay từ đầu.", "Lâu dài, giờ linh hoạt"], ["Nhà thiết kế", "Làm cho mọi thứ dễ dùng trên điện thoại cũ, bằng bất kỳ ngôn ngữ nào, trong hai phút nghỉ giải lao.", "Theo dự án"], ["Chuyên gia y tế và an toàn", "Y tá, bác sĩ, chuyên gia vệ sinh công nghiệp và chuyên gia an toàn có thể tư vấn, xem tài liệu hoặc nhận ca khám từ xa.", "Vài giờ mỗi tháng"], ["Nhà nghiên cứu", "Giảng viên và nghiên cứu sinh muốn hợp tác trong hai nghiên cứu và hồ sơ xin tài trợ.", "Theo dự án"], ["Chủ tiệm và người lao động", "Tham gia nhóm đầu tiên, cho chúng tôi biết bạn cần gì và cùng định hình những gì chúng tôi xây dựng. Tiếng nói của bạn là trên hết.", "Bất cứ khi nào bạn có thể"]], "commitH": "Bạn quyết định dành bao nhiêu thời gian", "commit": [["Thỉnh thoảng", "Giúp một sự kiện, dịch một trang, hoặc thử ứng dụng một lần."], ["Thường xuyên", "Vài giờ mỗi tháng cho tiếp cận cộng đồng, dịch thuật hoặc tư vấn."], ["Gắn bó", "Thực tập một học kỳ hoặc vai trò xây dựng lâu dài, có dự án rõ ràng và người hướng dẫn."]], "contactQ": "Có câu hỏi? Gửi email cho Aniya tại", "joinH": "Tham gia", "joinI": "Chúng tôi đang tìm cửa hàng, người lao động, tình nguyện viên, thực tập sinh, kỹ sư, đối tác và nhà tài trợ để cùng xây dựng.", "btns": {"owner": ["Tôi có cửa hàng", "Tham gia nhóm đầu tiên"], "worker": ["Tôi làm ở cửa hàng", "Cho chúng tôi biết bạn cần gì"], "volunteer": ["Tôi muốn làm tình nguyện", "Tiếp cận, dịch thuật, thiết kế"], "intern": ["Thực tập sinh hoặc kỹ sư", "Nghiên cứu, y tế công cộng, ứng dụng"], "partner": ["Tôi muốn hợp tác", "Trung tâm người lao động, phòng khám, đại học"], "funder": ["Tôi muốn tài trợ", "Quỹ, nhà tài trợ, cơ quan"]}, "fName": "Tên của bạn", "fContact": "Email hoặc số điện thoại", "msgs": {"owner": "Cho chúng tôi biết về cửa hàng của bạn", "worker": "Điều gì sẽ giúp bạn khi làm việc? Bạn có thể viết bằng bất kỳ ngôn ngữ nào.", "volunteer": "Bạn muốn giúp gì, và bạn nói những ngôn
