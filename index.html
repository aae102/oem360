<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rule:rgba(26,31,69,.22);
  --paper:#FAF7F3;      /* logo blush */
  --paper2:#F0EBE4;
  --ink:#1A1F45;        /* deep indigo ink */
  --ink2:#4B4F6E;
  --blue:#0B53E0;       /* logo blue */
  --plum:#7B4562;       /* logo plum */
  --sign:#F2C14E;       /* painted sign yellow */
  --neon:#FF3D7F;
  --white:#FFFDFB;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --h1:clamp(36px,5.2vw,66px); --h2:clamp(28px,3.4vw,44px); --h3:22px; --lead:clamp(17px,1.5vw,19px);
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } *{ animation:none !important; transition:none !important; } }
body{ margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 var(--body); -webkit-text-size-adjust:100%; }
a{ color:var(--blue); }
:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; border-radius:4px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 clamp(18px,4vw,40px); }
h1,h2,h3{ font-family:var(--display); font-weight:500; margin:0; line-height:1.05; letter-spacing:-.015em; }
h3{ font-weight:600; font-size:var(--h3); line-height:1.2; }
p{ margin:0; }

/* ---------- top ---------- */
.top{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; }
.brand{ display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); }
.brand svg{ width:30px; height:46px; }
.brand b{ font-family:var(--display); font-weight:600; font-size:22px; display:block; line-height:1; }
.brand span{ font-size:13px; color:var(--ink2); }
.nav{ display:flex; gap:22px; font-weight:600; font-size:15px; }
.nav a{ color:var(--ink); text-decoration:none; }
.nav a:hover{ text-decoration:underline; text-underline-offset:4px; }
.nav .cta{ background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:4px; }
.nav .cta:hover{ text-decoration:none; background:var(--blue); }


/* ---------- hero ---------- */
.hero{ padding:clamp(28px,6vw,70px) 0 34px; }
.hero h1{ font-size:var(--h1); max-width:16ch; }
.hero h1 .l2{ display:block; color:var(--blue); }
.hero .lede{ margin-top:22px; max-width:58ch; font-size:var(--lead); color:var(--ink2); }
.langs{ margin-top:22px; display:flex; align-items:center; gap:12px; font-weight:600; min-height:30px; }
.langs .tag{ font-size:13px; color:var(--plum); border:1.5px solid var(--plum); border-radius:4px; padding:2px 10px; }
.langs .say{ font-size:18px; }
.langs .say span{ display:inline-block; animation:swap 0.5s ease; }
@keyframes swap{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

/* ---------- the street (signature) ---------- */
.street{ margin-top:44px; position:relative; }
.street-hint{ font-size:15px; color:var(--ink2); margin-bottom:12px; }
.block{ display:flex; gap:0; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 0 0; scrollbar-width:thin; }
.shop{ flex:1 0 190px; scroll-snap-align:start; border:0; padding:0; margin:0; background:none; cursor:pointer; text-align:center; font:inherit; color:inherit; display:flex; flex-direction:column; position:relative; }
.shop:focus-visible{ outline-offset:-3px; }
.facade{ background:var(--white); border-left:1px solid var(--rule); border-top:1px solid var(--rule); flex:1; display:flex; flex-direction:column; }
.shop:last-child .facade{ border-right:1px solid var(--rule); }
.signboard{ letter-spacing:.04em; margin:12px 12px 0; background:var(--c, var(--sign)); color:var(--sc, var(--ink)); border:1px solid var(--rule); border-radius:6px; padding:8px 6px 7px; font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:.02em; line-height:1.05; min-height:52px; display:grid; place-items:center; }
.awning{ height:30px; margin:10px 0 0; background:repeating-linear-gradient(90deg,var(--a) 0 22px,var(--white) 22px 44px); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); position:relative; }
.awning::after{ content:""; position:absolute; left:0; right:0; top:100%; height:12px; background:radial-gradient(circle at 11px 0, var(--a) 10px, transparent 10.5px) 0 0/44px 12px repeat-x, radial-gradient(circle at 33px 0, var(--white) 10px, transparent 10.5px) 0 0/44px 12px repeat-x; filter:drop-shadow(0 2px 0 var(--ink)); }
.storefront{ display:grid; grid-template-columns:1fr 56px; gap:10px; padding:26px 12px 0; flex:1; }
.window{ border:1px solid var(--rule); border-bottom:0; background:#DCE7FB; border-radius:4px 4px 0 0; display:grid; place-items:center; min-height:110px; position:relative; overflow:hidden; }
.window svg{ width:62px; height:62px; }
.door{ border:1px solid var(--rule); border-bottom:0; background:var(--a); border-radius:4px 4px 0 0; position:relative; min-height:150px; align-self:end; }
.door::after{ content:""; position:absolute; right:7px; top:52%; width:7px; height:7px; border-radius:50%; background:var(--ink); }
.open{ position:absolute; left:50%; top:12px; transform:translateX(-50%); font-family:var(--display); font-weight:600; font-size:11px; padding:1px 5px; border-radius:4px; border:1.5px solid #8C8FA8; color:#8C8FA8; background:var(--white); transition:all .25s; }
.shop[aria-expanded="true"] .open, .shop:hover .open{ color:var(--neon); border-color:var(--neon); background:#2A1530; box-shadow:0 0 8px var(--neon), inset 0 0 6px rgba(255,61,127,.5); text-shadow:0 0 6px var(--neon); }
.shop[aria-expanded="true"] .facade{ background:#FFF6D9; }
.shopname{ display:block; padding:10px 6px 12px; font-weight:600; font-size:14px; background:var(--paper); border-top:1px solid var(--rule); }
.shop[aria-expanded="true"] .shopname{ background:var(--ink); color:var(--paper); }
.sidewalk{ height:16px; background:var(--ink); }
.curb{ height:10px; background:repeating-linear-gradient(90deg,var(--paper2) 0 60px,#E6C8BE 60px 64px); }

.inside{ background:var(--ink); color:var(--paper); border-radius:0 0 18px 18px; padding:clamp(22px,4vw,40px); display:grid; grid-template-columns:1.1fr 1fr 1.2fr; gap:28px; }
.inside h3{ font-size:var(--h3); color:var(--sign); grid-column:1/-1; }
.inside h4{ margin:0 0 8px; font-size:15px; color:#C9CBE8; font-weight:600; }
.inside ul{ margin:0; padding-left:18px; }
.inside li{ margin:4px 0; }
.inside .do li::marker{ content:"✓  "; color:var(--sign); }
@media (max-width:860px){ .inside{ grid-template-columns:1fr; gap:18px; } }

/* ---------- sections ---------- */
section.s{ padding:clamp(56px,8vw,100px) 0 0; }
.s h2{ font-size:var(--h2); max-width:22ch; }
.s .intro{ margin-top:14px; max-width:62ch; color:var(--ink2); font-size:var(--lead); }

.plain{ margin-top:30px; background:var(--white); border:1px solid var(--rule); border-radius:6px; padding:clamp(22px,4vw,40px); box-shadow:none; max-width:900px; }
.plain p{ font-size:clamp(18px,1.8vw,21px); line-height:1.55; }
.name360{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--rule); }
.name360 div{ padding:20px 22px 0 0; }
.name360 b{ font-family:var(--display); font-weight:600; font-size:var(--h3); display:block; color:var(--plum); }
.name360 p{ color:var(--ink2); margin-top:6px; }
@media (max-width:760px){ .name360{ grid-template-columns:1fr; } }

.compare{ margin-top:34px; width:100%; border-collapse:collapse; font-size:16px; }
.compare th{ text-align:left; font-family:var(--display); font-weight:600; font-size:17px; padding:0 14px 12px 0; border-bottom:1px solid var(--rule); }
.compare td{ padding:14px 14px 14px 0; border-bottom:1.5px solid #E2C2B8; vertical-align:top; }
.compare td:first-child{ color:var(--ink2); width:30%; }
.compare td:nth-child(2){ color:var(--ink2); width:25%; }
.compare td:nth-child(2) s{ text-decoration-color:var(--plum); text-decoration-thickness:2px; }
.compare td:last-child{ font-weight:600; }
.tablewrap{ overflow-x:auto; }

.decals{ margin-top:34px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:26px 22px; }
.decal{ display:grid; grid-template-columns:76px 1fr; gap:16px; align-items:start; }
.decal .seal{ width:76px; height:76px; border-radius:50%; border:3px dashed var(--blue); display:grid; place-items:center; background:var(--white); }
.decal .seal svg{ width:38px; height:38px; }
.decal h3{ font-size:19px; }
.decal p{ margin-top:6px; color:var(--ink2); font-size:16px; }

/* research tickets */
.tickets{ margin-top:36px; display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:start; }
@media (max-width:900px){ .tickets{ grid-template-columns:1fr; } }
.ticket{ background:var(--white); border:1px solid var(--rule); border-radius:6px; position:relative; }
.ticket .head{ padding:20px 24px 16px; border-bottom:3px dashed var(--ink); display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
.ticket .head b{ font-family:var(--display); font-weight:600; font-size:var(--h3); }
.ticket .head span{ font-size:14px; font-weight:600; color:var(--plum); white-space:nowrap; }
.ticket::before,.ticket::after{ content:""; position:absolute; top:68px; width:22px; height:22px; border-radius:50%; background:var(--paper); border:1px solid var(--rule); }
.ticket::before{ left:-13px; clip-path:inset(0 0 0 50%); }
.ticket::after{ right:-13px; clip-path:inset(0 50% 0 0); }
.ticket .body{ padding:20px 24px 24px; }
.ticket .q{ font-weight:600; font-size:19px; line-height:1.45; }
.ticket h4{ margin:20px 0 8px; font-size:15px; color:var(--ink2); font-weight:600; }
.ticket ol, .ticket ul{ margin:0; padding-left:20px; }
.ticket li{ margin:5px 0; font-size:16px; }
.ticket .cost{ margin-top:20px; display:flex; justify-content:space-between; align-items:baseline; border-top:1.5px solid #E2C2B8; padding-top:12px; font-weight:600; }
.ticket .cost b{ font-family:var(--display); font-size:var(--h3); font-weight:600; color:var(--blue); }
.ticket.two{ margin-top:70px; }
@media (max-width:900px){ .ticket.two{ margin-top:0; } }

.fork{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.fork div{ border-left:4px solid var(--plum); padding:4px 0 4px 16px; }
.fork b{ display:block; font-size:16px; }
.fork p{ color:var(--ink2); font-size:15px; margin-top:4px; }
@media (max-width:760px){ .fork{ grid-template-columns:1fr; } }

.quote{ margin-top:clamp(56px,8vw,100px); background:var(--blue); color:var(--white); padding:clamp(30px,6vw,70px) 0; }
.quote blockquote{ margin:0; font-family:var(--display); font-weight:600; font-size:clamp(22px,2.6vw,32px); line-height:1.25; max-width:34ch; }
.quote cite{ display:block; margin-top:20px; font-style:normal; font-size:16px; opacity:.85; }
.quote .why{ margin-top:18px; max-width:60ch; font-size:17px; }

.door-sign{ margin-top:30px; background:var(--white); border:1px solid var(--rule); border-radius:6px 18px 4px 4px; padding:26px clamp(20px,4vw,40px); max-width:760px; position:relative; }
.door-sign::before{ content:""; position:absolute; top:-26px; left:50%; width:120px; height:26px; transform:translateX(-50%); border:1px solid var(--rule); border-bottom:0; border-radius:60px 60px 0 0; }
.door-sign ul{ list-style:none; margin:0; padding:0; display:grid; gap:12px; }
.door-sign li{ display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:17px; }
.door-sign li::before{ content:"✕"; color:var(--plum); font-weight:700; }
.door-sign li.yes::before{ content:"✓"; color:var(--blue); }

.funders{ margin-top:30px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:18px 40px; }
.funders div{ border-top:1px solid var(--rule); padding-top:14px; }
.funders b{ font-size:18px; }
.funders p{ color:var(--ink2); font-size:16px; margin-top:4px; }
.bars{ margin-top:40px; display:grid; gap:14px; max-width:820px; }
.bar{ display:grid; grid-template-columns:200px 1fr; gap:14px; align-items:center; }
.bar span{ font-weight:600; font-size:15px; }
.bar i{ display:block; height:38px; background:var(--plum); border:1px solid var(--rule); border-radius:6px; position:relative; }
.bar i b{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--white); font-family:var(--display); font-weight:600; font-size:18px; font-style:normal; }
.bar.big i{ background:var(--blue); }
@media (max-width:600px){ .bar{ grid-template-columns:1fr; gap:6px; } }
.note{ margin-top:12px; font-size:14px; color:var(--ink2); }

/* get involved */
.join{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:var(--white); }
.join button{ font:inherit; border:0; border-right:1px solid var(--rule); background:var(--white); padding:22px 16px; text-align:left; cursor:pointer; color:var(--ink); }

.join button b{ display:block; font-family:var(--display); font-weight:600; font-size:18px; }
.join button small{ color:var(--ink2); font-size:14px; }
.join button[aria-pressed="true"]{ background:var(--sign); }
.join button:nth-child(3n){ border-right:0; } .join button:nth-child(-n+3){ border-bottom:1px solid var(--rule); }
@media (max-width:760px){ .join{ grid-template-columns:1fr 1fr; } .join button{ border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); } .join button:nth-child(2n){ border-right:0; } .join button:nth-last-child(-n+2){ border-bottom:0; } }
.joinform{ margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:820px; }
.joinform label{ display:grid; gap:6px; font-weight:600; font-size:15px; }
.joinform input,.joinform textarea{ font:inherit; border:1px solid var(--rule); border-radius:6px; padding:11px 12px; background:var(--white); }
.joinform .full{ grid-column:1/-1; }
.joinform button{ justify-self:start; font:inherit; font-weight:700; background:var(--ink); color:var(--paper); border:0; border-radius:4px; padding:13px 24px; cursor:pointer; }
.joinform button:hover{ background:var(--blue); }
.msg{ grid-column:1/-1; font-weight:600; min-height:24px; }
.msg.err{ color:#B42318; }
@media (max-width:600px){ .joinform{ grid-template-columns:1fr; } }

footer{ margin-top:clamp(60px,8vw,100px); background:var(--ink); color:#C9CBE8; padding:34px 0 calc(34px + env(safe-area-inset-bottom,0px)); font-size:14px; }
footer .wrap{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px; }
footer b{ color:var(--paper); font-family:var(--display); font-weight:600; font-size:18px; }

/* help / volunteers */
.roles{ margin-top:30px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:0; border-top:1px solid var(--rule); }
.role{ padding:22px 24px 22px 0; border-bottom:1.5px solid #E2C2B8; display:grid; gap:6px; align-content:start; }
.role h3{ font-size:19px; }
.role p{ color:var(--ink2); font-size:16px; }
.role .time{ font-size:14px; font-weight:600; color:var(--plum); }
.commit{ margin-top:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; max-width:980px; }
.commit div{ background:var(--white); border:1px solid var(--rule); border-radius:6px; padding:18px 20px; }
.commit b{ font-family:var(--display); font-weight:600; font-size:var(--h3); display:block; }
.commit p{ color:var(--ink2); font-size:15px; margin-top:6px; }
@media (max-width:760px){ .commit{ grid-template-columns:1fr; } }
.contact{ margin-top:22px; font-size:var(--lead); }
.contact a{ font-weight:700; }

/* onboarding */
body.gated{ overflow:hidden; }
#gate{ position:fixed; inset:0; z-index:100; background:var(--paper); overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; }
#gate.hidden{ display:none; }
#gate .gtop{ display:flex; justify-content:space-between; align-items:center; padding:18px clamp(18px,4vw,40px); }
#gate .gbody{ flex:1; display:grid; place-items:center; padding:10px clamp(18px,4vw,40px) 40px; }
.gcard{ width:min(620px,100%); }
.gcard h1{ font-size:var(--h2); }
.gcard h1 .l2{ color:var(--blue); display:block; }
.gcard .gp{ margin-top:16px; color:var(--ink2); font-size:var(--lead); max-width:52ch; }
.gsteps{ display:flex; gap:6px; margin-bottom:22px; }
.gsteps i{ flex:1; height:8px; border-radius:4px; background:#E8C9BF; transform:skewX(-24deg); }
.gsteps i.on{ background:var(--blue); }
.gfield{ margin-top:24px; display:grid; gap:8px; font-weight:600; }
.gfield input{ font:inherit; font-size:18px; border:1px solid var(--rule); border-radius:6px; padding:14px 16px; background:var(--white); }
.gerr{ color:#B42318; font-weight:600; min-height:24px; margin-top:8px; font-size:15px; }
.gnote{ font-size:14px; color:var(--ink2); margin-top:4px; }
.gbtns{ margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.gbtn{ font:inherit; font-weight:700; background:var(--ink); color:var(--paper); border:0; border-radius:4px; padding:14px 26px; cursor:pointer; font-size:17px; }
.gbtn:hover{ background:var(--blue); }
.gbtn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--rule); }
.gbtn.ghost:hover{ background:var(--white); }
.gpoints{ margin-top:22px; display:grid; gap:12px; padding:0; list-style:none; }
.gpoints li{ display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; background:var(--white); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; }
.gpoints li span{ width:34px; height:34px; border-radius:50%; background:var(--sign); border:1px solid var(--rule); display:grid; place-items:center; font-weight:600; }
.minirow{ margin-top:22px; display:flex; height:70px; border:1px solid var(--rule); border-bottom:0; border-radius:8px 8px 0 0; overflow:hidden; }
.minirow i{ flex:1; border-right:1px solid var(--rule); background:repeating-linear-gradient(90deg,var(--a) 0 12px,var(--white) 12px 24px) top/100% 22px no-repeat, var(--white); }
.minirow i:last-child{ border-right:0; }
.minibase{ height:10px; background:var(--ink); border-radius:0 0 6px 6px; }
.glangs{ margin-top:24px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.glangs button, .gchips button{ font:inherit; font-weight:600; font-size:17px; text-align:left; padding:14px 16px; border:1px solid var(--rule); border-radius:6px; background:var(--white); color:var(--ink); cursor:pointer; }
.glangs button[aria-checked="true"], .gchips button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
.gchips{ margin-top:22px; display:flex; flex-wrap:wrap; gap:8px; }
.gchips button{ border-radius:4px; padding:10px 16px; font-size:16px; }
.gchips button[aria-pressed="true"]::before{ content:"✓ "; }
.gfields{ margin-top:24px; display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.gfields div{ background:var(--white); border:1px solid var(--rule); border-radius:6px; padding:12px 6px 10px; display:grid; justify-items:center; gap:6px; text-align:center; color:var(--blue); }
.gfields div:nth-child(odd){ color:var(--plum); }
.gfields svg{ width:34px; height:34px; }
.gfields span{ color:var(--ink); font-size:12.5px; font-weight:600; line-height:1.2; overflow-wrap:break-word; }
@media (max-width:620px){ .gfields{ grid-template-columns:repeat(3,1fr); gap:8px; } .gfields div{ padding:10px 3px 8px; } .gfields svg{ width:28px; height:28px; } .gfields span{ font-size:11.5px; } }
@media (max-width:520px){ .glangs{ grid-template-columns:1fr; } }
.gh2{ margin-top:26px; font-size:var(--h3); }
.gways{ list-style:none; padding:0; margin:14px 0 0; display:grid; gap:8px; }
.gways li{ display:flex; justify-content:space-between; gap:12px; align-items:center; background:var(--white); border:1px solid var(--rule); border-radius:6px; padding:12px 16px; font-weight:500; }
.gways li.mine{ background:var(--sign); font-weight:700; }
.gways em{ font-style:normal; font-size:13px; font-weight:700; background:var(--ink); color:var(--paper); border-radius:4px; padding:2px 10px; white-space:nowrap; }
.linkish{ font:inherit; background:none; border:0; color:inherit; text-decoration:underline; cursor:pointer; padding:0; }

.nav{ display:flex; align-items:center; gap:16px; position:relative; }
.navlinks{ display:flex; gap:22px; align-items:center; }
.langsel{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); border-radius:4px; padding:5px 10px; background:var(--white); color:var(--ink); }
.langsel select{ font:inherit; font-size:14px; font-weight:600; border:0; background:transparent; color:var(--ink); cursor:pointer; }
.menubtn{ display:none; font:inherit; font-weight:700; font-size:14px; background:var(--ink); color:var(--paper); border:0; border-radius:4px; padding:8px 14px; cursor:pointer; }
.langsel.mob{ display:none; }
@media (max-width:760px){
  .langsel.desk{ display:none; }
  .top{ position:relative; }
  .nav{ position:static; }
  .navlinks{ display:none; position:absolute; top:calc(100% - 6px); left:0; right:0; flex-direction:column; align-items:stretch; background:var(--white); border:1px solid var(--rule); border-radius:6px; padding:10px; gap:2px; z-index:30; box-shadow:none; }
  .nav.is-open .navlinks{ display:flex; }
  .navlinks a{ padding:12px; border-radius:8px; }
  .navlinks a:hover{ background:var(--paper); text-decoration:none; }
  .navlinks .langsel.mob{ display:flex; margin:6px 0 2px; justify-content:flex-start; padding:9px 12px; }
  .navlinks .langsel.mob select{ flex:1; font-size:15px; }
  .navlinks .cta{ text-align:center; margin-top:6px; }
  .menubtn{ display:inline-flex; }
}
.hero h1:focus{ outline:none; }
.commith{ margin-top:44px; }
.gways li span{ display:grid; gap:2px; }
.gways li small{ font-weight:400; color:var(--ink2); font-size:14px; line-height:1.4; }
.gways li.mine small{ color:var(--ink); }
.viewsw{ position:fixed; left:16px; bottom:16px; z-index:50; display:inline-flex; align-items:center; gap:4px; background:var(--ink); padding:5px; border-radius:4px; box-shadow:0 6px 18px rgba(26,31,69,.25); }
.viewsw > span{ color:#C9CBE8; font-size:12px; font-weight:600; padding:0 6px 0 8px; }
.viewsw button{ font:inherit; font-size:13px; font-weight:600; border:0; background:transparent; color:#C9CBE8; border-radius:4px; padding:6px 12px; cursor:pointer; }
.viewsw button[aria-pressed="true"]{ background:var(--paper); color:var(--ink); }
.viewsw button:not([aria-pressed="true"]):hover{ color:var(--paper); }
@media (max-width:900px){ .viewsw{ display:none; } }
body.gated .viewsw{ display:none; }
.viewsw{ display:none !important; }
#phoneview{ position:fixed; inset:0; z-index:200; background:rgba(26,31,69,.78); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; }
#phoneview.hidden{ display:none; }
.pv-frame{ width:414px; height:min(820px,calc(100vh - 100px)); border:12px solid #111; border-radius:6px; overflow:hidden; background:var(--paper); box-shadow:0 24px 60px rgba(0,0,0,.45); }
.pv-frame iframe{ width:100%; height:100%; border:0; display:block; }
.pv-close{ font:inherit; font-weight:700; background:var(--paper); color:var(--ink); border:0; border-radius:4px; padding:11px 22px; cursor:pointer; }

/* ---- journal layout ---- */
body{ background:var(--paper); }
:root{ --h1:clamp(34px,4.4vw,56px); --h2:clamp(26px,2.8vw,38px); }
.top{ border-bottom:1px solid var(--ink); padding:20px 0 16px; margin-bottom:6px; }
.brand .tagline{ display:block; margin-top:5px; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); font-weight:600; }
.topright{ display:flex; align-items:center; gap:10px; }
.top .langsel.desk{ display:inline-flex !important; border:1px solid var(--rule); border-radius:4px; background:transparent; }
.top .cta{ font:inherit; font-size:14px; font-weight:600; letter-spacing:.01em; background:var(--ink); color:var(--white); border:0; border-radius:4px; padding:10px 16px; cursor:pointer; }
.top .cta:hover{ background:var(--blue); }
.menubtn, .navlinks{ display:none !important; }
.shell{ display:grid; grid-template-columns:176px minmax(0,1fr); gap:clamp(32px,5vw,72px); align-items:start; padding-bottom:clamp(56px,8vw,96px); }
.rail{ position:sticky; top:24px; padding-top:clamp(24px,4vw,44px); }
.railh{ margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--rule); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); }
.rail ol{ list-style:none; margin:0; padding:0; display:grid; gap:0; }
.rail button{ display:grid; grid-template-columns:24px 1fr; gap:8px; align-items:baseline; width:100%; text-align:left; background:none; border:0; border-left:2px solid transparent; padding:7px 0 7px 10px; font:inherit; color:var(--ink2); cursor:pointer; }
.rail button:hover{ color:var(--ink); }
.rail .pin{ font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink2); opacity:.7; }
.rail .lbl b{ display:block; font-size:14px; font-weight:500; line-height:1.3; }
.rail .lbl small{ display:none; }
.rail [aria-current]{ color:var(--ink); border-left-color:var(--blue); }
.rail [aria-current] .lbl b{ font-weight:700; }
.rail [aria-current] .pin{ color:var(--blue); opacity:1; }
.panel{ min-width:0; outline:none; }
.panel > section.s:first-child{ padding-top:clamp(24px,4vw,44px); }
.panel .hero{ padding-top:clamp(24px,4vw,44px); }
.panel .quote{ margin-top:clamp(40px,6vw,64px); border-radius:0; background:transparent; color:var(--ink); border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); padding:clamp(24px,3.5vw,40px) 0; }
.panel .quote blockquote{ font-weight:500; font-style:italic; }
.panel .quote cite{ color:var(--ink2); opacity:1; }
.panel .quote .why{ color:var(--ink2); }
.pager{ display:flex; justify-content:space-between; gap:16px; margin-top:clamp(48px,7vw,80px); padding-top:18px; border-top:1px solid var(--rule); }
.pg{ font:inherit; display:flex; flex-direction:column; gap:2px; text-align:left; border:0; padding:4px 0; background:none; color:var(--ink); cursor:pointer; min-width:0; }
.pg span{ font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); }
.pg b{ font-family:var(--display); font-weight:500; font-size:21px; line-height:1.2; }
.pg.fwd{ margin-left:auto; text-align:right; }
.pg.fwd b{ color:var(--blue); }
.pg:hover b{ text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px; }
@media (max-width:900px){
  .brand .tagline{ display:none; }
  .shell{ grid-template-columns:minmax(0,1fr); gap:0; }
  .rail{ position:sticky; top:0; z-index:20; background:var(--paper); margin:0 calc(-1 * clamp(18px,4vw,40px)); padding:0 clamp(18px,4vw,40px); overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--rule); }
  .rail::-webkit-scrollbar{ display:none; }
  .railh{ display:none; }
  .rail ol{ display:flex; gap:18px; width:max-content; }
  .rail button{ border-left:0; border-bottom:2px solid transparent; padding:12px 0 10px; grid-template-columns:auto auto; gap:6px; white-space:nowrap; }
  .rail [aria-current]{ border-bottom-color:var(--blue); }
}
@media (max-width:520px){
  .top .cta{ display:none; }
}
@media (min-width:901px){ .shop{ flex:1 0 138px; } .signboard{ font-size:13.5px; margin:10px 8px 0; } }
.ticket.two{ margin-top:0 !important; transform:none !important; }
.ticket{ transform:none !important; }

/* ---- shop scenes ---- */
.shop .open{ cursor:pointer; font-size:12px; padding:2px 7px; }
.shop .open:hover{ transform:translateX(-50%) scale(1.12); }
.stepin{ grid-column:1/-1; justify-self:start; font:inherit; font-size:15px; font-weight:700; background:var(--sign); color:var(--ink); border:0; border-radius:4px; padding:11px 18px; cursor:pointer; }
.stepin:hover{ background:#FFFFFF; }
.scene{ padding-top:clamp(24px,4vw,44px); }

a organización sin fines de lucro dedicada a la salud y la seguridad de los pequeños negocios y de quienes trabajan en ellos, en sus propios idiomas, a bajo o ningún costo.","promise":"Cada trabajador. Cada lugar de trabajo.","hint":"Empezaremos en un estado. Elige un negocio para ver qué enfrentan sus trabajadores y cómo podemos ayudar.","shopnames":{"nails":"Salón de uñas","food":"Restaurante","store":"Tienda de la esquina","auto":"Taller mecánico","hair":"Peluquería","clean":"Equipo de limpieza"},"inside":["Quién trabaja aquí","A qué se enfrentan","Cómo puede ayudar OEM360"],"shops":{"nails":["Dentro del salón de uñas","Equipos pequeños y jornadas largas. Muchas trabajadoras de salones de uñas hablan vietnamita, coreano, chino, nepalí o español, y muchas son contratistas independientes sin compensación laboral.",["Vapores de esmaltes, acrílicos y removedores","Polvo al limar","Dolor de cuello, espalda y muñecas por inclinarse sobre los clientes"],["Conectar a los salones con consultas de seguridad gratuitas y confidenciales, como el Programa de Consultoría en Sitio de OSHA, y ayudar con la inscripción","Reunir a dueños, trabajadores y grupos comunitarios locales para hablar de lo que ayudaría","Aprender del Programa de Reconocimiento de Salones de Uñas Saludables de California y, si muestra beneficios claros, trabajar con grupos locales para empezar poco a poco algo parecido donde comencemos","Si ayuda, un registro privado de exposiciones que los trabajadores guardan sobre los productos que usan, para compartir con su propio médico si lo desean"]],"food":["Dentro del restaurante","Cocineros, meseros y lavaplatos trabajando rápido en cocinas calientes y llenas.",["Quemaduras y cortes","Resbalones en pisos mojados","Calor, cargar peso y químicos de limpieza fuertes"],["Conectar a los restaurantes con consultas de seguridad gratuitas y capacitaciones existentes para trabajadores de comida","Compartir materiales cortos de seguridad de fuentes confiables, en los idiomas de los trabajadores","Ayuda para encontrar una clínica de salud ocupacional cuando alguien se quema o se corta","Si ayuda, una lista sencilla en el teléfono para que los dueños la completen antes de abrir"]],"store":["Dentro de la tienda de la esquina","A menudo una familia y uno o dos empleados, abierta desde temprano hasta tarde.",["Cargar mercancía y subir escaleras","Muchas horas de pie","Riesgos de seguridad en la noche"],["Conectar a los dueños con consultas de seguridad gratuitas y recursos para pequeños negocios","Ayudar a los dueños a buscar becas para arreglos básicos, como escaleras más seguras o mejor iluminación","Compartir guías de seguridad nocturna de fuentes confiables, en el idioma del dueño","Ayuda para encontrar atención cuando alguien se lastima la espalda cargando mercancía"]],"auto":["Dentro del taller mecánico","Mecánicos y hojalateros rodeados de motores, pintura y piezas pesadas.",["Pinturas, solventes y gases de escape","Ruido","Piezas pesadas, cortes y aplastamientos"],["Conectar a los talleres con el Programa gratuito de Consultoría en Sitio de OSHA y ayudar con los trámites","Enlazar a los talleres con programas existentes sobre pinturas, solventes y ventilación","Hacer clara la información de seguridad de los productos en los idiomas de los mecánicos","Si ayuda, una herramienta que señale qué productos requieren mascarilla o guantes"]],"hair":["Dentro de la peluquería","Estilistas de pie todo el día; muchos rentan su propia silla.",["Tintes y decolorantes","Alisados que pueden liberar formaldehído","Dolor de hombros y espalda"],["Conectar a los salones con consultas de seguridad gratuitas y recursos existentes de seguridad para salones","Compartir información clara sobre productos más seguros y tratamientos alisadores, en los idiomas de los estilistas","Orientar a quienes rentan silla hacia ayuda sobre sus derechos en centros de trabajadores y ayuda legal","Si ayuda, una herramienta que señale productos que pueden liberar formaldehído"]],"clean":["Dentro del equipo de limpieza","Equipos pequeños que limpian oficinas y casas, muchas veces de noche.",["Mezclar químicos de limpieza fuertes","Resbalones y caídas","Cargar peso y trabajar solo"],["Conectar a las cuadrillas con centros de trabajadores y capacitaciones existentes sobre químicos de limpieza","Compartir una guía con imágenes sobre qué químicos nunca mezclar, en los idiomas de los trabajadores","Reunir a empresas de limpieza y trabajadores para planear el trabajo en solitario de noche","Si ayuda, un registro privado de exposiciones que cada trabajador posee y puede llevar de un trabajo a otro"]]},"plainH":"En pocas palabras","plainP":"Cada pequeño negocio es diferente. Algunos necesitan conectarse con ayuda que ya existe. Otros necesitan que un programa probado llegue a su ciudad. Otros necesitan una herramienta sencilla que todavía no existe. OEM360 empieza por escuchar y estudiar lo que cada lugar de trabajo necesita, y luego hace lo que más ayude.","n360":[["Cada lugar de trabajo","No solo las grandes empresas. También los pequeños negocios que nunca reciben ayuda."],["Cada trabajador","Cualquier idioma, cualquier trabajo, empleado o contratista independiente."],["El panorama completo","Primero la prevención, y además ayuda para encontrar atención y volver al trabajo de forma segura."]],"cmpH":"Un departamento de seguridad compartido","cmpI":"Cincuenta pequeños negocios no pueden contratar cada uno a un encargado de seguridad. Juntos, y con los programas que ya existen, podrían compartir el tipo de ayuda que tienen las grandes empresas.","cmpTh":["Las grandes empresas tienen","Los negocios pequeños suelen tener","Lo que aporta OEM360"],"cmp":[["Un encargado de seguridad","Nadie","Un enlace al Programa de Consultoría en Sitio de OSHA, gratuito, confidencial y separado de las inspecciones"],["Una lista de químicos y hojas de datos de seguridad","Un estante de productos","Ayuda para armar una lista de químicos y encontrar las Hojas de Datos de Seguridad"],["Capacitación en seguridad","“Mira cómo lo hago”","Capacitaciones que ya existen, explicadas en los idiomas de los trabajadores"],["Una clínica de salud ocupacional","La sala de emergencias, o nada","Ayuda para encontrar atención de salud ocupacional, incluidas clínicas gratuitas o de bajo costo"],["Registro de lesiones","Nada por escrito","Ayuda para entender qué registros se requieren y llevarlos de forma sencilla"],["Un plan de regreso al trabajo","Renunciar o trabajar lastimado","Ayuda para planear un regreso seguro al trabajo con el propio médico del trabajador"]],"whatH":"Herramientas que podríamos crear","decals":[["Registro personal de exposiciones","Un registro privado que pertenece al trabajador: los empleos que ha tenido, los productos con los que ha trabajado y los síntomas que nota. El trabajador decide si lo comparte con su propio médico y cuándo. Está hecho para ayudar a los trabajadores y a sus médicos, no para denunciar ni castigar a los negocios."],["Foto a la etiqueta","Los dueños fotografían cada producto y la herramienta ayuda a armar su lista de químicos y encontrar las Hojas de Datos de Seguridad."],["Lista de seguridad del negocio","Una lista corta, con imágenes, que un dueño puede completar en el teléfono en pocos minutos."]],"resH":"Empezamos con investigación","resI":"La brecha ya está bien documentada. Por eso, nuestro primer proyecto mapea la ayuda que existe en la zona y por qué no se usa, y el segundo prueba si nuestro enfoque ayuda.","p1":"Proyecto 1","d1":"Unos 9 meses","q1":"¿Qué ayuda de seguridad y salud tienen hoy a su alcance los pequeños negocios, y por qué tanta de esa ayuda no se usa?","how":"Cómo lo averiguaremos","s1":["Mapear los servicios de seguridad gratuitos o de bajo costo cercanos, y los idiomas en que se ofrecen.","Encuestar a dueños y trabajadores, en sus propios idiomas, sobre qué les impide usar esa ayuda.","Con permiso, recorrer los negocios con una lista de verificación sencilla.","Tener conversaciones a fondo con dueños y trabajadores, junto con aliados de la comunidad.","Publicar un mapa de servicios locales y un informe en lenguaje sencillo."],"p2":"Proyecto 2","d2":"Unos 18 meses","q2":"¿Un programa de seguridad gratuito y multilingüe hace que los pequeños negocios pongan en marcha mejoras de seguridad concretas, en comparación con negocios que empiezan más tarde?","s2":["Diseñar un plan sencillo para conectar a los negocios con la ayuda que ya existe, más las herramientas pequeñas que el Proyecto 1 muestre que hacen falta.","Probarla con pocos negocios y arreglar lo que no funcione.","Comparar negocios que empiezan de inmediato con negocios que empiezan más tarde, para que todos reciban el programa.","Medir qué mejoras de seguridad están en marcha con una lista observada, además del conocimiento de los trabajadores, el uso y el costo.","Compartir los resultados en cada idioma con que trabajamos, incluido lo que no funcionó."],"fork":[["Si la brecha es real","Hacemos el Proyecto 2 y probamos el programa completo."],["Si la ayuda existe pero no se usa","Conectamos a los negocios con ella, en su idioma, en vez de volver a crearla."],["Si la brecha es menor de lo que pensamos","Vamos a donde esté la verdadera necesidad."]],"cite":"Un médico de medicina ocupacional y ambiental, en un comentario público","qnote":"","why":"Si incluso los buenos empleadores rara vez registran a qué se exponen sus trabajadores, la tienda de la esquina casi nunca lo hace.","doorH":"Nuestro letrero en la puerta","doorI":"Dueños y trabajadores necesitan confiar en nosotros antes de dejarnos entrar. Estos son los compromisos hacia los que trabajamos, y abogados los revisarán antes de lanzar.","doorNo":["No somos inspectores, y no denunciamos negocios ante las autoridades.","Diseñamos nuestras herramientas para que los dueños no vean los detalles de salud de los trabajadores.","Planeamos guardar la menor cantidad posible de información que identifique a los trabajadores, para que haya poco que se pueda entregar.","No damos asesoría legal. Conectamos a las personas con ayuda legal."],"doorYes":["Planeamos trabajar junto al programa de consultoría gratuito y confidencial de OSHA para pequeños negocios.","Los trabajadores eligen qué compartir y pueden parar cuando quieran."],"fundH":"Cómo lo financiaremos","fund":[["Becas de investigación","Becas de investigación de NIOSH y universidades, junto con un socio académico o patrocinador fiscal."],["Fundaciones","Fundaciones enfocadas en la salud de los trabajadores, la salud de inmigrantes, la salud ambiental y la equidad en salud."],["Gobierno local","Departamentos de salud de ciudades y condados que ya apoyan programas para negocios pequeños."],["Aseguradoras y fondos estatales","Algunas podrían apoyar la prevención en los negocios que cubren, donde los trabajadores tienen cobertura."],["Patrocinadores de la comunidad","Cámaras de comercio, asociaciones de salones, escuelas de belleza y proveedores."],["Cuotas pequeñas, más adelante","Una membresía con tarifa ajustable para los negocios que quieran más visitas, cuando el programa esté probado."]],"helpH":"Ayúdanos a construirlo","helpI":"Somos un equipo pequeño con mucha calle por recorrer. Tengas unas horas al mes o un semestre completo, hay un lugar para ti.","roles":[["Voluntarios de alcance comunitario","Visita negocios con nuestro equipo, comparte materiales y ayuda a que dueños y trabajadores se sientan cómodos. Se necesitan especialmente hablantes de español, chino, tagalo, vietnamita, criollo haitiano y otros idiomas.","Unas horas al mes"],["Traductores e intérpretes","Traduce encuestas, guías de seguridad y pantallas de la app, y pruébalas con trabajadores reales para que se entiendan.","Por proyecto"],["Pasantes de salud pública y ciencias de la salud","Ayuda con el estudio de brechas: mapea servicios, haz encuestas y escribe el informe en lenguaje sencillo.","Un semestre, unas 8 a 10 horas por semana"],["Ingenieros de software","Cuando nuestra investigación muestre que una herramienta ayudaría, ayuda a crearla: sencilla, privada y multilingüe.","Continuo, horario flexible"],["Diseñadores","Haz que todo sea fácil de usar en un teléfono viejo, en cualquier idioma, en un descanso de dos minutos.","Por proyecto"],["Profesionales de salud y seguridad","Enfermeras, médicos, higienistas industriales y profesionales de seguridad que puedan asesorar, revisar materiales o, en el futuro, ayudar a conectar negocios con atención médica.","Unas horas al mes"],["Investigadores","Profesores y estudiantes de posgrado que quieran colaborar en los dos estudios y en las solicitudes de becas.","Por proyecto"],["Dueños de negocios y trabajadores","Únete a nuestro primer grupo, cuéntanos qué necesitas y ayuda a darle forma a lo que construimos. Tu voz va primero.","Cuando puedas"]],"commitH":"Tú decides cuánto tiempo das","commit":[["De vez en cuando","Ayuda en un evento, traduce una página o prueba la app una vez."],["Regular","Unas horas al mes en alcance comunitario, traducción o asesoría."],["Comprometido","Una pasantía de un semestre o un rol continuo construyendo, con un proyecto claro y un mentor."]],"contactQ":"¿Preguntas? Escríbenos a","joinH":"Participa","joinI":"Buscamos negocios, trabajadores, voluntarios, pasantes, ingenieros, socios y donantes para construir esto juntos.","btns":{"owner":["Tengo un negocio","Únete al primer grupo"],"worker":["Trabajo en un negocio","Cuéntanos qué necesitas"],"volunteer":["Quiero ser voluntario","Alcance, traducción, diseño"],"intern":["Pasante o ingeniero","Investigación, salud pública, la app"],"partner":["Quiero ser socio","Centros de trabajadores, clínicas, universidades"],"funder":["Hablemos","Fundaciones, patrocinadores, agencias"]},"fName":"Tu nombre","fContact":"Correo o teléfono","msgs":{"owner":"Cuéntanos sobre tu negocio","worker":"¿Qué te ayudaría en el trabajo? Puedes escribir en cualquier idioma.","volunteer":"¿En qué te gustaría ayudar y qué idiomas hablas?","intern":"Cuéntanos tu escuela o habilidades, y cuántas horas por semana puedes dar","partner":"Cuéntanos sobre tu organización","funder":"Cuéntanos sobre tu organización y cómo te gustaría trabajar juntos"},"send":"Enviar","eReq":"Agrega tu nombre y un correo o teléfono para poder contactarte.","thanks":"¡Gracias! Recibimos tu mensaje y te contactaremos pronto.","sending":"Enviando…","sendErr":"No se pudo enviar. Inténtalo de nuevo o escríbenos a","np":"Organización sin fines de lucro en formación.","contact":"Contacto","preview":"","replay":"Ver la introducción otra vez","view":"Vista","desktop":"Escritorio","mobile":"Móvil","close":"Cerrar vista móvil","ways":[["Cuéntanos lo que vives en el trabajo","Dinos qué es difícil, inseguro o confuso en tu trabajo. Tus respuestas guían todo lo que construimos."],["Trae tu negocio desde el inicio","Sé uno de los primeros negocios en ayudar a dar forma a nuestro piloto."],["Comparte tu tiempo y talento","Haz voluntariado en tu comunidad, traduce para trabajadores o únete como pasante."],["Crea las herramientas con nosotros","Ingenieros y diseñadores: ayuden a crear herramientas para trabajadores y negocios, donde hagan falta."],["Asóciate con nosotros","Clínicas, escuelas, centros de trabajadores y financiadores: hablemos de trabajar juntos."]],"bridge":"Ningún producto único. Lo que cada lugar de trabajo necesite.","rolesH":"Cómo trabajamos","rolesI":"Empezamos con tres pequeños negocios distintos en una ciudad, cada uno con sus propios retos de salud y seguridad en el trabajo. Trabajando de cerca con dueños y trabajadores, identificaremos lo que necesitan, los conectaremos con recursos existentes y crearemos soluciones prácticas donde queden vacíos. Lo que aprendamos de este primer piloto guiará cómo crece OEM360 y cómo sirve a más comunidades.","roles8":[["Conectar","Vincular a negocios y trabajadores con la ayuda gratuita que ya existe, como clínicas de salud ocupacional, centros de trabajadores y el Programa de Consultoría en Sitio de OSHA. Ese programa es gratuito, confidencial y separado de las inspecciones, sin citaciones ni multas. El dueño lo solicita y se compromete a corregir los peligros graves que se encuentren."],["Adaptar programas probados","Llevar programas que funcionan en otros lugares al estado donde empecemos, junto con grupos locales. Por ejemplo, el Programa de Reconocimiento de Salones de Uñas Saludables de California es un programa gratuito y voluntario, a cargo de los condados y del Departamento de Control de Sustancias Tóxicas del estado, para proteger a trabajadores, clientes y el medio ambiente. Si vemos cómo ayuda, podríamos empezar poco a poco algo parecido."],["Crear herramientas","Crear software sencillo, privado y multilingüe donde de verdad ayude, como un registro personal de exposiciones que los trabajadores guardan para sí mismos y para sus propios médicos."],["Traducir","Hacer claros los materiales de seguridad en español, chino, coreano, nepalí, tagalo, vietnamita, criollo haitiano y más."],["Organizar","Reunir en la misma mesa a dueños, trabajadores, clínicas, grupos comunitarios y escuelas."],["Inscribir","Ayudar a los dueños a inscribirse en programas y herramientas existentes, y encargarse de los trámites."],["Abogar","Alzar la voz por los trabajadores de pequeños negocios y sus necesidades, en sus idiomas."],["Financiar","Ayudar a negocios y aliados comunitarios a encontrar becas y recursos, y con el tiempo canalizar fondos a programas locales."]],"toolsI":"El software es una de las formas en que podemos ayudar, no la única. Cuando nuestra investigación muestra que una herramienta de verdad ayudaría a un lugar de trabajo, la creamos: sencilla, privada, multilingüe y gratuita.","disc":"OEM360 es una organización sin fines de lucro en formación. No damos consejos médicos ni legales. En una emergencia, llama al 911.","pilot":"Empezamos en un estado y desde ahí crecemos.","status":"Fase 1: escuchar y crear alianzas. Todavía no ofrecemos servicios.","pilotTag":"Piloto","laterTag":"Después","aboutH":"Sobre OEM360","seekH":"Buscamos","seek":["Un mentor académico","Un patrocinador fiscal","Aliados comunitarios en el estado donde empecemos"],"whoH":"Quiénes ya hacen este trabajo","whoI":"Muchos grupos ya hacen un trabajo importante. No estamos afiliados a ellos. Nuestro papel es ayudar a los pequeños negocios y a sus trabajadores a encontrar y usar lo que ofrecen, en sus propios idiomas.","who":[["Programa de Consultoría en Sitio de OSHA","Ayuda de seguridad gratuita y confidencial para pequeños negocios en todos los estados, separada de las inspecciones. Sin citaciones ni multas. El dueño la solicita y se compromete a corregir los peligros graves que se encuentren."],["Clínicas de salud ocupacional","Clínicas que diagnostican y ayudan a prevenir enfermedades relacionadas con el trabajo, incluidas algunas que atienden a personas sin seguro."],["Grupos COSH","Coaliciones locales de seguridad laboral en muchos estados que ofrecen capacitación y defensa."],["Centros de trabajadores y grupos comunitarios","Grupos que apoyan a trabajadores inmigrantes, a menudo en sus propios idiomas."],["Programas estatales y locales","Programas como el reconocimiento de salones de uñas saludables en algunos condados de California, y reglas estatales sobre temas como la ventilación de salones."]],"evH":"La evidencia en la que nos basamos","ev":[["Salones de uñas de Filadelfia","Investigadores y la comunidad vietnamita de salones de uñas diseñaron juntos un programa de salud, lo que muestra el valor de construir con la comunidad desde el inicio."],["Talleres y salones de belleza de Tucson","Un programa de promotores de salud mantuvo la participación de la mayoría de los negocios, pero no encontró una baja significativa en los niveles de químicos. Ofreció hasta $300 por negocio para mejoras como ventilación y productos más seguros. Tomamos en serio ambas lecciones."]],"outcome":"Nuestra medida principal, definida de antemano: la proporción de negocios con mejoras de seguridad clave en marcha, verificadas en persona. Planeamos realizar nuestros estudios con revisión ética universitaria y reservar un pequeño fondo para mejoras como ventilación y productos más seguros.","mt":"Esta traducción se hizo con IA y la están revisando hablantes nativos.","privacy":"Solo usamos lo que compartes para responderte sobre OEM360. No lo vendemos ni lo compartimos con empleadores. Por favor, no incluyas datos de salud ni el nombre de tu lugar de trabajo.","founderS":"Fundada en la convicción de que todo trabajador merece un lugar de trabajo más seguro.","mission":["OEM360 nació de una idea sencilla: la salud y la seguridad de un trabajador nunca deberían depender del tamaño del negocio donde trabaja.","Los pequeños negocios son la base de nuestras comunidades, pero quienes trabajan en ellos a menudo enfrentan peligros prevenibles sin acceso a los recursos, la orientación o el apoyo que tienen los empleadores grandes.","OEM360 existe para ayudar a cerrar esa brecha: empezando en lo local, escuchando a trabajadores y dueños, y creando juntos soluciones prácticas y duraderas."]},"zh":{"nav":{"what":"我们做什么","research":"研究","help":"一起建设","join":"参与","menu":"菜单","lang":"语言"},"h1a":"大公司有安全部门。","h1b":"小企业没有。","lede":"OEM360 是一个致力于小企业及其员工健康与安全的非营利组织，用员工自己的语言，以低价或免费的方式提供帮助。","promise":"每一位劳动者。每一个工作场所。","hint":"我们会先从一个州开始。选一家店，看看员工面对什么，以及我们能怎样帮忙。","shopnames":{"nails":"美甲店","food":"餐馆","store":"街角商店","auto":"汽车修理店","hair":"美发店","clean":"清洁团队"},"inside":["谁在这里工作","他们面对什么","OEM360 能怎样帮忙"],"shops":{"nails":["美甲店内部","团队小、工时长。许多美甲店员工讲越南语、韩语、中文、尼泊尔语或西班牙语，很多是没有工伤保险的独立承包人。",["指甲油、丙烯酸和卸甲水的气味","打磨产生的粉尘","长时间弯腰导致颈、背和手腕疼痛"],["帮助美甲店联系免费、保密的安全咨询，例如 OSHA 的现场咨询项目，并协助报名","让店主、员工和本地社区团体一起讨论什么能帮上忙","借鉴加州健康美甲店表彰项目；如果效果明显，与本地团体合作，在我们起步的地方逐步开展类似项目","如果有帮助，员工可以保存自己使用过的产品的私人接触记录，并自行决定是否与医生分享"]],"food":["餐馆内部","厨师、服务员和洗碗工在又热又挤的厨房里快速工作。",["烫伤和割伤","湿地板滑倒","高温、搬重物和强效清洁剂"],["帮助餐馆联系免费的安全咨询和已有的餐饮员工培训","用员工的语言，分享来自可靠来源的简短安全资料","有人烫伤或割伤时，帮助找到职业健康诊所","如果有帮助，做一个店主开门前在手机上完成的简单检查清单"]],"store":["街角商店内部","通常是一家人加一两名员工，从早营业到晚。",["搬货和爬梯子","长时间站立","深夜安全风险"],["帮助店主联系免费的安全咨询和小企业资源","帮助店主寻找资助，用于更安全的梯子或更好的照明等基本改善","用店主的语言，分享来自可靠来源的夜间安全指南","有人搬货伤到腰时，帮助找到医疗服务"]],"auto":["汽车修理店内部","技工和车身工人整天接触发动机、油漆和重型零件。",["油漆、溶剂和尾气","噪音","重型零件、割伤和挤压伤"],["帮助汽修店联系 OSHA 的免费现场咨询项目，并协助填写表格","把汽修店与已有的油漆、溶剂和通风相关项目联系起来","用技师的语言把产品安全信息讲清楚","如果有帮助，做一个提示哪些产品需要口罩或手套的工具"]],"hair":["美发店内部","发型师整天站着工作，很多人租用自己的椅位。",["染发剂和漂白剂","可能释放甲醛的拉直护理","肩膀和背部劳损"],["帮助美发店联系免费的安全咨询和已有的美发安全资源","用发型师的语言，分享关于更安全产品和拉直护理的清楚信息","引导租椅位的发型师到工人中心和法律援助了解自己的权利","如果有帮助，做一个提示可能释放甲醛的产品的工具"]],"clean":["清洁团队内部","小团队清洁办公室和住宅，常常在夜间工作。",["混合强效清洁剂","滑倒和跌倒","搬重物和独自工作"],["帮助清洁团队联系工人中心和已有的清洁化学品培训","用员工的语言，分享带图的“绝不混用”化学品指南","让清洁公司和员工一起规划夜间独自工作的安全","如果有帮助，做一个属于每位员工、换工作也能带走的私人接触记录"]]},"plainH":"简单来说","plainP":"每家小企业都不一样。有的需要与已有的帮助连接起来；有的需要把成熟的项目引进到自己的城市；有的需要一个还不存在的简单工具。OEM360 先倾听并研究每个工作场所的需要，然后去做最有帮助的事。","n360":[["每个工作场所","不只是大公司，还有从来得不到帮助的小店。"],["每位劳动者","任何语言、任何工作，无论是员工还是独立承包人。"],["全面照顾","预防优先，同时帮助找到医疗服务并安全返回工作。"]],"cmpH":"共享的安全部门","cmpI":"五十家小店无法各自聘请安全主管。但联合起来，再加上已有的项目，就能共享大公司那样的帮助。","cmpTh":["大公司有","小店通常只有","OEM360 带来什么"],"cmp":[["安全主管","没有人","联系 OSHA 免费、保密、与执法分开的现场咨询项目"],["化学品清单和安全数据表","一架子产品","帮助建立化学品清单并找到安全数据表"],["安全培训","“看我怎么做”","把已有的培训用员工的语言讲清楚"],["职业健康诊所","急诊室，或者什么都没有","帮助找到职业健康服务，包括免费和低价诊所"],["工伤记录","什么都没写下来","帮助了解哪些记录是必须的，并简单地保存"],["返岗计划","辞职，或带伤工作","与员工自己的医生一起规划安全复工"]],"whatH":"我们可能开发的工具","decals":[["个人接触记录","属于员工自己的私人记录：做过的工作、接触过的产品以及注意到的症状。是否以及何时与自己的医生分享，由员工决定。它是为了帮助员工和医生，而不是为了举报或处罚企业。"],["拍下标签","店主拍下每种产品，工具帮助建立化学品清单并找到安全数据表。"],["店铺检查清单","一份简短、带图的安全清单，店主几分钟就能在手机上完成。"]],"resH":"我们从研究开始","resI":"这个空白已有充分记录。所以我们的第一个项目梳理本地已有的帮助以及为什么没人使用，第二个项目检验我们的做法是否有效。","p1":"项目 1","d1":"约 9 个月","q1":"小店现在能获得哪些安全与健康帮助？为什么很多帮助没有被使用？","how":"我们将如何找到答案","s1":["梳理附近免费和低价的安全服务，以及提供的语言。","用店主和员工自己的语言调查，了解是什么阻碍他们使用这些帮助。","在获得同意后，用简单的安全清单走访店铺。","与社区伙伴一起，同店主和员工深入交谈。","发布通俗易懂的本地服务地图和报告。"],"p2":"项目 2","d2":"约 18 个月","q2":"与较晚开始的店铺相比，免费的多语言安全项目能否让小店落实具体的安全改善？","s2":["根据项目一的发现，设计一个把小店与已有帮助连接起来的简单方案，以及确实需要的小工具。","先在几家店试用，修正不好用的地方。","比较立即开始和较晚开始的店铺，让每家店最终都能参加。","用现场观察清单衡量落实了哪些安全改善，并衡量员工知识、使用情况和成本。","用我们合作过的每种语言分享结果，包括没有效果的部分。"],"fork":[["如果缺口真实存在","我们开展项目 2，测试完整的项目。"],["如果已有帮助但没人使用","我们用商店的语言帮它们连接现有资源，而不是重新建设。"],["如果缺口比我们想的小","我们转向真正需要帮助的地方。"]],"cite":"一位职业与环境医学医生，在一条公开评论中","qnote":"","why":"如果连好的雇主都很少记录员工接触了什么，街角商店几乎从不记录。","doorH":"我们门上的承诺","doorI":"店主和员工要先信任我们，才会让我们进门。以下是我们正在努力实现的承诺，正式启动前会请律师审核。","doorNo":["我们不是检查员，也不会向监管机构举报店铺。","我们设计的工具让店主看不到员工的健康细节。","我们计划尽量少保存能识别员工身份的信息，这样几乎没有可以被交出去的资料。","我们不提供法律建议，但会帮人联系法律援助。"],"doorYes":["我们计划配合 OSHA 为小企业提供的免费、保密咨询项目。","员工自己决定分享什么，随时可以退出。"],"fundH":"我们如何筹集资金","fund":[["研究经费","NIOSH 和大学的研究经费，与学术伙伴或财务托管机构合作申请。"],["基金会","关注劳动者健康、移民健康、环境健康和健康公平的资助方。"],["地方政府","已在支持小企业健康项目的市县卫生部门。"],["保险公司和州基金","部分机构可能会为其承保、且员工有保险的企业支持预防工作。"],["社区赞助方","商会、美容院协会、美容学校和供应商。"],["之后的小额费用","项目验证后，为需要更多访问的商店提供按能力收费的会员制。"]],"helpH":"一起建设","helpI":"我们是一个小团队，要走的路还很长。无论您每月只有几个小时，还是一整个学期，这里都有您的位置。","roles":[["社区外展志愿者","与我们的团队一起走访小店，分享资料，让店主和员工感到放心。特别需要会说西班牙语、中文、他加禄语、越南语、海地克里奥尔语及其他语言的人。","每月几个小时"],["笔译和口译","翻译调查问卷、安全指南和应用界面，并请真实的员工测试，确保大家看得懂。","按项目"],["公共卫生和医学预科实习生","协助缺口研究：整理服务资源、开展调查，并撰写通俗报告。","一个学期，每周约 8 到 10 小时"],["软件工程师","当研究表明某个工具会有帮助时，请帮忙开发：简单、保密、多语言。","长期，时间灵活"],["设计师","让一切在旧手机上、用任何语言、在两分钟休息时间里都好用。","按项目"],["医疗和安全专业人员","护士、医生、工业卫生师和安全专业人员，可以提供建议、审核资料，或将来帮助小店联系医疗服务。","每月几个小时"],["研究人员","希望合作开展两项研究和经费申请的教师和研究生。","按项目"],["店主和员工","加入我们的第一批小组，告诉我们您的需要，一起决定我们要建什么。您的声音最重要。","有空就好"]],"commitH":"投入多少时间由您决定","commit":[["偶尔参与","在活动中帮忙、翻译一页内容，或试用一次应用。"],["定期参与","每月几个小时做外展、翻译或顾问。"],["深度投入","一个学期的实习或长期开发角色，有明确的项目和导师。"]],"contactQ":"有问题？请发邮件至","joinH":"参与","joinI":"我们正在寻找商店、员工、志愿者、实习生、工程师、合作伙伴和资助方，与我们一起建设。","btns":{"owner":["我有一家店","加入第一批小组"],"worker":["我在店里工作","告诉我们您的需要"],"volunteer":["我想做志愿者","外展、翻译、设计"],"intern":["实习生或工程师","研究、公共卫生、开发应用"],"partner":["我想合作","劳工中心、诊所、大学"],"funder":["和我们聊聊","基金会、赞助方、机构"]},"fName":"您的姓名","fContact":"电子邮箱或电话","msgs":{"owner":"介绍一下您的店","worker":"什么能在工作中帮到您？可以用任何语言填写。","volunteer":"您想帮忙做什么？会说哪些语言？","intern":"请告诉我们您的学校或技能，以及每周能投入多少小时","partner":"介绍一下您的机构","funder":"请介绍您的机构，以及您希望如何合作"},"send":"发送","eReq":"请填写姓名和电子邮箱或电话，方便我们联系您。","thanks":"谢谢！我们已收到您的信息，会尽快与您联系。","sending":"正在发送…","sendErr":"发送失败。请重试，或发邮件至","np":"筹备中的非营利组织。","contact":"联系","preview":"","replay":"再看一次介绍","view":"视图","desktop":"电脑版","mobile":"手机版","close":"关闭手机预览","ways":[["告诉我们您在工作中的经历","告诉我们工作中哪里困难、不安全或令人困惑。您的回答决定我们建设的一切。"],["让您的店尽早加入","成为首批帮助我们设计试点的店铺之一。"],["贡献您的时间和技能","在社区做志愿者、为员工翻译，或成为我们的实习生。"],["和我们一起开发工具","工程师和设计师：在需要的地方，帮忙为员工和小店开发工具。"],["与我们合作","诊所、学校、工人中心和资助方：我们来谈谈合作。"]],"bridge":"没有单一的产品。每个工作场所需要什么，就做什么。","rolesH":"我们怎样工作","rolesI":"我们先从一个城市里三家不同的小企业开始，每家都有自己的职业健康与安全挑战。通过与店主和员工密切合作，我们会找出他们的需要，把他们与已有资源连接起来，并在仍有空白的地方开发实用的解决办法。从第一个试点学到的经验，将指导 OEM360 如何发展并服务更多社区。","roles8":[["连接","把小店和员工与已有的免费帮助连接起来，例如职业健康诊所、工人中心以及 OSHA 的现场咨询项目。该项目免费、保密，并与执法分开，不会开罚单或罚款。由店主申请，并同意整改发现的严重隐患。"],["引进成熟项目","与本地团体合作，把在其他地方有效的项目引进我们起步的州。例如，加州健康美甲店表彰项目是由各县和州有毒物质控制部负责的免费自愿项目，用来保护美甲店员工、顾客和环境。如果看到它的效果，我们可以逐步开展类似的项目。"],["开发工具","在真正有帮助的地方，开发简单、保密、多语言的软件，例如员工为自己和自己的医生保存的个人接触记录。"],["翻译","把安全资料用西班牙语、中文、韩语、尼泊尔语、他加禄语、越南语、海地克里奥尔语等讲清楚。"],["组织","让店主、员工、诊所、社区团体和学校坐到一起。"],["协助报名","帮助店主报名参加已有的项目和工具，并处理表格手续。"],["倡导","用员工的语言，为小企业员工和他们的需要发声。"],["资金","帮助小店和社区伙伴寻找资助和资源，将来把资金转给本地项目。"]],"toolsI":"软件是我们提供帮助的方式之一，但不是唯一的方式。当研究表明某个工具真能帮助工作场所时，我们就会开发它：简单、保密、多语言、免费使用。","disc":"OEM360 是一个正在筹建的非营利组织。我们不提供医疗或法律建议。紧急情况请拨打 911。","pilot":"先从一个州开始，再逐步扩展。","status":"第一阶段：倾听并建立合作关系。我们目前尚未提供服务。","pilotTag":"试点","laterTag":"以后","aboutH":"关于 OEM360","seekH":"我们正在寻找","seek":["一位学术导师","一个财务托管机构","我们起步所在州的社区合作伙伴"],"whoH":"已经在做这件事的人","whoI":"已有许多团体在做重要的工作。我们与他们没有隶属关系。我们的角色是帮助小店和员工用自己的语言找到并使用这些资源。","who":[["OSHA 现场咨询项目","在每个州为小企业提供免费、保密的安全帮助，与执法分开。不会开罚单或罚款。由店主申请，并同意整改发现的严重隐患。"],["职业健康诊所","诊断并帮助预防与工作有关疾病的诊所，其中一些也为没有保险的人服务。"],["COSH 团体","许多州的地方劳工安全联盟，提供培训和倡导。"],["工人中心和社区团体","支持移民工人的团体，常用他们自己的语言服务。"],["州和地方项目","例如加州部分县的健康美甲店表彰项目，以及关于美甲店通风等方面的州规定。"]],"evH":"我们借鉴的证据","ev":[["费城美甲店","研究人员与越南裔美甲社区共同设计健康项目，说明从一开始就与社区一起建设的价值。"],["图森汽修店和美容店","一个社区健康工作者项目让大多数店铺持续参与，但没有发现化学物质水平显著下降。它为每家店提供最多 300 美元，用于通风和更安全产品等改善。我们认真对待这两方面的经验。"]],"outcome":"我们事先确定的主要衡量指标：现场核查已落实关键安全改善的店铺比例。我们计划在大学伦理审查下开展研究，并预留一小笔资金用于通风和更安全产品等改善。","mt":"此译文由 AI 生成，正在由母语人士审核。","privacy":"您分享的信息只用于回复您与 OEM360 有关的事。我们不会出售，也不会提供给雇主。请不要填写健康信息或您工作场所的名称。","founderS":"源于一个信念：每位员工都应拥有更安全的工作场所。","mission":["OEM360 源于一个简单的信念：员工的健康与安全，不应取决于他所工作的企业规模。","小企业是社区的支柱，但在其中工作的人常常面对本可预防的危险，却得不到大企业所拥有的资源、指导或支持。","OEM360 的存在就是为了帮助缩小这个差距：从本地做起，倾听员工和店主，一起建立实用而持久的解决办法。"]},"tl":{"nav":{"what":"Ang ginagawa namin","research":"Pananaliksik","help":"Tumulong sa pagbuo","join":"Sumali","menu":"Menu","lang":"Wika"},"h1a":"May safety department ang malalaking kumpanya.","h1b":"Ang maliliit na negosyo, wala.","lede":"Ang OEM360 ay isang nonprofit na nakatuon sa kalusugan at kaligtasan ng maliliit na negosyo at ng mga taong nagtatrabaho sa kanila, sa sarili nilang wika, nang mura o libre.","promise":"Bawat manggagawa. Bawat lugar ng trabaho.","hint":"Magsisimula kami sa isang estado. Pumili ng tindahan para makita ang hinaharap ng mga manggagawa nito, at kung paano kami makakatulong.","shopnames":{"nails":"Nail salon","food":"Restawran","store":"Tindahan sa kanto","auto":"Talyer","hair":"Parlor","clean":"Grupo ng tagalinis"},"inside":["Sino ang nagtatrabaho rito","Ano ang hinaharap nila","Paano makakatulong ang OEM360"],"shops":{"nails":["Sa loob ng nail salon","Maliliit na team at mahahabang oras. Maraming manggagawa sa nail salon ang nagsasalita ng Vietnamese, Korean, Chinese, Nepali o Spanish, at marami ang independent contractor na walang workers’ comp.",["Usok mula sa polish, acrylic at remover","Alikabok mula sa pagkikikil","Sakit sa leeg, likod at pulso dahil sa pagyuko sa kliyente"],["Ikonekta ang mga salon sa libre at kumpidensyal na safety consultation, tulad ng On-Site Consultation Program ng OSHA, at tumulong sa pag-sign up","Pagsamahin ang mga may-ari, manggagawa at lokal na grupo sa komunidad para pag-usapan kung ano ang makakatulong","Matuto mula sa Healthy Nail Salon Recognition Program ng California at, kung malinaw ang benepisyo, makipagtulungan sa mga lokal na grupo para unti-unting magsimula ng katulad nito kung saan kami magsisimula","Kung makakatulong, pribadong exposure record ng mga produktong ginagamit ng manggagawa, na puwede niyang ibahagi sa sariling doktor kung gusto niya"]],"food":["Sa loob ng restawran","Mga kusinero, serbidor at tagahugas na mabilis kumilos sa mainit at masikip na kusina.",["Paso at hiwa","Pagkadulas sa basang sahig","Init, pagbubuhat at matatapang na panlinis"],["Ikonekta ang mga restawran sa libreng safety consultation at mga training para sa food workers na mayroon na","Magbahagi ng maiikling materyales sa kaligtasan mula sa mapagkakatiwalaang source, sa wika ng mga manggagawa","Tulong sa paghahanap ng occupational health clinic kapag may napaso o nahiwa","Kung makakatulong, simpleng checklist sa phone na tatapusin ng may-ari bago magbukas"]],"store":["Sa loob ng tindahan sa kanto","Kadalasang isang pamilya at isa o dalawang empleyado, bukas mula umaga hanggang gabi.",["Pagbubuhat ng paninda at pag-akyat sa hagdan","Mahahabang oras na nakatayo","Panganib sa kaligtasan sa gabi"],["Ikonekta ang mga may-ari sa libreng safety consultation at resources para sa maliliit na negosyo","Tulungan ang mga may-ari na maghanap ng grant para sa simpleng ayos, tulad ng mas ligtas na hagdan o mas maliwanag na ilaw","Magbahagi ng gabay sa kaligtasan sa gabi mula sa mapagkakatiwalaang source, sa wika ng may-ari","Tulong sa paghahanap ng gamutan kapag may nasaktan ang likod sa pagbubuhat"]],"auto":["Sa loob ng talyer","Mga mekaniko at body worker na laging malapit sa makina, pintura at mabibigat na piyesa.",["Pintura, solvent at usok ng tambutso","Ingay","Mabibigat na piyesa, hiwa at pagkaipit"],["Ikonekta ang mga shop sa libreng On-Site Consultation Program ng OSHA, at tumulong sa papeles","Iugnay ang mga shop sa mga programang mayroon na tungkol sa pintura, solvent at bentilasyon","Gawing malinaw ang impormasyon sa kaligtasan ng produkto sa wika ng mga mekaniko","Kung makakatulong, tool na magsasabi kung aling produkto ang kailangan ng mask o guwantes"]],"hair":["Sa loob ng parlor","Mga stylist na nakatayo buong araw, marami ang umuupa ng sariling upuan.",["Pangkulay at pampaputi ng buhok","Smoothing treatment na maaaring maglabas ng formaldehyde","Pananakit ng balikat at likod"],["Ikonekta ang mga salon sa libreng safety consultation at mga salon-safety resources na mayroon na","Magbahagi ng malinaw na impormasyon tungkol sa mas ligtas na produkto at smoothing treatment, sa wika ng mga stylist","Ituro ang mga chair renter sa tulong tungkol sa kanilang karapatan mula sa worker center at legal aid","Kung makakatulong, tool na magsasabi kung aling produkto ang maaaring maglabas ng formaldehyde"]],"clean":["Sa loob ng grupo ng tagalinis","Maliliit na grupo na naglilinis ng opisina at bahay, madalas sa gabi.",["Paghahalo ng matatapang na panlinis","Pagkadulas at pagkahulog","Pagbubuhat at pagtatrabaho nang mag-isa"],["Ikonekta ang mga crew sa worker center at mga training sa kemikal na panlinis na mayroon na","Magbahagi ng gabay na may larawan kung aling kemikal ang hindi dapat paghaluin, sa wika ng mga manggagawa","Pagsamahin ang mga cleaning business at manggagawa para magplano sa pag-iisang pagtatrabaho sa gabi","Kung makakatulong, pribadong exposure record na pag-aari ng bawat manggagawa at madadala sa ibang trabaho"]]},"plainH":"Sa madaling salita","plainP":"Magkakaiba ang bawat maliit na negosyo. May ilang kailangang maikonekta sa tulong na mayroon na. May ilang kailangang madala sa kanilang lungsod ang isang napatunayang programa. May ilang kailangan ng simpleng tool na wala pa. Nagsisimula ang OEM360 sa pakikinig at pag-aaral kung ano ang kailangan ng bawat lugar ng trabaho, saka ginagawa ang pinakamakakatulong.","n360":[["Bawat lugar ng trabaho","Hindi lang malalaking kumpanya. Pati maliliit na tindahang hindi kailanman natutulungan."],["Bawat manggagawa","Anumang wika, anumang trabaho, empleyado man o independent contractor."],["Ang buong larawan","Pag-iwas muna, at tulong sa paghahanap ng gamutan at ligtas na pagbalik sa trabaho."]],"cmpH":"Isang safety department na pinagsasaluhan","cmpI":"Hindi kayang kumuha ng limampung maliliit na tindahan ng kani-kaniyang safety officer. Kung magkakasama, at kasama ang mga programang mayroon na, puwede silang magkaroon ng tulong na tulad ng sa malalaking kumpanya.","cmpTh":["Mayroon ang malalaking kumpanya","Karaniwang mayroon ang maliliit na tindahan","Ang hatid ng OEM360"],"cmp":[["Safety officer","Wala","Koneksyon sa libre, kumpidensyal at hiwalay sa enforcement na On-Site Consultation Program ng OSHA"],["Listahan ng kemikal at Safety Data Sheets","Isang istante ng produkto","Tulong sa pagbuo ng listahan ng kemikal at paghahanap ng Safety Data Sheets"],["Safety training","“Panoorin mo ako”","Mga training na mayroon na, ipinaliwanag sa wika ng mga manggagawa"],["Occupational health clinic","Ang ER, o wala","Tulong sa paghahanap ng occupational health care, kasama ang libre at murang klinika"],["Talaan ng pinsala","Walang nakasulat","Tulong sa pag-unawa kung aling record ang kailangan, at simpleng pagtatago nito"],["Plano sa pagbalik sa trabaho","Umalis, o magtrabahong may sakit","Tulong sa pagpaplano ng ligtas na pagbalik sa trabaho kasama ang sariling doktor ng manggagawa"]],"whatH":"Mga tool na maaari naming buuin","decals":[["Personal na exposure record","Pribadong record na pag-aari ng manggagawa: ang mga naging trabaho niya, ang mga produktong ginamit niya at anumang sintomas na napapansin niya. Siya ang magpapasya kung at kailan ito ibabahagi sa sarili niyang doktor. Ginawa ito para tulungan ang mga manggagawa at kanilang doktor, hindi para isumbong o parusahan ang mga negosyo."],["Kunan ang label","Kinukunan ng may-ari ang bawat produkto, at tumutulong ang tool na buuin ang listahan ng kemikal at hanapin ang Safety Data Sheets."],["Checklist ng tindahan","Maikli at may larawang safety checklist na matatapos ng may-ari sa phone sa ilang minuto."]],"resH":"Nagsisimula kami sa pananaliksik","resI":"Maayos nang naidokumento ang puwang. Kaya ang unang proyekto namin ay magmamapa ng tulong na mayroon na sa lugar at kung bakit hindi ito nagagamit, at susubukan ng pangalawa kung nakakatulong ang aming paraan.","p1":"Proyekto 1","d1":"Mga 9 na buwan","q1":"Anong tulong sa kaligtasan at kalusugan ang naaabot ngayon ng maliliit na tindahan, at bakit hindi nagagamit ang malaking bahagi nito?","how":"Paano namin ito aalamin","s1":["Imapa ang libre at murang safety services sa malapit, at ang mga wikang ginagamit nila.","I-survey ang mga may-ari at manggagawa, sa sarili nilang wika, kung ano ang pumipigil sa kanila na gamitin ang tulong na iyon.","Kung may pahintulot, maglakad sa mga tindahan gamit ang simpleng safety checklist.","Makipag-usap nang malalim sa mga may-ari at manggagawa, kasama ang mga katuwang sa komunidad.","Maglathala ng simpleng mapa ng lokal na serbisyo at ulat."],"p2":"Proyekto 2","d2":"Mga 18 buwan","q2":"Napapagawa ba ng libre at multilingual na safety program sa maliliit na tindahan ang mga partikular na safety fix, kumpara sa mga tindahang mas huling nagsimula?","s2":["Magdisenyo ng simpleng plano para ikonekta ang mga tindahan sa tulong na mayroon na, kasama ang maliliit na tool na ipinapakitang kailangan ng Proyekto 1.","Subukan ito sa ilang tindahan at ayusin ang hindi gumagana.","Ikumpara ang mga tindahang agad nagsimula sa mga mas huling nagsimula, para lahat ay makakuha pa rin ng programa.","Sukatin kung aling safety fix ang nakalagay gamit ang inobserbahang checklist, pati kaalaman ng manggagawa, paggamit at gastos.","Ibahagi ang resulta sa bawat wikang ginamit namin, kasama ang hindi gumana."],"fork":[["Kung totoo ang kakulangan","Gagawin namin ang Proyekto 2 at susubukan ang buong programa."],["Kung may tulong pero hindi nagagamit","Ikokonekta namin ang mga tindahan dito, sa kanilang wika, sa halip na bumuo muli."],["Kung mas maliit ang kakulangan kaysa inaakala","Pupunta kami kung saan talaga may pangangailangan."]],"cite":"Isang doktor sa occupational at environmental medicine, sa isang pampublikong komento","qnote":"","why":"Kung bihira lang subaybayan ng mabubuting employer ang exposure ng kanilang mga manggagawa, halos hindi ito ginagawa ng tindahan sa kanto.","doorH":"Ang karatula sa aming pinto","doorI":"Kailangang magtiwala sa amin ang mga may-ari at manggagawa bago nila kami papasukin. Ito ang mga pangakong pinagsisikapan namin, at ipasusuri namin ito sa mga abogado bago kami maglunsad.","doorNo":["Hindi kami inspektor, at hindi namin isinusumbong ang mga tindahan sa regulators.","Dinidisenyo namin ang aming tools para hindi makita ng may-ari ang detalye ng kalusugan ng manggagawa.","Plano naming magtago ng kaunting impormasyong makakapagpakilala sa manggagawa hangga’t maaari, para kaunti lang ang puwedeng maibigay kailanman.","Hindi kami nagbibigay ng legal na payo. Ikinokonekta namin ang mga tao sa legal aid."],"doorYes":["Plano naming makipagtulungan sa libre at kumpidensyal na consultation program ng OSHA para sa maliliit na negosyo.","Ang manggagawa ang pipili kung ano ang ibabahagi, at puwede silang huminto anumang oras."],"fundH":"Paano namin ito popondohan","fund":[["Research grants","Mga research grant ng NIOSH at unibersidad, kasama ang academic partner o fiscal sponsor."],["Mga foundation","Mga nagpopondo na nakatuon sa kalusugan ng manggagawa, imigrante at kapaligiran, at sa pagkakapantay-pantay sa kalusugan."],["Lokal na pamahalaan","Mga health department ng lungsod at county na sumusuporta na sa mga programa para sa maliliit na negosyo."],["Mga insurer at state fund","Maaaring suportahan ng ilan ang pag-iwas sa mga negosyong sakop nila, kung saan may coverage ang mga manggagawa."],["Mga sponsor sa komunidad","Mga chamber of commerce, samahan ng mga salon, beauty school at supplier."],["Maliit na bayad, sa susunod","Membership na ayon sa kakayahan para sa mga tindahang gusto ng mas maraming bisita, kapag napatunayan na ang programa."]],"helpH":"Tumulong sa pagbuo","helpI":"Maliit kaming team at malawak ang aming lalakarin. Ilang oras man bawat buwan o isang buong semestre, may lugar para sa iyo.","roles":[["Mga boluntaryo sa komunidad","Bumisita sa mga tindahan kasama ang aming team, magbahagi ng materyales at tulungang maging komportable ang mga may-ari at manggagawa. Lalo naming kailangan ang mga nagsasalita ng Spanish, Chinese, Tagalog, Vietnamese, Haitian Creole at iba pang wika.","Ilang oras bawat buwan"],["Mga tagasalin at interpreter","Isalin ang mga survey, safety guide at screen ng app, at subukan ito sa totoong manggagawa para malinaw ang mga salita.","Ayon sa proyekto"],["Mga intern sa public health at pre-health","Tumulong sa pag-aaral ng kakulangan: ilista ang mga serbisyo, mag-survey at isulat ang simpleng ulat.","Isang semestre, mga 8 hanggang 10 oras bawat linggo"],["Mga software engineer","Kapag ipinakita ng aming pananaliksik na makakatulong ang isang tool, tumulong itong buuin: simple, pribado at multilingual.","Tuloy-tuloy, flexible na oras"],["Mga designer","Gawing madaling gamitin ang lahat sa lumang telepono, sa anumang wika, sa loob ng dalawang minutong pahinga.","Ayon sa proyekto"],["Mga propesyonal sa kalusugan at kaligtasan","Mga nurse, doktor, industrial hygienist at safety pro na makakapagpayo, makakasuri ng materyales, o sa hinaharap ay makakatulong ikonekta ang mga tindahan sa gamutan.","Ilang oras bawat buwan"],["Mga mananaliksik","Mga guro at graduate student na gustong makipagtulungan sa dalawang pag-aaral at sa mga grant application.","Ayon sa proyekto"],["Mga may-ari ng tindahan at manggagawa","Sumali sa aming unang grupo, sabihin ang kailangan mo, at tumulong hubugin ang aming binubuo. Ang boses mo ang una.","Kahit kailan ka puwede"]],"commitH":"Ikaw ang bahala kung gaano karaming oras","commit":[["Paminsan-minsan","Tumulong sa isang event, magsalin ng isang pahina, o subukan ang app nang isang beses."],["Regular","Ilang oras bawat buwan sa outreach, pagsasalin o pagpapayo."],["Nakatuon","Isang semestreng internship o tuloy-tuloy na papel sa pagbuo, na may malinaw na proyekto at mentor."]],"contactQ":"May tanong? Mag-email sa amin sa","joinH":"Sumali","joinI":"Naghahanap kami ng mga tindahan, manggagawa, boluntaryo, intern, engineer, katuwang at nagpopondo para buuin ito kasama namin.","btns":{"owner":["May tindahan ako","Sumali sa unang grupo"],"worker":["Nagtatrabaho ako sa tindahan","Sabihin ang kailangan mo"],"volunteer":["Gusto kong mag-boluntaryo","Outreach, pagsasalin, disenyo"],"intern":["Intern o engineer","Pananaliksik, public health, ang app"],"partner":["Gusto kong makipagtulungan","Worker center, klinika, unibersidad"],"funder":["Kausapin kami","Mga foundation, sponsor, ahensya"]},"fName":"Pangalan mo","fContact":"Email o telepono","msgs":{"owner":"Ikuwento ang tungkol sa iyong tindahan","worker":"Ano ang makakatulong sa iyo sa trabaho? Puwede kang sumulat sa anumang wika.","volunteer":"Saan mo gustong tumulong, at anong mga wika ang alam mo?","intern":"Sabihin ang iyong paaralan o kakayahan, at ilang oras bawat linggo ang kaya mo","partner":"Ikuwento ang tungkol sa iyong organisasyon","funder":"Ikuwento ang inyong organisasyon at kung paano ninyo gustong makipagtulungan"},"send":"Ipadala","eReq":"Ilagay ang pangalan mo at email o telepono para makontak ka namin.","thanks":"Salamat! Natanggap namin ang mensahe mo at makikipag-ugnayan kami agad.","sending":"Ipinapadala…","sendErr":"Hindi ito naipadala. Subukan ulit o mag-email sa","np":"Nonprofit na binubuo pa lang.","contact":"Kontak","preview":"","replay":"Panoorin muli ang intro","view":"View","desktop":"Desktop","mobile":"Mobile","close":"Isara ang mobile view","ways":[["Ibahagi ang hinaharap mo sa trabaho","Sabihin sa amin kung ano ang mahirap, delikado o nakakalito sa trabaho. Ang sagot mo ang gagabay sa lahat ng aming bubuuin."],["Isali nang maaga ang negosyo mo","Maging isa sa mga unang tindahang tutulong humubog sa aming pilot."],["Ibahagi ang iyong oras at galing","Mag-boluntaryo sa komunidad, magsalin para sa mga manggagawa, o sumali bilang intern."],["Bumuo ng tools kasama namin","Mga engineer at designer: tumulong bumuo ng tools para sa mga manggagawa at tindahan, kung saan kailangan."],["Makipag-partner sa amin","Mga klinika, paaralan, worker center at funder: pag-usapan natin ang pagtutulungan."]],"bridge":"Walang iisang produkto. Kung ano ang kailangan ng bawat lugar ng trabaho.","rolesH":"Paano kami nagtatrabaho","rolesI":"Nagsisimula kami sa tatlong magkakaibang maliit na negosyo sa isang lungsod, bawat isa may sariling hamon sa kalusugan at kaligtasan sa trabaho. Sa malapit na pakikipagtulungan sa mga may-ari at manggagawa, aalamin namin ang kailangan nila, ikokonekta sila sa mga resource na mayroon na, at bubuo ng praktikal na solusyon kung saan may natitirang puwang. Ang matututunan namin sa unang pilot na ito ang gagabay sa paglago ng OEM360 at sa paglilingkod nito sa mas maraming komunidad.","roles8":[["Pag-uugnay","Ikinokonekta ang mga tindahan at manggagawa sa libreng tulong na mayroon na, tulad ng mga occupational health clinic, worker center at On-Site Consultation Program ng OSHA. Libre, kumpidensyal at hiwalay sa enforcement ang programang iyon, walang citation o multa. Ang may-ari ang hihiling nito at papayag na ayusin ang anumang seryosong panganib na makita."],["Pag-angkop ng napatunayang programa","Dinadala sa estadong pagsisimulan namin ang mga programang gumagana sa ibang lugar, kasama ang mga lokal na grupo. Halimbawa, ang Healthy Nail Salon Recognition Program ng California ay libre at boluntaryong programang pinapatakbo ng mga county at ng Department of Toxic Substances Control ng estado para protektahan ang mga manggagawa ng salon, mga customer at ang kapaligiran. Kung makita namin kung paano ito nakakatulong, maaari kaming unti-unting magsimula ng katulad nito."],["Pagbuo ng tools","Gumagawa ng simple, pribado at multilingual na software kung saan talagang makakatulong, tulad ng personal na exposure record na itinatago ng mga manggagawa para sa sarili nila at sa sarili nilang doktor."],["Pagsasalin","Ginagawang malinaw ang mga materyales sa kaligtasan sa Spanish, Chinese, Korean, Nepali, Tagalog, Vietnamese, Haitian Creole at iba pa."],["Pag-oorganisa","Pinagsasama sa iisang mesa ang mga may-ari, manggagawa, klinika, grupo sa komunidad at paaralan."],["Pag-enroll","Tinutulungan ang mga may-ari na mag-sign up sa mga programa at tool na mayroon na, at inaasikaso ang papeles."],["Pagtataguyod","Nagsasalita para sa mga manggagawa ng maliliit na negosyo at sa kanilang pangangailangan, sa kanilang wika."],["Pondo","Tinutulungan ang mga tindahan at katuwang sa komunidad na makahanap ng grant at resources, at sa paglaon ay ipinapasa ang pondo sa mga lokal na programa."]],"toolsI":"Ang software ay isa sa mga paraan kung paano kami makakatulong, pero hindi lang ito. Kapag ipinakita ng aming pananaliksik na talagang makakatulong ang isang tool sa isang lugar ng trabaho, binubuo namin ito: simple, pribado, multilingual at libreng gamitin.","disc":"Ang OEM360 ay isang nonprofit na binubuo pa lang. Hindi kami nagbibigay ng medikal o legal na payo. Sa emergency, tumawag sa 911.","pilot":"Magsisimula sa isang estado, saka lalago mula roon.","status":"Phase 1: nakikinig at bumubuo ng mga partnership. Hindi pa kami nag-aalok ng serbisyo.","pilotTag":"Pilot","laterTag":"Mamaya","aboutH":"Tungkol sa OEM360","seekH":"Hinahanap namin","seek":["Isang faculty mentor","Isang fiscal sponsor","Mga katuwang sa komunidad sa estadong pagsisimulan namin"],"whoH":"Sino na ang gumagawa nito","whoI":"Maraming grupo ang gumagawa na ng mahalagang trabaho. Hindi kami kaanib nila. Ang papel namin ay tulungan ang maliliit na tindahan at kanilang mga manggagawa na mahanap at magamit ang inaalok nila, sa sarili nilang wika.","who":[["On-Site Consultation Program ng OSHA","Libre at kumpidensyal na tulong sa kaligtasan para sa maliliit na negosyo sa bawat estado, hiwalay sa enforcement. Walang citation o multa. Ang may-ari ang hihiling at papayag na ayusin ang anumang seryosong panganib na makita."],["Mga occupational health clinic","Mga klinikang nagdi-diagnose at tumutulong maiwasan ang sakit na dulot ng trabaho, kasama ang ilang tumutulong sa mga walang insurance."],["Mga COSH group","Mga lokal na koalisyon sa kaligtasan ng manggagawa sa maraming estado na nag-aalok ng training at adbokasiya."],["Mga worker center at grupo sa komunidad","Mga grupong sumusuporta sa mga imigranteng manggagawa, madalas sa sarili nilang wika."],["Mga programa ng estado at lokal","Mga programa tulad ng healthy nail salon recognition sa ilang county sa California, at mga patakaran ng estado sa mga bagay tulad ng bentilasyon ng salon."]],"evH":"Ebidensyang pinagbabatayan namin","ev":[["Mga nail salon sa Philadelphia","Sama-samang dinisenyo ng mga mananaliksik at ng komunidad ng Vietnamese nail salon ang isang health program, na nagpapakita ng halaga ng pagbuo kasama ang komunidad mula sa simula."],["Mga auto at beauty shop sa Tucson","Napanatili ng isang community health worker program na kasali ang karamihan ng tindahan, pero walang nakitang malaking pagbaba sa antas ng kemikal. Nag-alok ito ng hanggang $300 bawat tindahan para sa mga ayos tulad ng bentilasyon at mas ligtas na produkto. Seryoso naming tinatanggap ang dalawang aral."]],"outcome":"Ang pangunahing sukatan namin, itinakda nang maaga: ang bahagdan ng mga tindahang may mahahalagang safety fix na nakalagay, sinuri nang personal. Plano naming isagawa ang aming pag-aaral sa ilalim ng ethics review ng unibersidad, at maglaan ng maliit na pondo para sa mga ayos tulad ng bentilasyon at mas ligtas na produkto.","mt":"Ginawa ang salin na ito gamit ang AI at sinusuri ng mga katutubong nagsasalita.","privacy":"Ginagamit lang namin ang ibinahagi mo para sagutin ka tungkol sa OEM360. Hindi namin ito ibinebenta o ibinabahagi sa mga employer. Huwag isama ang detalye ng kalusugan o ang pangalan ng iyong pinagtatrabahuhan.","founderS":"Itinatag sa paniniwalang bawat manggagawa ay karapat-dapat sa mas ligtas na lugar ng trabaho.","mission":["Itinatag ang OEM360 sa isang simpleng paniniwala: hindi dapat nakadepende ang kalusugan at kaligtasan ng isang manggagawa sa laki ng negosyong pinagtatrabahuhan niya.","Ang maliliit na negosyo ang gulugod ng ating mga komunidad, pero madalas na humaharap ang mga nagtatrabaho rito sa mga panganib na maiiwasan sana, nang walang access sa resources, gabay o suportang mayroon ang malalaking employer.","Narito ang OEM360 para tumulong na isara ang puwang na iyon: nagsisimula sa lokal, nakikinig sa mga manggagawa at may-ari, at sama-samang bumubuo ng praktikal at pangmatagalang solusyon."]},"vi":{"nav":{"what":"Chúng tôi làm gì","research":"Nghiên cứu","help":"Cùng xây dựng","join":"Tham gia","menu":"Menu","lang":"Ngôn ngữ"},"h1a":"Các công ty lớn có bộ phận an toàn.","h1b":"Doanh nghiệp nhỏ thì không.","lede":"OEM360 là một tổ chức phi lợi nhuận chuyên lo cho sức khỏe và an toàn của các doanh nghiệp nhỏ và những người làm việc tại đó, bằng ngôn ngữ của họ, với chi phí thấp hoặc miễn phí.","promise":"Mọi người lao động. Mọi nơi làm việc.","hint":"Chúng tôi sẽ bắt đầu ở một tiểu bang. Chọn một cửa hàng để xem người lao động ở đó gặp những gì, và chúng tôi có thể giúp thế nào.","shopnames":{"nails":"Tiệm nail","food":"Nhà hàng","store":"Tiệm tạp hóa","auto":"Tiệm sửa xe","hair":"Tiệm tóc","clean":"Đội vệ sinh"},"inside":["Ai làm việc ở đây","Họ phải đối mặt với gì","OEM360 có thể giúp như thế nào"],"shops":{"nails":["Bên trong tiệm nail","Nhóm nhỏ, giờ làm dài. Nhiều thợ nail nói tiếng Việt, tiếng Hàn, tiếng Trung, tiếng Nepal hoặc tiếng Tây Ban Nha, và nhiều người là nhà thầu độc lập không có bảo hiểm tai nạn lao động.",["Hơi từ sơn móng, bột acrylic và nước tẩy","Bụi khi dũa móng","Đau cổ, lưng và cổ tay vì cúi người làm cho khách"],["Kết nối tiệm nail với dịch vụ tư vấn an toàn miễn phí, bảo mật, như Chương trình Tư vấn Tại chỗ của OSHA, và giúp
