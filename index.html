 đăng ký","Mời chủ tiệm, người lao động và các nhóm cộng đồng địa phương cùng bàn xem điều gì sẽ giúp ích","Học hỏi từ Chương trình Công nhận Tiệm Nail Lành mạnh của California và, nếu thấy lợi ích rõ ràng, cùng các nhóm địa phương từng bước khởi động chương trình tương tự ở nơi chúng tôi bắt đầu","Nếu có ích, một hồ sơ phơi nhiễm riêng mà người lao động ghi lại các sản phẩm họ dùng, để chia sẻ với bác sĩ riêng nếu muốn"]],"food":["Bên trong nhà hàng","Đầu bếp, phục vụ và người rửa chén làm việc nhanh trong bếp nóng và chật.",["Bỏng và đứt tay","Trơn trượt trên sàn ướt","Nóng, mang vác nặng và hóa chất tẩy rửa mạnh"],["Kết nối nhà hàng với dịch vụ tư vấn an toàn miễn phí và các khóa huấn luyện đã có cho người làm ngành ăn uống","Chia sẻ tài liệu an toàn ngắn từ nguồn đáng tin cậy, bằng ngôn ngữ của người lao động","Giúp tìm phòng khám sức khỏe nghề nghiệp khi có người bị bỏng hay đứt tay","Nếu có ích, một bảng kiểm đơn giản trên điện thoại để chủ tiệm hoàn tất trước giờ mở cửa"]],"store":["Bên trong tiệm tạp hóa","Thường là một gia đình với một hai nhân viên, mở cửa từ sáng sớm đến tối muộn.",["Bê hàng và leo thang","Đứng nhiều giờ","Rủi ro an toàn ban đêm"],["Kết nối chủ tiệm với dịch vụ tư vấn an toàn miễn phí và nguồn lực cho doanh nghiệp nhỏ","Giúp chủ tiệm tìm khoản tài trợ cho các cải thiện cơ bản, như thang an toàn hơn hay đèn sáng hơn","Chia sẻ hướng dẫn an toàn ban đêm từ nguồn đáng tin cậy, bằng ngôn ngữ của chủ tiệm","Giúp tìm nơi chăm sóc khi có người đau lưng do bê hàng"]],"auto":["Bên trong tiệm sửa xe","Thợ máy và thợ đồng làm việc quanh động cơ, sơn và phụ tùng nặng.",["Sơn, dung môi và khí thải","Tiếng ồn","Phụ tùng nặng, đứt tay và bị kẹp"],["Kết nối tiệm sửa xe với Chương trình Tư vấn Tại chỗ miễn phí của OSHA, và giúp làm giấy tờ","Kết nối tiệm với các chương trình đã có về sơn, dung môi và thông gió","Làm rõ thông tin an toàn sản phẩm bằng ngôn ngữ của thợ máy","Nếu có ích, công cụ cho biết sản phẩm nào cần khẩu trang hay găng tay"]],"hair":["Bên trong tiệm tóc","Thợ tóc đứng cả ngày, nhiều người thuê ghế riêng.",["Thuốc nhuộm và thuốc tẩy tóc","Dịch vụ duỗi tóc có thể thải ra formaldehyde","Đau vai và lưng"],["Kết nối tiệm tóc với dịch vụ tư vấn an toàn miễn phí và các tài liệu an toàn cho tiệm tóc đã có","Chia sẻ thông tin rõ ràng về sản phẩm an toàn hơn và dịch vụ duỗi tóc, bằng ngôn ngữ của thợ","Hướng dẫn người thuê ghế tìm hỗ trợ về quyền lợi tại trung tâm người lao động và trợ giúp pháp lý","Nếu có ích, công cụ cho biết sản phẩm nào có thể thải ra formaldehyde"]],"clean":["Bên trong đội vệ sinh","Đội nhỏ dọn dẹp văn phòng và nhà ở, thường vào ban đêm.",["Pha trộn hóa chất tẩy rửa mạnh","Trơn trượt và té ngã","Mang vác nặng và làm việc một mình"],["Kết nối đội vệ sinh với trung tâm người lao động và các khóa huấn luyện về hóa chất tẩy rửa đã có","Chia sẻ hướng dẫn có hình về các hóa chất không bao giờ được trộn, bằng ngôn ngữ của người lao động","Mời các công ty vệ sinh và người lao động cùng lên kế hoạch cho việc làm một mình ban đêm","Nếu có ích, một hồ sơ phơi nhiễm riêng thuộc về mỗi người lao động và mang theo từ việc này sang việc khác"]]},"plainH":"Nói đơn giản","plainP":"Mỗi doanh nghiệp nhỏ đều khác nhau. Có nơi cần được kết nối với các hỗ trợ đã có. Có nơi cần một chương trình đã được chứng minh hiệu quả đến với thành phố của mình. Có nơi cần một công cụ đơn giản chưa từng có. OEM360 bắt đầu bằng việc lắng nghe và tìm hiểu nhu cầu của từng nơi làm việc, rồi làm điều có ích nhất.","n360":[["Mọi nơi làm việc","Không chỉ công ty lớn. Cả những cửa hàng nhỏ chưa bao giờ được giúp đỡ."],["Mọi người lao động","Bất kỳ ngôn ngữ, bất kỳ công việc, nhân viên hay thầu độc lập."],["Bức tranh toàn diện","Phòng ngừa trước tiên, cùng với giúp tìm nơi chăm sóc và trở lại làm việc an toàn."]],"cmpH":"Một bộ phận an toàn dùng chung","cmpI":"Năm mươi cửa hàng nhỏ không thể mỗi nơi thuê một nhân viên an toàn. Nhưng cùng nhau, và cùng các chương trình đã có, họ có thể có được sự hỗ trợ như các công ty lớn.","cmpTh":["Công ty lớn có","Cửa hàng nhỏ thường có","Những gì OEM360 mang lại"],"cmp":[["Nhân viên an toàn","Không ai cả","Kết nối với Chương trình Tư vấn Tại chỗ của OSHA, miễn phí, bảo mật và tách biệt với thanh tra"],["Danh sách hóa chất và phiếu an toàn","Một kệ sản phẩm","Giúp lập danh sách hóa chất và tìm Bảng Dữ liệu An toàn"],["Huấn luyện an toàn","“Nhìn tôi làm nè”","Các khóa huấn luyện đã có, được giải thích rõ bằng ngôn ngữ của người lao động"],["Phòng khám sức khỏe nghề nghiệp","Phòng cấp cứu, hoặc không có gì","Giúp tìm dịch vụ sức khỏe nghề nghiệp, kể cả phòng khám miễn phí và giá thấp"],["Hồ sơ chấn thương","Không ghi chép gì","Giúp hiểu hồ sơ nào là bắt buộc, và lưu giữ một cách đơn giản"],["Kế hoạch quay lại làm việc","Nghỉ việc, hoặc làm khi đang đau","Giúp lên kế hoạch trở lại làm việc an toàn cùng bác sĩ riêng của người lao động"]],"whatH":"Công cụ chúng tôi có thể làm","decals":[["Hồ sơ phơi nhiễm cá nhân","Hồ sơ riêng thuộc về người lao động: các công việc đã làm, các sản phẩm đã tiếp xúc và những triệu chứng họ nhận thấy. Họ tự quyết định có chia sẻ với bác sĩ riêng hay không và khi nào. Hồ sơ này nhằm giúp người lao động và bác sĩ của họ, không phải để báo cáo hay xử phạt doanh nghiệp."],["Chụp nhãn","Chủ tiệm chụp từng sản phẩm, và công cụ giúp lập danh sách hóa chất và tìm Bảng Dữ liệu An toàn."],["Bảng kiểm của cửa hàng","Một bảng kiểm an toàn ngắn, có hình, chủ tiệm có thể hoàn tất trên điện thoại trong vài phút."]],"resH":"Chúng tôi bắt đầu bằng nghiên cứu","resI":"Khoảng trống này đã được ghi nhận rõ. Vì vậy dự án đầu tiên của chúng tôi lập bản đồ các nguồn hỗ trợ sẵn có tại địa phương và lý do chúng ít được dùng, còn dự án thứ hai kiểm tra xem cách làm của chúng tôi có hiệu quả không.","p1":"Dự án 1","d1":"Khoảng 9 tháng","q1":"Hiện nay các cửa hàng nhỏ có thể tiếp cận những hỗ trợ an toàn và sức khỏe nào, và vì sao phần lớn trong số đó không được sử dụng?","how":"Cách chúng tôi tìm hiểu","s1":["Lập bản đồ các dịch vụ an toàn miễn phí và giá thấp gần đó, và các ngôn ngữ được cung cấp.","Khảo sát chủ tiệm và người lao động, bằng ngôn ngữ của họ, về điều gì khiến họ không dùng các hỗ trợ đó.","Khi được cho phép, đi xem cửa hàng với một bảng kiểm an toàn đơn giản.","Trò chuyện sâu với chủ tiệm và người lao động, cùng các đối tác cộng đồng.","Công bố bản đồ dịch vụ địa phương và báo cáo bằng ngôn ngữ dễ hiểu."],"p2":"Dự án 2","d2":"Khoảng 18 tháng","q2":"So với các cửa hàng bắt đầu muộn hơn, một chương trình an toàn miễn phí, đa ngôn ngữ có giúp cửa hàng nhỏ thực hiện các cải thiện an toàn cụ thể không?","s2":["Thiết kế một kế hoạch đơn giản để kết nối cửa hàng với các hỗ trợ đã có, cùng những công cụ nhỏ mà Dự án 1 cho thấy là cần thiết.","Thử nghiệm với vài cửa hàng và sửa những gì chưa hiệu quả.","So sánh các cửa hàng bắt đầu ngay với các cửa hàng bắt đầu muộn hơn, để cửa hàng nào cũng được tham gia.","Đo lường các cải thiện an toàn đã thực hiện bằng bảng kiểm quan sát, cùng với kiến thức của người lao động, mức sử dụng và chi phí.","Chia sẻ kết quả bằng mọi ngôn ngữ chúng tôi đã dùng, kể cả những gì không hiệu quả."],"fork":[["Nếu khoảng trống có thật","Chúng tôi làm Dự án 2 và thử toàn bộ chương trình."],["Nếu đã có hỗ trợ nhưng không ai dùng","Chúng tôi kết nối cửa hàng với hỗ trợ đó, bằng ngôn ngữ của họ, thay vì làm lại từ đầu."],["Nếu khoảng trống nhỏ hơn chúng tôi nghĩ","Chúng tôi chuyển đến nơi thật sự cần."]],"cite":"Một bác sĩ y học nghề nghiệp và môi trường, trong một bình luận công khai","qnote":"","why":"Nếu ngay cả chủ lao động tốt cũng hiếm khi theo dõi người lao động tiếp xúc với gì, thì tiệm tạp hóa gần như không bao giờ làm.","doorH":"Bảng nội quy trên cửa của chúng tôi","doorI":"Chủ tiệm và người lao động cần tin tưởng chúng tôi trước khi cho chúng tôi vào. Đây là những cam kết chúng tôi đang hướng tới, và sẽ được luật sư xem xét trước khi ra mắt.","doorNo":["Chúng tôi không phải thanh tra, và không báo cáo cửa hàng cho cơ quan quản lý.","Chúng tôi thiết kế công cụ để chủ tiệm không thấy chi tiết sức khỏe của người lao động.","Chúng tôi dự định lưu càng ít thông tin nhận dạng người lao động càng tốt, để có rất ít dữ liệu có thể bị giao nộp.","Chúng tôi không tư vấn pháp lý. Chúng tôi giúp kết nối với trợ giúp pháp lý."],"doorYes":["Chúng tôi dự định phối hợp với chương trình tư vấn miễn phí, bảo mật của OSHA dành cho doanh nghiệp nhỏ.","Người lao động tự chọn chia sẻ gì, và có thể dừng bất cứ lúc nào."],"fundH":"Chúng tôi sẽ tìm nguồn tài trợ thế nào","fund":[["Tài trợ nghiên cứu","Tài trợ nghiên cứu của NIOSH và các trường đại học, cùng một đối tác học thuật hoặc đơn vị bảo trợ tài chính."],["Các quỹ","Những quỹ tập trung vào sức khỏe người lao động, sức khỏe người nhập cư, sức khỏe môi trường và công bằng y tế."],["Chính quyền địa phương","Sở y tế thành phố và quận đã hỗ trợ các chương trình cho doanh nghiệp nhỏ."],["Công ty bảo hiểm và quỹ bang","Một số có thể hỗ trợ phòng ngừa cho các doanh nghiệp họ bảo hiểm, nơi người lao động có bảo hiểm."],["Nhà tài trợ cộng đồng","Phòng thương mại, hiệp hội thẩm mỹ, trường thẩm mỹ và nhà cung cấp."],["Phí nhỏ, về sau","Gói thành viên theo khả năng chi trả cho cửa hàng muốn được thăm nhiều hơn, khi chương trình đã được chứng minh."]],"helpH":"Cùng xây dựng","helpI":"Chúng tôi là một đội nhỏ với con đường còn dài. Dù bạn có vài giờ mỗi tháng hay cả một học kỳ, luôn có chỗ cho bạn.","roles":[["Tình nguyện viên cộng đồng","Cùng nhóm chúng tôi đến thăm cửa hàng, chia sẻ tài liệu và giúp chủ tiệm và người lao động thấy thoải mái. Đặc biệt cần người nói tiếng Tây Ban Nha, tiếng Trung, tiếng Tagalog, tiếng Việt, tiếng Creole Haiti và các ngôn ngữ khác.","Vài giờ mỗi tháng"],["Biên dịch và phiên dịch","Dịch khảo sát, hướng dẫn an toàn và màn hình ứng dụng, rồi thử với người lao động thật để đảm bảo dễ hiểu.","Theo dự án"],["Thực tập sinh y tế công cộng và dự bị y khoa","Hỗ trợ nghiên cứu khoảng trống: lập danh sách dịch vụ, khảo sát và viết báo cáo dễ hiểu.","Một học kỳ, khoảng 8 đến 10 giờ mỗi tuần"],["Kỹ sư phần mềm","Khi nghiên cứu cho thấy một công cụ sẽ có ích, hãy giúp làm nó: đơn giản, riêng tư và đa ngôn ngữ.","Lâu dài, giờ linh hoạt"],["Nhà thiết kế","Làm cho mọi thứ dễ dùng trên điện thoại cũ, bằng bất kỳ ngôn ngữ nào, trong hai phút nghỉ giải lao.","Theo dự án"],["Chuyên gia y tế và an toàn","Y tá, bác sĩ, chuyên viên vệ sinh công nghiệp và chuyên gia an toàn có thể tư vấn, xem lại tài liệu, hoặc trong tương lai giúp kết nối cửa hàng với dịch vụ chăm sóc.","Vài giờ mỗi tháng"],["Nhà nghiên cứu","Giảng viên và nghiên cứu sinh muốn hợp tác trong hai nghiên cứu và hồ sơ xin tài trợ.","Theo dự án"],["Chủ tiệm và người lao động","Tham gia nhóm đầu tiên, cho chúng tôi biết bạn cần gì và cùng định hình những gì chúng tôi xây dựng. Tiếng nói của bạn là trên hết.","Bất cứ khi nào bạn có thể"]],"commitH":"Bạn quyết định dành bao nhiêu thời gian","commit":[["Thỉnh thoảng","Giúp một sự kiện, dịch một trang, hoặc thử ứng dụng một lần."],["Thường xuyên","Vài giờ mỗi tháng cho tiếp cận cộng đồng, dịch thuật hoặc tư vấn."],["Gắn bó","Thực tập một học kỳ hoặc vai trò xây dựng lâu dài, có dự án rõ ràng và người hướng dẫn."]],"contactQ":"Có câu hỏi? Email cho chúng tôi tại","joinH":"Tham gia","joinI":"Chúng tôi đang tìm cửa hàng, người lao động, tình nguyện viên, thực tập sinh, kỹ sư, đối tác và nhà tài trợ để cùng xây dựng.","btns":{"owner":["Tôi có cửa hàng","Tham gia nhóm đầu tiên"],"worker":["Tôi làm ở cửa hàng","Cho chúng tôi biết bạn cần gì"],"volunteer":["Tôi muốn làm tình nguyện","Tiếp cận, dịch thuật, thiết kế"],"intern":["Thực tập sinh hoặc kỹ sư","Nghiên cứu, y tế công cộng, ứng dụng"],"partner":["Tôi muốn hợp tác","Trung tâm người lao động, phòng khám, đại học"],"funder":["Trò chuyện với chúng tôi","Quỹ, nhà tài trợ, cơ quan"]},"fName":"Tên của bạn","fContact":"Email hoặc số điện thoại","msgs":{"owner":"Cho chúng tôi biết về cửa hàng của bạn","worker":"Điều gì sẽ giúp bạn khi làm việc? Bạn có thể viết bằng bất kỳ ngôn ngữ nào.","volunteer":"Bạn muốn giúp gì, và bạn nói những ngôn ngữ nào?","intern":"Cho chúng tôi biết trường hoặc kỹ năng của bạn, và bạn có thể dành bao nhiêu giờ mỗi tuần","partner":"Cho chúng tôi biết về tổ chức của bạn","funder":"Hãy cho chúng tôi biết về tổ chức của bạn và cách bạn muốn hợp tác"},"send":"Gửi","eReq":"Nhập tên và email hoặc số điện thoại để chúng tôi liên lạc với bạn.","thanks":"Cảm ơn bạn! Chúng tôi đã nhận được tin nhắn và sẽ sớm liên hệ.","sending":"Đang gửi…","sendErr":"Chưa gửi được. Vui lòng thử lại hoặc gửi email đến","np":"Tổ chức phi lợi nhuận đang thành lập.","contact":"Liên hệ","preview":"","replay":"Xem lại phần giới thiệu","view":"Chế độ xem","desktop":"Máy tính","mobile":"Điện thoại","close":"Đóng xem trên điện thoại","ways":[["Chia sẻ những gì bạn gặp ở nơi làm việc","Cho chúng tôi biết điều gì khó khăn, không an toàn hay khó hiểu trong công việc. Câu trả lời của bạn định hướng mọi thứ chúng tôi xây dựng."],["Đưa doanh nghiệp của bạn tham gia sớm","Trở thành một trong những cửa hàng đầu tiên giúp định hình chương trình thí điểm."],["Đóng góp thời gian và kỹ năng","Làm tình nguyện trong cộng đồng, dịch cho người lao động, hoặc tham gia thực tập."],["Cùng làm công cụ với chúng tôi","Kỹ sư và nhà thiết kế: giúp làm công cụ cho người lao động và cửa hàng, ở bất cứ nơi nào cần."],["Hợp tác với chúng tôi","Phòng khám, trường học, trung tâm người lao động và nhà tài trợ: hãy cùng bàn chuyện hợp tác."]],"bridge":"Không có một sản phẩm duy nhất. Nơi làm việc cần gì, chúng tôi làm điều đó.","rolesH":"Cách chúng tôi làm việc","rolesI":"Chúng tôi bắt đầu với ba doanh nghiệp nhỏ khác nhau trong một thành phố, mỗi nơi có những thách thức riêng về sức khỏe và an toàn lao động. Bằng cách làm việc sát với chủ tiệm và người lao động, chúng tôi sẽ tìm ra điều họ cần, kết nối họ với các nguồn lực đã có, và xây dựng giải pháp thiết thực ở những nơi còn khoảng trống. Những gì học được từ chương trình thí điểm đầu tiên này sẽ định hướng cách OEM360 phát triển và phục vụ thêm nhiều cộng đồng.","roles8":[["Kết nối","Kết nối cửa hàng và người lao động với các hỗ trợ miễn phí đã có, như phòng khám sức khỏe nghề nghiệp, trung tâm người lao động và Chương trình Tư vấn Tại chỗ của OSHA. Chương trình này miễn phí, bảo mật và tách biệt với thanh tra, không có biên bản hay tiền phạt. Chủ tiệm tự yêu cầu và đồng ý khắc phục các nguy cơ nghiêm trọng được phát hiện."],["Áp dụng chương trình đã hiệu quả","Đưa các chương trình hiệu quả ở nơi khác về tiểu bang nơi chúng tôi bắt đầu, cùng với các nhóm địa phương. Ví dụ, Chương trình Công nhận Tiệm Nail Lành mạnh của California là chương trình miễn phí, tự nguyện do các quận và Sở Kiểm soát Chất độc của tiểu bang điều hành, nhằm bảo vệ thợ, khách hàng và môi trường. Nếu thấy chương trình giúp ích, chúng tôi có thể từng bước khởi động một chương trình tương tự."],["Xây dựng công cụ","Làm phần mềm đơn giản, riêng tư, đa ngôn ngữ ở nơi thật sự có ích, như một hồ sơ phơi nhiễm cá nhân mà người lao động giữ cho bản thân và bác sĩ của họ."],["Dịch thuật","Làm rõ tài liệu an toàn bằng tiếng Tây Ban Nha, tiếng Trung, tiếng Hàn, tiếng Nepal, tiếng Tagalog, tiếng Việt, tiếng Creole Haiti và nhiều ngôn ngữ khác."],["Tổ chức","Đưa chủ tiệm, người lao động, phòng khám, nhóm cộng đồng và trường học ngồi chung một bàn."],["Hỗ trợ đăng ký","Giúp chủ tiệm đăng ký các chương trình và công cụ đã có, và lo phần giấy tờ."],["Lên tiếng","Lên tiếng cho người lao động ở doanh nghiệp nhỏ và nhu cầu của họ, bằng ngôn ngữ của họ."],["Tài trợ","Giúp cửa hàng và đối tác cộng đồng tìm khoản tài trợ và nguồn lực, và về sau chuyển nguồn vốn đến các chương trình địa phương."]],"toolsI":"Phần mềm là một trong những cách chúng tôi có thể giúp, không phải cách duy nhất. Khi nghiên cứu cho thấy một công cụ thật sự giúp được nơi làm việc, chúng tôi sẽ làm nó: đơn giản, riêng tư, đa ngôn ngữ và miễn phí.","disc":"OEM360 là một tổ chức phi lợi nhuận đang được thành lập. Chúng tôi không tư vấn y tế hay pháp lý. Trong trường hợp khẩn cấp, hãy gọi 911.","pilot":"Bắt đầu ở một tiểu bang, rồi mở rộng từ đó.","status":"Giai đoạn 1: lắng nghe và xây dựng quan hệ đối tác. Chúng tôi chưa cung cấp dịch vụ.","pilotTag":"Thí điểm","laterTag":"Sau này","aboutH":"Về OEM360","seekH":"Chúng tôi đang tìm","seek":["Một người hướng dẫn học thuật","Một đơn vị bảo trợ tài chính","Các đối tác cộng đồng ở tiểu bang nơi chúng tôi bắt đầu"],"whoH":"Những ai đã làm việc này","whoI":"Nhiều nhóm đã và đang làm những việc quan trọng. Chúng tôi không trực thuộc họ. Vai trò của chúng tôi là giúp các cửa hàng nhỏ và người lao động tìm và sử dụng những gì họ cung cấp, bằng ngôn ngữ của mình.","who":[["Chương trình Tư vấn Tại chỗ của OSHA","Hỗ trợ an toàn miễn phí, bảo mật cho doanh nghiệp nhỏ ở mọi tiểu bang, tách biệt với thanh tra. Không có biên bản hay tiền phạt. Chủ tiệm tự yêu cầu và đồng ý khắc phục các nguy cơ nghiêm trọng được phát hiện."],["Phòng khám sức khỏe nghề nghiệp","Các phòng khám chẩn đoán và giúp phòng ngừa bệnh liên quan đến công việc, có nơi phục vụ cả người không có bảo hiểm."],["Các nhóm COSH","Các liên minh an toàn lao động địa phương ở nhiều tiểu bang, cung cấp huấn luyện và vận động."],["Trung tâm người lao động và nhóm cộng đồng","Các nhóm hỗ trợ người lao động nhập cư, thường bằng ngôn ngữ của họ."],["Chương trình của tiểu bang và địa phương","Các chương trình như công nhận tiệm nail lành mạnh ở một số quận của California, và quy định của tiểu bang về những vấn đề như thông gió trong tiệm."]],"evH":"Bằng chứng chúng tôi dựa vào","ev":[["Tiệm nail ở Philadelphia","Các nhà nghiên cứu và cộng đồng tiệm nail người Việt cùng thiết kế một chương trình sức khỏe, cho thấy giá trị của việc xây dựng cùng cộng đồng ngay từ đầu."],["Tiệm sửa xe và tiệm làm đẹp ở Tucson","Một chương trình nhân viên y tế cộng đồng giữ được hầu hết cửa hàng tham gia, nhưng không thấy mức hóa chất giảm đáng kể. Chương trình hỗ trợ tối đa 300 đô la mỗi cửa hàng cho các cải thiện như thông gió và sản phẩm an toàn hơn. Chúng tôi xem trọng cả hai bài học."]],"outcome":"Thước đo chính của chúng tôi, được xác định trước: tỷ lệ cửa hàng đã thực hiện các cải thiện an toàn quan trọng, được kiểm tra trực tiếp. Chúng tôi dự định thực hiện nghiên cứu dưới sự xét duyệt đạo đức của trường đại học, và dành một quỹ nhỏ cho các cải thiện như thông gió và sản phẩm an toàn hơn.","mt":"Bản dịch này được tạo bằng AI và đang được người bản ngữ xem lại.","privacy":"Chúng tôi chỉ dùng thông tin bạn chia sẻ để trả lời bạn về OEM360. Chúng tôi không bán và không chia sẻ với chủ lao động. Vui lòng không ghi thông tin sức khỏe hay tên nơi bạn làm việc.","founderS":"Được thành lập với niềm tin rằng mọi người lao động đều xứng đáng có một nơi làm việc an toàn hơn.","mission":["OEM360 được thành lập dựa trên một niềm tin đơn giản: sức khỏe và sự an toàn của người lao động không bao giờ nên phụ thuộc vào quy mô của doanh nghiệp nơi họ làm việc.","Doanh nghiệp nhỏ là xương sống của cộng đồng, nhưng những người làm việc ở đó thường đối mặt với các nguy cơ có thể phòng tránh mà không có được nguồn lực, hướng dẫn hay hỗ trợ như ở các công ty lớn.","OEM360 tồn tại để giúp thu hẹp khoảng cách đó: bắt đầu từ địa phương, lắng nghe người lao động và chủ doanh nghiệp, và cùng nhau xây dựng những giải pháp thiết thực, lâu dài."]},"ht":{"nav":{"what":"Sa nou fè","research":"Rechèch","help":"Ede nou bati","join":"Patisipe","menu":"Meni","lang":"Lang"},"h1a":"Gwo konpayi yo gen yon depatman sekirite.","h1b":"Ti biznis yo pa genyen.","lede":"OEM360 se yon òganizasyon san bi likratif ki konsakre sou sante ak sekirite ti biznis ak moun ki travay ladan yo, nan pwòp lang yo, pou ti kras kòb oswa gratis.","promise":"Chak travayè. Chak kote travay.","hint":"N ap kòmanse nan yon eta. Chwazi yon biznis pou w wè sa travayè yo fè fas, ak kijan nou ka ede.","shopnames":{"nails":"Salon zong","food":"Restoran","store":"Ti magazen","auto":"Garaj","hair":"Salon cheve","clean":"Ekip netwayaj"},"inside":["Kiyès ki travay la","Sa yo fè fas ak li","Kijan OEM360 ka ede"],"shops":{"nails":["Anndan salon zong lan","Ti ekip ak lè travay ki long. Anpil travayè salon zong pale vyetnamyen, koreyen, chinwa, nepali oswa panyòl, epi anpil se kontraktè endepandan san asirans aksidan travay.",["Lafimen ki soti nan vèni, akrilik ak retirè","Pousyè lè y ap lime","Doulè nan kou, do ak ponyèt paske yo bese sou kliyan"],["Konekte salon yo ak konsiltasyon sekirite gratis e konfidansyèl, tankou Pwogram Konsiltasyon Sou Plas OSHA a, epi ede ak enskripsyon an","Mete mèt biznis, travayè ak gwoup kominotè lokal ansanm pou pale sou sa ki ta ede","Aprann nan Pwogram Rekonesans Salon Zong an Sante Kalifòni a epi, si li montre benefis klè, travay ak gwoup lokal pou kòmanse yon bagay konsa tou dousman kote nou kòmanse","Si sa ta ede, yon dosye ekspozisyon prive travayè yo kenbe sou pwodui yo sèvi ak yo, pou pataje ak pwòp doktè yo si yo vle"]],"food":["Anndan restoran an","Kizinye, sèvè ak moun k ap lave asyèt k ap travay vit nan kizin cho ki chaje moun.",["Boule ak koupe","Glise sou planche mouye","Chalè, leve bagay lou ak pwodui netwayaj fò"],["Konekte restoran ak konsiltasyon sekirite gratis ak fòmasyon pou travayè manje ki deja egziste","Pataje ti materyèl sekirite ki soti nan sous serye, nan lang travayè yo","Èd pou jwenn yon klinik sante travay lè yon moun boule oswa koupe","Si sa ta ede, yon lis verifikasyon senp nan telefòn pou mèt biznis fini anvan yo louvri"]],"store":["Anndan ti magazen an","Souvan se yon fanmi ak youn oswa de anplwaye, ouvè bonè rive ta.",["Leve machandiz ak monte nechèl","Rete kanpe pandan lontan","Danje sekirite lannwit"],["Konekte mèt biznis ak konsiltasyon sekirite gratis ak resous pou ti biznis","Ede mèt biznis chèche sibvansyon pou amelyorasyon debaz, tankou nechèl ki pi an sekirite oswa pi bon limyè","Pataje gid sekirite pou lannwit ki soti nan sous serye, nan lang mèt biznis la","Èd pou jwenn swen lè yon moun blese do l nan leve machandiz"]],"auto":["Anndan garaj la","Mekanisyen ak kawosye ki travay toutan bò motè, penti ak pyès lou.",["Penti, solvan ak lafimen tiyo echapman","Bri","Pyès lou, koupe ak blesi kraze"],["Konekte garaj yo ak Pwogram Konsiltasyon Sou Plas gratis OSHA a, epi ede ak papye yo","Konekte garaj yo ak pwogram ki deja egziste sou penti, solvan ak vantilasyon","Fè enfòmasyon sekirite pwodui yo klè nan lang mekanisyen yo","Si sa ta ede, yon zouti ki di ki pwodui ki bezwen mask oswa gan"]],"hair":["Anndan salon cheve a","Kwafè ki kanpe tout jounen, anpil ladan yo lwe pwòp chèz yo.",["Tenti ak dekoloran cheve","Tretman pou lise cheve ki ka lage fòmaldeyid","Doulè nan zepòl ak do"],["Konekte salon yo ak konsiltasyon sekirite gratis ak resous sekirite pou salon ki deja egziste","Pataje enfòmasyon klè sou pwodui ki pi an sekirite ak tretman lis, nan lang estilis yo","Voye moun ki lwe chèz bay sant travayè ak èd legal pou konnen dwa yo","Si sa ta ede, yon zouti ki di ki pwodui ki ka lage fòmaldeyid"]],"clean":["Anndan ekip netwayaj la","Ti ekip k ap netwaye biwo ak kay, souvan lannwit.",["Melanje pwodui netwayaj fò","Glise ak tonbe","Leve bagay lou ak travay pou kont ou"],["Konekte ekip yo ak sant travayè ak fòmasyon sou pwodui netwayaj ki deja egziste","Pataje yon gid ak imaj sou ki pwodui chimik pou pa janm melanje, nan lang travayè yo","Mete konpayi netwayaj ak travayè ansanm pou planifye travay pou kont ou lannwit","Si sa ta ede, yon dosye ekspozisyon prive chak travayè posede epi ka pote soti nan yon travay al nan yon lòt"]]},"plainH":"An mo senp","plainP":"Chak ti biznis diferan. Gen kèk ki bezwen konekte ak èd ki deja egziste. Gen kèk ki bezwen yon pwogram ki deja fè prèv li vin nan vil yo. Gen kèk ki bezwen yon zouti senp ki poko egziste. OEM360 kòmanse pa koute epi etidye sa chak kote travay bezwen, epi apre sa li fè sa ki ap ede plis.","n360":[["Chak kote travay","Pa sèlman gwo konpayi. Ti boutik ki pa janm jwenn èd yo tou."],["Chak travayè","Nenpòt lang, nenpòt travay, anplwaye oswa kontraktè endepandan."],["Tout tablo a","Prevansyon an premye, plis èd pou jwenn swen ak retounen travay an sekirite."]],"cmpH":"Yon depatman sekirite pataje","cmpI":"Senkant ti biznis pa ka chak anplwaye yon responsab sekirite. Ansanm, ak pwogram ki deja egziste yo, yo ta ka jwenn menm kalite èd gwo konpayi yo genyen.","cmpTh":["Gwo konpayi yo genyen","Ti boutik yo souvan genyen","Sa OEM360 pote"],"cmp":[["Yon responsab sekirite","Pèsonn","Yon lyen ak Pwogram Konsiltasyon Sou Plas OSHA a, gratis, konfidansyèl epi separe ak enspeksyon"],["Yon lis pwodui chimik ak fich done sekirite","Yon etajè pwodui","Èd pou fè yon lis pwodui chimik epi jwenn Fèy Done Sekirite yo"],["Fòmasyon sekirite","“Gade jan m fè l”","Fòmasyon ki deja egziste, eksplike klè nan lang travayè yo"],["Yon klinik sante travay","Ijans, oswa anyen","Èd pou jwenn swen sante travay, tankou klinik gratis ak bon mache"],["Dosye blesi","Anyen pa ekri","Èd pou konprann ki dosye ki obligatwa, epi kenbe yo yon fason senp"],["Yon plan pou retounen travay","Kite travay, oswa travay blese","Èd pou planifye yon retou travay an sekirite ak pwòp doktè travayè a"]],"whatH":"Zouti nou ka bati","decals":[["Dosye ekspozisyon pèsonèl","Yon dosye prive ki pou travayè a: travay li te fè, pwodui li te sèvi ak yo ak nenpòt sentòm li remake. Se li ki deside si ak ki lè pou l pataje l ak pwòp doktè l. Li fèt pou ede travayè yo ak doktè yo, pa pou denonse oswa pini biznis."],["Pran foto etikèt la","Mèt biznis yo pran foto chak pwodui, epi zouti a ede fè lis pwodui chimik la epi jwenn Fèy Done Sekirite yo."],["Lis verifikasyon biznis","Yon lis sekirite kout, ak imaj, yon mèt biznis ka fini nan telefòn nan kèk minit."]],"resH":"Nou kòmanse ak rechèch","resI":"Twou sa a deja byen dokimante. Kidonk premye pwojè nou an ap fè kat èd ki egziste nan zòn nan ak poukisa moun pa sèvi avè l, epi dezyèm nan ap teste si fason nou travay la ede.","p1":"Pwojè 1","d1":"Anviwon 9 mwa","q1":"Ki èd sekirite ak sante ti biznis yo ka jwenn jodi a, epi poukisa anpil ladan l pa sèvi?","how":"Kijan n ap jwenn repons lan","s1":["Fè kat sèvis sekirite gratis ak bon mache ki toupre, ak lang yo ofri yo.","Fè sondaj ak mèt biznis ak travayè yo, nan pwòp lang yo, sou sa ki anpeche yo sèvi ak èd sa a.","Avèk pèmisyon, vizite biznis yo ak yon lis verifikasyon sekirite senp.","Fè konvèsasyon apwofondi ak mèt biznis ak travayè yo, ansanm ak patnè nan kominote a.","Pibliye yon kat sèvis lokal ak yon rapò nan langaj senp."],"p2":"Pwojè 2","d2":"Anviwon 18 mwa","q2":"Èske yon pwogram sekirite gratis an plizyè lang fè ti biznis yo mete amelyorasyon sekirite presi an plas, konpare ak biznis ki kòmanse pita?","s2":["Konsevwa yon plan senp pou konekte biznis ak èd ki deja egziste, plis ti zouti Pwojè 1 montre ki nesesè.","Eseye l ak kèk biznis epi korije sa ki pa mache.","Konpare biznis ki kòmanse touswit ak biznis ki kòmanse pita, pou chak biznis jwenn pwogram nan kanmenm.","Mezire ki amelyorasyon sekirite ki an plas ak yon lis obsèvasyon, plis konesans travayè yo, itilizasyon ak pri.","Pataje rezilta yo nan chak lang nou te travay, menm sa ki pa t mache."],"fork":[["Si mank lan reyèl","Nou fè Pwojè 2 epi nou teste tout pwogram nan."],["Si èd egziste men moun pa sèvi avè l","Nou konekte boutik yo avè l, nan lang yo, olye nou rebati l."],["Si mank lan pi piti pase nou panse","Nou ale kote vrè bezwen an ye."]],"cite":"Yon doktè medsin travay ak anviwònman, nan yon kòmantè piblik","qnote":"","why":"Si menm bon patwon yo raman swiv sa travayè yo ekspoze ak li, ti magazen nan kwen lari a prèske pa janm fè l.","doorH":"Afich sou pòt nou","doorI":"Mèt biznis ak travayè yo bezwen fè nou konfyans anvan yo kite nou antre. Men angajman n ap travay pou yo, epi avoka ap revize yo anvan nou lanse.","doorNo":["Nou pa enspektè, epi nou pa denonse biznis bay otorite yo.","N ap konsevwa zouti nou yo pou mèt biznis pa wè detay sante travayè yo.","Nou planifye kenbe pi piti enfòmasyon posib ki ka idantifye travayè yo, pou gen ti kras sèlman ki ta ka janm remèt.","Nou pa bay konsèy legal. Nou konekte moun ak èd legal."],"doorYes":["Nou planifye travay ansanm ak pwogram konsiltasyon gratis e konfidansyèl OSHA pou ti biznis.","Travayè yo chwazi sa yo pataje, epi yo ka sispann nenpòt ki lè."],"fundH":"Kijan n ap finanse l","fund":[["Sibvansyon rechèch","Sibvansyon rechèch NIOSH ak inivèsite, ansanm ak yon patnè akademik oswa yon sponsò fiskal."],["Fondasyon","Bayè fon ki konsantre sou sante travayè, sante imigran, sante anviwònman ak egalite nan sante."],["Gouvènman lokal","Depatman sante vil ak konte ki deja sipòte pwogram pou ti biznis."],["Asirans ak fon leta","Gen kèk ki ta ka sipòte prevansyon pou biznis yo kouvri, kote travayè yo gen asirans."],["Sponsò nan kominote a","Chanm komès, asosyasyon salon, lekòl bote ak founisè."],["Ti frè, pita","Yon manm ak pri dapre mwayen pou boutik ki vle plis vizit, lè pwogram nan fin pwouve."]],"helpH":"Ede nou bati","helpI":"Nou se yon ti ekip ak anpil wout pou n fè. Kit ou gen kèk èdtan pa mwa oswa yon semès konplè, gen plas pou ou.","roles":[["Volontè nan kominote a","Vizite biznis ak ekip nou an, pataje materyèl epi ede mèt biznis ak travayè santi yo alèz. Nou bezwen sitou moun ki pale panyòl, chinwa, tagalòg, vyetnamyen, kreyòl ayisyen ak lòt lang.","Kèk èdtan pa mwa"],["Tradiktè ak entèprèt","Tradui sondaj, gid sekirite ak ekran aplikasyon an, epi teste yo ak vrè travayè pou mo yo klè.","Selon pwojè"],["Estajyè sante piblik ak pre-sante","Ede ak etid sou mank yo: fè lis sèvis yo, fè sondaj epi ekri rapò a nan langaj senp.","Yon semès, anviwon 8 a 10 èdtan pa semèn"],["Enjenyè lojisyèl","Lè rechèch nou montre yon zouti ta ede, ede bati l: senp, prive epi an plizyè lang.","Kontinyèl, orè fleksib"],["Designer","Fè tout bagay fasil pou itilize sou yon vye telefòn, nan nenpòt lang, nan yon poz de minit.","Selon pwojè"],["Pwofesyonèl sante ak sekirite","Enfimyè, doktè, ijyenis endistriyèl ak pwofesyonèl sekirite ki ka bay konsèy, revize materyèl, oswa pita ede konekte biznis ak swen.","Kèk èdtan pa mwa"],["Chèchè","Pwofesè ak etidyan gradye ki vle patisipe nan de etid yo ak nan demann sibvansyon yo.","Selon pwojè"],["Mèt boutik ak travayè","Antre nan premye gwoup nou an, di nou sa ou bezwen, epi ede nou fòme sa n ap bati. Vwa w vini anvan.","Nenpòt lè ou kapab"]],"commitH":"Se ou ki deside konbyen tan ou bay","commit":[["De tanzantan","Ede nan yon evènman, tradui yon paj, oswa teste aplikasyon an yon fwa."],["Regilye","Kèk èdtan pa mwa nan travay kominotè, tradiksyon oswa konsèy."],["Angaje","Yon estaj pou yon semès oswa yon wòl kontinyèl pou bati, ak yon pwojè klè ak yon mantò."]],"contactQ":"Ou gen kesyon? Ekri nou nan","joinH":"Patisipe","joinI":"N ap chèche boutik, travayè, volontè, estajyè, enjenyè, patnè ak bayè fon pou bati sa ansanm ak nou.","btns":{"owner":["Mwen gen yon boutik","Antre nan premye gwoup la"],"worker":["Mwen travay nan yon boutik","Di nou sa ou bezwen"],"volunteer":["Mwen vle fè volontè","Travay kominotè, tradiksyon, design"],"intern":["Estajyè oswa enjenyè","Rechèch, sante piblik, aplikasyon an"],"partner":["Mwen vle fè patenarya","Sant travayè, klinik, inivèsite"],"funder":["Pale avè nou","Fondasyon, sponsò, ajans"]},"fName":"Non ou","fContact":"Imèl oswa telefòn","msgs":{"owner":"Pale nou de boutik ou","worker":"Kisa ki ta ede w nan travay ou? Ou ka ekri nan nenpòt lang.","volunteer":"Nan kisa ou ta renmen ede, e ki lang ou pale?","intern":"Di nou lekòl ou oswa konpetans ou, ak konbyen èdtan pa semèn ou ka bay","partner":"Pale nou de òganizasyon w","funder":"Pale nou de òganizasyon w lan ak kijan ou ta renmen travay ansanm"},"send":"Voye","eReq":"Mete non w ak yon imèl oswa nimewo telefòn pou nou ka kontakte w.","thanks":"Mèsi! Nou resevwa mesaj ou, n ap kontakte w byento.","sending":"N ap voye…","sendErr":"Li pa pase. Eseye ankò oswa ekri nou nan","np":"Òganizasyon san bi likratif k ap fòme.","contact":"Kontak","preview":"","replay":"Gade entwodiksyon an ankò","view":"Vi","desktop":"Òdinatè","mobile":"Telefòn","close":"Fèmen vi telefòn nan","ways":[["Pataje sa w fè fas ak li nan travay","Di nou sa ki difisil, ki danjere oswa ki konfizyon nan travay ou. Repons ou gide tout sa n ap bati."],["Mennen biznis ou bonè","Fè pati premye biznis k ap ede fòme pwogram pilòt nou an."],["Bay tan w ak talan w","Fè volontè nan kominote w, tradui pou travayè yo, oswa vin estajyè avè nou."],["Bati zouti yo avèk nou","Enjenyè ak designer: ede bati zouti pou travayè ak biznis, kote yo bezwen yo."],["Vin patnè nou","Klinik, lekòl, sant travayè ak bayè fon: ann pale sou travay ansanm."]],"bridge":"Pa gen yon sèl pwodui. Sa chak kote travay bezwen.","rolesH":"Kijan nou travay","rolesI":"N ap kòmanse ak twa ti biznis diferan nan yon vil, chak ak pwòp defi sante ak sekirite travay pa li. Lè n ap travay toupre ak mèt biznis ak travayè yo, n ap jwenn sa yo bezwen, konekte yo ak resous ki deja egziste, epi devlope solisyon pratik kote toujou gen twou. Sa nou aprann nan premye pilòt sa a ap gide kijan OEM360 grandi epi sèvi plis kominote.","roles8":[["Konekte","Konekte biznis ak travayè ak èd gratis ki deja egziste, tankou klinik sante travay, sant travayè ak Pwogram Konsiltasyon Sou Plas OSHA a. Pwogram sa a gratis, konfidansyèl epi separe ak enspeksyon, san sitasyon ni amann. Se mèt biznis la ki mande l epi ki dakò korije nenpòt gwo danje yo jwenn."],["Adapte pwogram ki fè prèv yo","Pote nan eta kote nou kòmanse pwogram ki mache lòt kote, ansanm ak gwoup lokal yo. Pa egzanp, Pwogram Rekonesans Salon Zong an Sante nan Kalifòni se yon pwogram gratis e volontè konte yo ak Depatman Kontwòl Sibstans Toksik leta a dirije pou pwoteje travayè salon, kliyan ak anviwònman an. Si nou wè kijan li ede, nou ta ka kòmanse yon bagay konsa tou dousman."],["Bati zouti","Kreye lojisyèl senp, prive, an plizyè lang kote li vrèman ede, tankou yon dosye ekspozisyon pèsonèl travayè yo kenbe pou tèt yo ak pwòp doktè yo."],["Tradui","Fè materyèl sekirite yo klè an panyòl, chinwa, koreyen, nepali, tagalòg, vyetnamyen, kreyòl ayisyen ak plis ankò."],["Òganize","Mete mèt biznis, travayè, klinik, gwoup kominotè ak lekòl sou menm tab la."],["Enskri","Ede mèt biznis enskri nan pwogram ak zouti ki deja egziste, epi okipe papye yo."],["Defann","Pale pou travayè ti biznis yo ak bezwen yo, nan lang yo."],["Finansman","Ede biznis ak patnè kominotè jwenn sibvansyon ak resous, epi pita pase lajan bay pwogram lokal yo."]],"toolsI":"Lojisyèl se youn nan fason nou ka ede, men se pa sèl la. Lè rechèch nou montre yon zouti ta vrèman ede yon kote travay, nou bati l: senp, prive, an plizyè lang e gratis.","disc":"OEM360 se yon òganizasyon san bi likratif k ap fòme. Nou pa bay konsèy medikal oswa legal. Nan yon ijans, rele 911.","pilot":"N ap kòmanse nan yon eta, epi grandi apati de la.","status":"Faz 1: n ap koute epi bati patenarya. Nou poko ofri sèvis.","pilotTag":"Pilòt","laterTag":"Pita","aboutH":"Konsènan OEM360","seekH":"Nou ap chèche","seek":["Yon konseye akademik","Yon sponsò fiskal","Patnè kominotè nan eta kote nou kòmanse"],"whoH":"Kiyès ki deja fè travay sa a","whoI":"Anpil gwoup deja ap fè bon travay. Nou pa afilye ak yo. Wòl nou se ede ti biznis ak travayè yo jwenn epi sèvi ak sa yo ofri, nan pwòp lang yo.","who":[["Pwogram Konsiltasyon Sou Plas OSHA","Èd sekirite gratis e konfidansyèl pou ti biznis nan chak eta, separe ak enspeksyon. San sitasyon ni amann. Se mèt biznis la ki mande l epi ki dakò korije nenpòt gwo danje yo jwenn."],["Klinik sante travay","Klinik ki fè dyagnostik epi ede anpeche maladi ki gen rapò ak travay, tankou kèk ki sèvi moun ki pa gen asirans."],["Gwoup COSH","Kowalisyon lokal pou sekirite travayè nan anpil eta ki ofri fòmasyon ak defans."],["Sant travayè ak gwoup kominotè","Gwoup ki sipòte travayè imigran, souvan nan pwòp lang yo."],["Pwogram leta ak lokal","Pwogram tankou rekonesans salon zong an sante nan kèk konte Kalifòni, ak règ leta sou bagay tankou vantilasyon nan salon."]],"evH":"Prèv nou baze sou yo","ev":[["Salon zong nan Filadèlfi","Chèchè yo ak kominote salon zong vyetnamyen an te konsevwa yon pwogram sante ansanm, sa ki montre valè bati ak kominote a depi nan kòmansman."],["Garaj ak salon bote nan Tucson","Yon pwogram ajan sante kominotè te kenbe pifò biznis yo patisipe, men li pa t jwenn yon gwo bès nan nivo pwodui chimik yo. Li te ofri jiska $300 pou chak biznis pou amelyorasyon tankou vantilasyon ak pwodui ki pi an sekirite. Nou pran toude leson yo oserye."]],"outcome":"Prensipal mezi nou, nou chwazi l davans: pousantaj biznis ki gen amelyorasyon sekirite kle an plas, nou verifye sou plas. Nou planifye fè etid nou yo anba revizyon etik yon inivèsite, epi mete yon ti fon sou kote pou amelyorasyon tankou vantilasyon ak pwodui ki pi an sekirite.","mt":"Tradiksyon sa a fèt ak AI epi moun ki pale lang nan ap revize l.","privacy":"Nou sèvi ak sa ou pataje sèlman pou nou reponn ou sou OEM360. Nou pa vann li ni pataje l ak patwon. Tanpri pa mete detay sante oswa non kote w travay.","founderS":"Fonde sou kwayans ke chak travayè merite yon kote travay ki pi an sekirite.","mission":["OEM360 fonde sou yon kwayans senp: sante ak sekirite yon travayè pa ta dwe janm depann de gwosè biznis kote l travay.","Ti biznis se poto mitan kominote nou yo, men moun ki travay ladan yo souvan fè fas ak danje yo te ka evite, san yo pa gen aksè ak resous, gid oswa sipò gwo patwon yo genyen.","OEM360 egziste pou ede fèmen twou sa a: kòmanse lokalman, koute travayè ak mèt biznis, epi bati ansanm solisyon pratik ki dire."]},"ko":{"nav":{"what":"하는 일","research":"연구","help":"함께 만들기","join":"참여하기","menu":"메뉴","lang":"언어"},"h1a":"대기업에는 안전 부서가 있습니다.","h1b":"동네 가게에는 없습니다.","lede":"OEM360은 소규모 사업장과 그곳에서 일하는 사람들의 건강과 안전을 위한 비영리 단체입니다. 각자의 언어로, 적은 비용이나 무료로 돕습니다.","promise":"모든 근로자. 모든 일터.","hint":"한 주에서 먼저 시작합니다. 가게를 골라 근로자들이 겪는 일과 우리가 도울 수 있는 방법을 확인해 보세요.","shopnames":{"nails":"네일 살롱","food":"식당","store":"동네 가게","auto":"자동차 정비소","hair":"미용실","clean":"청소 팀"},"inside":["일하는 사람들","겪는 어려움","OEM360이 도울 수 있는 방법"],"shops":{"nails":["네일 살롱 안","작은 팀, 긴 근무 시간. 많은 네일 살롱 근로자가 베트남어, 한국어, 중국어, 네팔어 또는 스페인어를 쓰며, 산재보험이 없는 독립 계약자도 많습니다.",["매니큐어, 아크릴, 리무버에서 나오는 증기","네일을 갈 때 생기는 먼지","손님 쪽으로 몸을 숙여 생기는 목, 허리, 손목 통증"],["살롱을 OSHA 현장 상담 프로그램 같은 무료 비밀 안전 상담과 연결하고 신청을 돕기","업주, 근로자, 지역 단체가 모여 무엇이 도움이 될지 이야기하기","캘리포니아의 건강한 네일 살롱 인증 프로그램에서 배우고, 효과가 분명하면 지역 단체와 함께 우리가 시작하는 곳에서 비슷한 것을 천천히 시작하기","도움이 된다면, 사용하는 제품을 근로자가 직접 기록하고 원할 때 자신의 의사와 공유하는 개인 노출 기록"]],"food":["식당 안","덥고 붐비는 주방에서 빠르게 움직이는 요리사, 서버, 설거지 담당.",["화상과 베임","젖은 바닥에서 미끄러짐","더위, 무거운 물건, 강한 세제"],["식당을 무료 안전 상담과 기존 외식업 근로자 교육에 연결하기","믿을 만한 곳의 짧은 안전 자료를 근로자의 언어로 나누기","화상이나 베임이 생겼을 때 직업 건강 클리닉 찾기 돕기","도움이 된다면, 업주가 문 열기 전에 휴대폰으로 끝내는 간단한 점검표"]],"store":["동네 가게 안","가족과 직원 한두 명이 이른 아침부터 늦게까지 운영하는 경우가 많습니다.",["물건 들기와 사다리 오르기","오래 서 있기","늦은 밤의 안전 위험"],["업주를 무료 안전 상담과 소상공인 자원에 연결하기","더 안전한 사다리나 더 밝은 조명 같은 기본 개선을 위한 지원금 찾기 돕기","믿을 만한 곳의 야간 안전 안내를 업주의 언어로 나누기","물건을 들다 허리를 다쳤을 때 치료 받을 곳 찾기 돕기"]],"auto":["자동차 정비소 안","엔진, 페인트, 무거운 부품 곁에서 일하는 정비사와 판금 기술자.",["페인트, 용제, 배기가스","소음","무거운 부품, 베임, 끼임 사고"],["정비소를 OSHA의 무료 현장 상담 프로그램에 연결하고 서류를 돕기","페인트, 용제, 환기에 관한 기존 프로그램에 연결하기","제품 안전 정보를 정비사의 언어로 알기 쉽게 만들기","도움이 된다면, 마스크나 장갑이 필요한 제품을 알려 주는 도구"]],"hair":["미용실 안","하루 종일 서서 일하는 미용사들, 많은 이가 의자를 임대합니다.",["염색약과 탈색제","포름알데히드를 내뿜을 수 있는 매직 스트레이트 시술","어깨와 허리 통증"],["미용실을 무료 안전 상담과 기존 미용 안전 자료에 연결하기","더 안전한 제품과 스트레이트 시술에 대한 정보를 미용사의 언어로 나누기","의자 임대 미용사에게 근로자 센터와 법률 지원의 권리 안내를 알려 주기","도움이 된다면, 포름알데히드를 내뿜을 수 있는 제품을 알려 주는 도구"]],"clean":["청소 팀 안","사무실과 가정에서, 주로 밤에 일하는 작은 팀.",["강한 세제 섞기","미끄러짐과 넘어짐","무거운 물건과 혼자 일하기"],["청소 팀을 근로자 센터와 기존 세제 안전 교육에 연결하기","섞으면 안 되는 세제를 그림으로 보여 주는 안내를 근로자의 언어로 나누기","청소 업체와 근로자가 함께 밤에 혼자 일하는 상황을 계획하기","도움이 된다면, 각 근로자가 소유하고 직장을 옮겨도 가져갈 수 있는 개인 노출 기록"]]},"plainH":"쉽게 말하면","plainP":"소규모 사업장은 모두 다릅니다. 어떤 곳은 이미 있는 도움과 연결되어야 하고, 어떤 곳은 검증된 프로그램이 그 도시에 들어와야 하며, 어떤 곳은 아직 없는 간단한 도구가 필요합니다. OEM360은 먼저 듣고 각 일터에 무엇이 필요한지 살핀 뒤, 가장 도움이 되는 일을 합니다.","n360":[["모든 일터","대기업만이 아닙니다. 도움을 받지 못하는 작은 가게들까지."],["모든 근로자","어떤 언어, 어떤 일이든, 직원이든 독립 계약자든."],["전체 그림","예방이 먼저, 그리고 치료를 찾고 안전하게 일터로 돌아가도록 돕기."]],"cmpH":"함께 쓰는 안전 부서","cmpI":"작은 가게 50곳이 각자 안전 담당자를 둘 수는 없습니다. 하지만 함께라면, 그리고 이미 있는 프로그램과 함께라면, 대기업이 누리는 도움을 나눌 수 있습니다.","cmpTh":["대기업에는","작은 가게에는 보통","OEM360이 가져오는 것"],"cmp":[["안전 담당자","아무도 없음","단속과 분리된 OSHA의 무료 비밀 현장 상담 프로그램과의 연결"],["화학물질 목록과 물질안전보건자료","제품이 놓인 선반","화학물질 목록 만들기와 물질안전보건자료 찾기 지원"],["안전 교육","“내가 하는 걸 보고 배워”","기존 교육을 근로자의 언어로 알기 쉽게"],["직업 건강 클리닉","응급실 아니면 없음","무료 및 저렴한 클리닉을 포함한 직업 건강 진료 찾기 지원"],["부상 기록","적어 둔 것 없음","필요한 기록이 무엇인지 이해하고 간단히 보관하도록 지원"],["업무 복귀 계획","그만두거나 아픈 채 일하기","근로자 본인의 의료진과 안전한 업무 복귀 계획 세우기 지원"]],"whatH":"만들 수도 있는 도구","decals":[["개인 노출 기록","근로자 본인의 비공개 기록입니다. 해 온 일, 다뤄 온 제품, 느낀 증상을 담습니다. 자신의 의사와 공유할지, 언제 공유할지는 본인이 정합니다. 근로자와 의사를 돕기 위한 것이지, 사업장을 신고하거나 처벌하기 위한 것이 아닙니다."],["라벨 찍기","업주가 제품을 하나씩 찍으면 도구가 화학물질 목록을 만들고 물질안전보건자료를 찾도록 돕습니다."],["가게 점검표","업주가 휴대폰으로 몇 분 안에 끝낼 수 있는 짧은 그림 점검표."]],"resH":"연구부터 시작합니다","resI":"이 공백은 이미 잘 알려져 있습니다. 그래서 첫 번째 프로젝트는 지역에 이미 있는 도움과 그것이 쓰이지 않는 이유를 살피고, 두 번째 프로젝트는 우리 방식이 도움이 되는지 확인합니다.","p1":"프로젝트 1","d1":"약 9개월","q1":"작은 가게들이 지금 받을 수 있는 안전·건강 도움은 무엇이며, 왜 많은 도움이 쓰이지 않을까요?","how":"알아보는 방법","s1":["가까운 무료·저렴한 안전 서비스와 제공 언어를 정리합니다.","업주와 근로자에게 각자의 언어로 그 도움을 쓰지 못하는 이유를 묻습니다.","허락을 받아 간단한 안전 점검표를 들고 가게를 둘러봅니다.","지역 협력 단체와 함께 업주, 근로자와 깊이 대화합니다.","알기 쉬운 지역 서비스 지도와 보고서를 공개합니다."],"p2":"프로젝트 2","d2":"약 18개월","q2":"무료 다국어 안전 프로그램이, 늦게 시작한 가게와 비교해, 작은 가게가 구체적인 안전 개선을 하도록 이끄는가?","s2":["프로젝트 1의 결과를 바탕으로 가게를 기존 도움에 연결하는 간단한 계획과 꼭 필요한 작은 도구를 설계합니다.","몇몇 가게에서 시범 운영하고 잘 안 되는 부분을 고칩니다.","바로 시작한 가게와 나중에 시작한 가게를 비교해, 모든 가게가 결국 프로그램을 받도록 합니다.","직접 확인하는 점검표로 실제 안전 개선을 측정하고, 근로자의 지식, 이용, 비용도 봅니다.","효과가 없었던 점까지 포함해, 함께한 모든 언어로 결과를 나눕니다."],"fork":[["공백이 실제로 있다면","프로젝트 2를 진행해 전체 프로그램을 시험합니다."],["도움이 있는데 쓰이지 않는다면","새로 만들지 않고, 가게를 그 도움에 그들의 언어로 연결합니다."],["공백이 생각보다 작다면","진짜 필요가 있는 곳으로 옮겨 갑니다."]],"doorH":"가게 문에 거는 약속","doorI":"업주와 근로자가 우리를 믿어야 문을 열어 줍니다. 아래는 우리가 지키려고 준비하는 약속이며, 시작하기 전에 변호사의 검토를 받을 것입니다.","doorNo":["우리는 단속 기관이 아니며, 가게를 당국에 신고하지 않습니다.","업주가 근로자의 건강 정보를 볼 수 없도록 도구를 설계하고 있습니다.","근로자를 알아볼 수 있는 정보는 최소한만 보관할 계획이라, 넘겨줄 만한 정보가 거의 없습니다.","법률 조언은 하지 않습니다. 법률 지원으로 연결해 드립니다."],"doorYes":["소규모 사업장을 위한 OSHA의 무료 비밀 상담 프로그램과 함께 일할 계획입니다.","무엇을 공유할지는 근로자가 정하며, 언제든 그만둘 수 있습니다."],"fundH":"재원 마련 방법","fund":[["연구 지원금","학술 파트너나 재정 후원 기관과 함께하는 NIOSH 및 대학 연구 지원금."],["재단","근로자 건강, 이민자 건강, 환경 보건, 건강 형평성에 관심 있는 후원자."],["지방 정부","이미 소상공인 건강 프로그램을 지원하는 시·카운티 보건국."],["보험사와 주 기금","근로자가 보험에 가입된 사업장의 예방 활동을 지원할 수 있는 곳."],["지역 후원자","상공회의소, 살롱 협회, 미용 학교, 공급업체."],["나중의 작은 회비","프로그램이 검증된 뒤, 방문을 더 원하는 가게를 위한 소득 연동 회원제."]],"helpH":"함께 만들기","helpI":"작은 팀이 넓은 거리를 맡고 있습니다. 한 달에 몇 시간이든 한 학기 전체든, 함께할 자리가 있습니다.","roles":[["지역 홍보 자원봉사자","팀과 함께 가게를 방문해 자료를 나누고 업주와 근로자가 편하게 느끼도록 돕습니다. 스페인어, 중국어, 한국어, 네팔어, 타갈로그어, 베트남어, 아이티 크리올어 등을 하는 분을 특히 찾습니다.","한 달에 몇 시간"],["번역가와 통역사","설문, 안전 안내서, 앱 화면을 번역하고 실제 근로자와 함께 이해되는지 확인합니다.","프로젝트별"],["보건·의예과 인턴","공백 연구를 돕습니다. 지역 서비스 정리, 설문 진행, 알기 쉬운 보고서 작성.","한 학기, 주 8~10시간"],["소프트웨어 엔지니어","연구에서 도구가 도움이 된다고 나오면, 간단하고 비공개이며 다국어인 도구를 함께 만듭니다.","지속, 유연한 시간"],["디자이너","오래된 휴대폰으로, 어떤 언어로든, 2분 쉬는 시간에도 쓸 수 있게 단순하게 만듭니다.","프로젝트별"],["의료인과 안전 전문가","조언하고 자료를 검토하거나, 앞으로 가게를 진료와 연결하도록 돕는 간호사, 의사, 산업위생사, 안전 전문가.","한 달에 몇 시간"],["연구자","두 연구와 지원금 신청에 함께할 교수와 대학원생.","프로젝트별"],["업주와 근로자","첫 그룹에 참여해 필요한 것을 알려 주시고 우리가 만들 것을 함께 정해 주세요. 여러분의 목소리가 먼저입니다.","가능할 때 언제든"]],"commitH":"참여 시간은 원하는 만큼","commit":[["가끔","행사 돕기, 한 페이지 번역, 앱 한 번 시험해 보기."],["정기적으로","한 달에 몇 시간 홍보, 번역, 자문."],["깊게","명확한 프로젝트와 멘토가 있는 한 학기 인턴십이나 지속적인 개발 역할."]],"contactQ":"질문이 있으신가요? 이메일:","joinH":"참여하기","joinI":"가게, 근로자, 자원봉사자, 인턴, 엔지니어, 파트너, 후원자를 찾고 있습니다. 함께 만들어 주세요.","btns":{"owner":["가게를 운영합니다","첫 그룹에 참여"],"worker":["가게에서 일합니다","필요한 것을 알려 주세요"],"volunteer":["자원봉사를 원합니다","홍보, 번역, 디자인"],"intern":["인턴 또는 엔지니어","연구, 공중보건, 앱 개발"],"partner":["협력하고 싶습니다","근로자 센터, 클리닉, 대학"],"funder":["이야기 나눠요","재단, 후원자, 기관"]},"fName":"이름","fContact":"이메일 또는 전화번호","msgs":{"owner":"가게에 대해 알려 주세요","worker":"일하는 데 무엇이 도움이 될까요? 어떤 언어로 써도 됩니다.","volunteer":"무엇을 돕고 싶으신가요? 어떤 언어를 하시나요?","intern":"학교나 기술, 일주일에 가능한 시간을 알려 주세요","partner":"단체에 대해 알려 주세요","funder":"단체에 대해, 그리고 어떻게 함께 일하고 싶은지 알려 주세요"},"send":"보내기","eReq":"연락을 위해 이름과 이메일 또는 전화번호를 적어 주세요.","thanks":"감사합니다! 메시지를 받았으며 곧 연락드리겠습니다.","sending":"보내는 중…","sendErr":"전송되지 않았습니다. 다시 시도하거나 다음 주소로 이메일을 보내 주세요:","np":"설립 준비 중인 비영리 단체.","contact":"연락처","replay":"소개 다시 보기","ways":[["일터에서 겪는 일 알려 주기","일하면서 힘들거나 위험하거나 헷갈리는 점을 알려 주세요. 여러분의 답이 우리가 만드는 모든 것을 정합니다."],["가게를 일찍 참여시키기","시범 사업을 함께 만드는 첫 가게가 되어 주세요."],["시간과 재능 나누기","지역에서 자원봉사하고, 근로자를 위해 번역하거나, 인턴으로 함께하세요."],["도구를 함께 만들기","엔지니어와 디자이너: 필요한 곳에서 근로자와 가게를 위한 도구를 함께 만들어 주세요."],["협력하기","클리닉, 학교, 근로자 센터, 후원자: 함께 일하는 방법을 이야기해요."]],"bridge":"하나의 제품이 아닙니다. 각 일터에 필요한 것이면 무엇이든.","rolesH":"우리가 일하는 방식","rolesI":"우리는 한 도시의 서로 다른 소규모 사업장 세 곳에서 시작합니다. 각 사업장은 저마다 다른 산업 보건·안전 과제를 안고 있습니다. 업주와 근로자와 가까이 일하며 무엇이 필요한지 파악하고, 기존 자원과 연결하고, 공백이 남은 곳에는 실용적인 해결책을 만들 것입니다. 이 첫 시범 사업에서 배운 것이 OEM360이 성장하고 더 많은 지역사회를 돕는 방향을 이끌 것입니다.","roles8":[["연결하기","직업 건강 클리닉, 근로자 센터, OSHA 현장 상담 프로그램처럼 이미 있는 무료 도움에 가게와 근로자를 연결합니다. 이 프로그램은 무료이고 비밀이 보장되며 단속과 분리되어 있어 위반 통지나 벌금이 없습니다. 업주가 신청하고, 발견된 심각한 위험은 고치기로 동의합니다."],["검증된 프로그램 들여오기","다른 곳에서 효과가 있는 프로그램을 지역 단체와 함께 우리가 시작하는 주로 들여옵니다. 예를 들어 캘리포니아의 건강한 네일 살롱 인증 프로그램은 각 카운티와 주 독성물질관리국이 운영하는 무료 자율 프로그램으로, 살롱 근로자와 손님, 환경을 보호합니다. 효과를 확인하면 비슷한 것을 천천히 시작할 수 있습니다."],["도구 만들기","근로자가 자신과 자신의 의사를 위해 보관하는 개인 노출 기록처럼, 정말 도움이 되는 곳에 간단하고 비공개이며 다국어인 소프트웨어를 만듭니다."],["번역하기","안전 자료를 스페인어, 중국어, 한국어, 네팔어, 타갈로그어, 베트남어, 아이티 크리올어 등으로 알기 쉽게 만듭니다."],["모으기","업주, 근로자, 클리닉, 지역 단체, 학교가 한자리에 모이게 합니다."],["등록 돕기","업주가 기존 프로그램과 도구에 등록하도록 돕고 서류를 처리합니다."],["대변하기","소규모 사업장 근로자와 그들의 필요를 그들의 언어로 대변합니다."],["재원 연결","가게와 지역 파트너가 지원금과 자원을 찾도록 돕고, 앞으로는 지역 프로그램에 자금을 전달합니다."]],"toolsI":"소프트웨어는 우리가 도울 수 있는 여러 방법 중 하나일 뿐입니다. 연구에서 어떤 도구가 일터에 정말 도움이 된다고 확인되면 만듭니다. 간단하고, 비공개이며, 다국어이고, 무료입니다.","disc":"OEM360은 설립 준비 중인 비영리 단체입니다. 의료나 법률 조언을 제공하지 않습니다. 응급 상황에는 911에 전화하세요.","pilot":"한 주에서 시작해 그곳에서부터 넓혀 갑니다.","status":"1단계: 듣고 협력 관계를 만드는 중입니다. 아직 서비스를 제공하지 않습니다.","pilotTag":"시범","laterTag":"나중에","aboutH":"OEM360 소개","seekH":"찾고 있습니다","seek":["지도 교수","재정 후원 기관","우리가 시작하는 주의 지역 파트너"],"whoH":"이미 이 일을 하는 곳들","whoI":"이미 중요한 일을 하는 단체가 많습니다. 우리는 그들과 소속 관계가 없습니다. 우리의 역할은 작은 가게와 근로자가 그들이 제공하는 것을 자신의 언어로 찾고 이용하도록 돕는 것입니다.","who":[["OSHA 현장 상담 프로그램","모든 주에서 소규모 사업장을 위한 무료 비밀 안전 지원으로, 단속과 분리되어 있습니다. 위반 통지나 벌금이 없습니다. 업주가 신청하고, 발견된 심각한 위험은 고치기로 동의합니다."],["직업 건강 클리닉","업무 관련 질병을 진단하고 예방을 돕는 클리닉으로, 보험이 없는 사람을 돕는 곳도 있습니다."],["COSH 단체","여러 주에서 교육과 옹호 활동을 하는 지역 근로자 안전 연합."],["근로자 센터와 지역 단체","이민 근로자를 지원하는 단체로, 대개 그들의 언어로 돕습니다."],["주와 지역 프로그램","캘리포니아 일부 카운티의 건강한 네일 살롱 인증, 그리고 살롱 환기 같은 문제에 관한 주 규정 등."]],"evH":"우리가 참고하는 근거","ev":[["필라델피아 네일 살롱","연구자들과 베트남계 네일 살롱 공동체가 함께 건강 프로그램을 설계해, 처음부터 공동체와 함께 만드는 것의 가치를 보여 주었습니다."],["투손의 자동차 정비소와 미용실","지역 보건 요원 프로그램은 대부분의 가게가 계속 참여하게 했지만, 화학물질 수치가 크게 줄지는 않았습니다. 환기나 더 안전한 제품 같은 개선에 가게당 최대 300달러를 지원했습니다. 우리는 두 교훈을 모두 진지하게 받아들입니다."]],"outcome":"미리 정한 주요 지표: 핵심 안전 개선을 실제로 갖춘 가게의 비율을 직접 확인합니다. 연구는 대학의 윤리 심의를 거쳐 진행하고, 환기나 더 안전한 제품 같은 개선을 위한 작은 기금을 마련할 계획입니다.","mt":"이 번역은 AI로 만들었으며 원어민이 검토하고 있습니다.","privacy":"공유하신 정보는 OEM360 관련 답변에만 사용합니다. 판매하거나 고용주와 공유하지 않습니다. 건강 정보나 직장 이름은 적지 말아 주세요.","cite":"An occupational and environmental medicine physician, in a public comment","qnote":"","why":"If great employers rarely track what their workers are exposed to, the corner store almost never does.","preview":"","view":"View","desktop":"Desktop","mobile":"Mobile","close":"Close mobile view","founderS":"모든 근로자는 더 안전한 일터를 누려야 한다는 믿음으로 설립되었습니다.","mission":["OEM360은 단순한 믿음에서 시작되었습니다. 근로자의 건강과 안전은 일하는 사업장의 규모에 따라 달라져서는 안 됩니다.","소규모 사업장은 지역사회의 중심이지만, 그곳에서 일하는 사람들은 대기업이 누리는 자원, 안내, 지원 없이 예방 가능한 위험을 자주 마주합니다.","OEM360은 그 격차를 줄이기 위해 존재합니다. 지역에서 시작해 근로자와 업주의 이야기를 듣고, 실용적이고 오래가는 해결책을 함께 만들어 갑니다."]},"ne":{"nav":{"what":"हामी के गर्छौं","research":"अनुसन्धान","help":"सँगै बनाऔं","join":"सहभागी हुनुहोस्","menu":"मेनु","lang":"भाषा"},"h1a":"ठूला कम्पनीहरूसँग सुरक्षा विभाग हुन्छ।","h1b":"साना पसलहरूसँग हुँदैन।","lede":"OEM360 साना व्यवसाय र तिनमा काम गर्ने मानिसहरूको स्वास्थ्य र सुरक्षाका लागि समर्पित एक गैरनाफामूलक संस्था हो, उनीहरूकै भाषामा, थोरै खर्चमा वा निःशुल्क।","promise":"हरेक कामदार। हरेक कार्यस्थल।","hint":"हामी एउटा राज्यबाट सुरु गर्नेछौं। पसल छानेर त्यहाँका कामदारले के भोग्छन् र हामी कसरी मद्दत गर्न     const sc = e.target.closest('[data-scene]'); if (sc) { openScene(sc.dataset.scene); return; }
    if (e.target.closest('[data-scene-back]')) { openScene(null); return; }
    const hz = e.target.closest('[data-hz]'); if (hz) { hzOn(hz.dataset.hz); return; }
    const s = e.target.closest('[data-shop]'); if (s) { openScene(s.dataset.shop); return; }
    const w = e.target.closest('[data-who]'); if (w) { who = w.dataset.who; render(true); return; }

    if (e.target.closest('.navlinks a')) { menuOpen = false; document.getElementById('nav').classList.remove('is-open'); }
    const tb = e.target.closest('[data-tab]'); if (tb) { e.preventDefault(); goTab(tb.dataset.tab); return; }
    if (e.target.closest('#themeBtn')) { window.oemTheme && window.oemTheme(); return; }
    if (e.target.closest('#replay')) { window.replayIntro && window.replayIntro(); return; }
    const v = e.target.closest('[data-view]'); if (v) { if (v.dataset.view === 'mobile') openPhone(); return; }

  /* phone preview */
  function openPhone() {
    const t = SITE[L]; let ov = document.getElementById('phoneview');

    const h = root.querySelector('.hero h1'); if (h) { h.setAttribute('tabindex','-1'); h.focus({ preventScroll:true }); }
  };
  render();
})();

  const nav = (t, last) => `<div class="gbtns"><button class="gbtn ghost" type="button" data-g="back">${t.back}</button><button class="gbtn" type="${last ? 'button' : 'submit'}" data-g="${last ? 'open' : 'next'}">${last ? t.open : t.next}</button></div>`;
  const screens = [
    t => `${bars(0)}${slides()}<h1 id="gTitle">${t.w1}<span class="l2">${t.w2}</span></h1><p class="gp">${t.cp}</p>
      <form id="gform" novalidate><label class="gfield">${t.label}<input id="gin" inputmode="email" autocomplete="email" placeholder="${t.ph}" value="${contact.replace(/"/g,'&quot;')}"></label>
      <p class="gerr" id="gerr" role="alert"></p><p class="gnote">${t.note}</p><div class="gbtns"><button class="gbtn" type="submit" data-g="next">${t.next}</button></div><button type="button" class="gskip" data-g="skip">${t.skip} →</button></form>`,
    t => `${bars(1)}<h1 id="gTitle">${t.who}</h1><p class="gp">${t.whoP}</p>
      <form id="gform" novalidate><div class="gchips">${CATS.map(c => `<button type="button" data-cat="${c}" aria-pressed="${roles.includes(c)}">${t.cats[c]}</button>`).join('')}</div>
      <p class="gerr" id="gerr" role="alert"></p>${nav(t)}</form>`,
    t => `${bars(2)}${slides()}<h1 id="gTitle">${t.p1}<span class="l2">${t.p2}</span></h1><p class="gp">${t.pp}</p>
      <p class="ghint">${(GAPS[lang] || GAPS.en).hint}</p><div class="gfields">${FIELDS.map(f => `<button type="button" class="gflip" data-flip aria-pressed="false"><span class="gf gfront"><svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${ICON[f]}</svg><span>${t.fields[f]}</span></span><span class="gf gback"><small>${(GAPS[lang] || GAPS.en).head}</small><span>${(GAPS[lang] || GAPS.en).ex[f]}</span></span></button>`).join('')}</div>
      ${nav(t).replace('type="submit"','type="button"')}`,
    t => { const mine = new Set(roles.map(r => WAYMAP[r]).filter(x => x !== undefined));
      return `${bars(3)}${slides()}<h1 id="gTitle">${t.pur}</h1><p class="gp">${t.purP}</p><h2 class="gh2">${t.inv}</h2>
      <ul class="gways">${window.SITE[lang].ways.map((w, i) => `<li class="${mine.has(i) ? 'mine' : ''}"><span><b>${w[0]}</b><small>${w[1]}</small></span>${mine.has(i) ? `<em>${t.forYou}</em>` : ''}</li>`).join('')}</ul>${nav(t, true)}`; }
  ];
  const paint = () => { const t = T[lang]; const sk = document.getElementById('gSkip'); if (sk) sk.textContent = (t.skipAll || 'Skip intro') + ' →'; card.setAttribute('lang', lang); card.innerHTML = screens[step](t); const f = card.querySelector('input') || card.querySelector('.gbtn:not(.ghost)'); if (f) f.focus({ preventScroll:true }); gate.scrollTop = 0; };
  const openSite = (fresh) => { if (fresh && contact && store.get('oem360_sent') !== contact && window.oemSend) { window.oemSend({ _subject: 'OEM360 new sign-up', form: 'Onboarding sign-up', contact, roles: roles.join(', '), language: lang }).then(() => store.set('oem360_sent', contact)).catch(() => {}); }
    gate.classList.add('hidden'); document.body.classList.remove('gated'); store.set('oem360_seen','1'); store.set('oem360_lang', lang); store.set('oem360_roles', JSON.stringify(roles)); if (contact) store.set('oem360_contact', contact); window.siteOpen(lang, contact, roles, fresh); };

  const advance = () => { const t = T[lang], err = document.getElementById('gerr');
    if (step === 0) { const v = document.getElementById('gin').value.trim();
      if (!v) { err.textContent = t.eEmpty; return; } if (!isEmail(v) && !isPhone(v)) { err.textContent = t.eBad; return; } contact = v; }
    if (step === 1 && !roles.length) { err.textContent = t.eWho; return; }
    step++; paint(); };
  card.addEventListener('submit', e => { e.preventDefault(); advance(); });
  card.addEventListener('click', e => {
    const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; paint(); return; }
    const fl = e.target.closest('[data-flip]'); if (fl) { fl.setAttribute('aria-pressed', fl.getAttribute('aria-pressed') !== 'true'); return; }
    const c = e.target.closest('[data-cat]'); if (c) { const k = c.dataset.cat; roles = roles.includes(k) ? roles.filter(x => x !== k) : [...roles, k]; c.setAttribute('aria-pressed', roles.includes(k)); const err = document.getElementById('gerr'); if (err) err.textContent = ''; return; }
    const b = e.target.closest('[data-g]'); if (!b) return; const g = b.dataset.g;
    if (g === 'skip') { contact = ''; step++; paint(); } else if (g === 'back') { step--; paint(); } else if (g === 'open') openSite(true); else if (g === 'next' && b.type !== 'submit') advance(); });
  window.gateLang = l => { lang = l; };
  window.replayIntro = () => { step = 0; gate.classList.remove('hidden'); document.body.classList.add('gated'); paint(); };
  if (store.get('oem360_seen')) openSite(); else paint();


})();
</script>
</body>
</html>
